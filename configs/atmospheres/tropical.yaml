# Atmosphere preset "tropical" -- an atmosphere TYPE, not weather. T_air, RH and visibility
# come from the WeatherSeries (CLAUDE.md #6). Schema: irsim.config.atmosphere (ADR 0048, 0049).
#
# gamma_B = gamma0 + beta * w + aerosol_ratio_to_visible * gamma_aer,vis(V)   [1/m, w in g/m^3]
# All values ESTIMATED: fitted to the docs/physics-model.md section 7.2 table midpoints, see
# docs/decisions/0049-aerosol-scaling-and-fog-regimes.md for the derivation. Replace with a
# MODTRAN-fitted table when one is available.

schema_version: 2
atmosphere:
  name: tropical
  description: "Tropical, maritime aerosol (large sea-salt particles: flatter extinction with wavelength)"
  aerosol_regime: maritime
  valid_range_m: 500
  bands:
    # molecular coefficients (water vapour) are the same physics in every preset
    # AT.27 (ADR 0160): LWIR beta1 = 4.61e-5 - beta2 * w_dry with w_dry = 5.895 g/m3 (the us_standard_clear
    # check, 288.15 K / RH 0.46), written in full so the clear-dry anchor is the number it was, bit for bit.
    lwir:    {gamma0_per_m: 7.5e-5,  beta_per_m_per_g_m3: 4.1030698195017574e-05, beta2_per_m_per_g2_m6: 8.6e-7, aerosol_ratio_to_visible: 0.30}
    mwir:    {gamma0_per_m: 1.56e-4, beta_per_m_per_g_m3: 1.63e-5, aerosol_ratio_to_visible: 0.40}
    swir:    {gamma0_per_m: 9.4e-5,  beta_per_m_per_g_m3: 1.16e-5, aerosol_ratio_to_visible: 0.60}
    nir:     {gamma0_per_m: 2.0e-6,  beta_per_m_per_g_m3: 3.0e-6,  aerosol_ratio_to_visible: 0.80}   # no table row: interpolated
    visible: {gamma0_per_m: 1.2e-5,  beta_per_m_per_g_m3: 0.0,     aerosol_ratio_to_visible: 1.0}  # Rayleigh at 0.55 um
  profile:
    water_vapour_scale_height_m: 2000
    lapse_rate_k_per_m: 6.2e-3
  solar:
    # tau_sun(theta_zen) = tau_zenith ** (1 / cos theta) -- plane-parallel Bouguer (M8.8).
    # ESTIMATED whole-column values (tropical, maritime aerosol); the real solar path arrives with M11 (ADR 0051).
    zenith_transmittance: {visible: 0.66, nir: 0.78, swir: 0.83, mwir: 0.76, lwir: 0.7}
  provenance:
    status: ESTIMATED
    source: "docs/physics-model.md section 7.2 table midpoints; ADR 0049"
    note: "Checked against the 'Humid' row at 300.0 K, RH 0.74 (19 g/m^3, the AFGL tropical sea-level value), V = 23 km. Maritime ratios ESTIMATED without a table row."
