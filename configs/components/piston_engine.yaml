  kind: piston_engine
  description: 50 cc single-cylinder two-stroke, air-cooled, 3.5 kW shaft
  mass_kg: 2.0
  specific_heat_j_kgk: 600.0          # aluminium head and crankcase, steel liner and crank
  rated_power_in_w: 14000.0           # fuel power: 3.5 kW shaft at 25 % thermal efficiency
  efficiency: 0.25
