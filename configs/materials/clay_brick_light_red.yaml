# Clay brick light red: New light red clay brick.
#
# Written by scripts/import_slum.py (roadmap XD.13) -- edit the script, not this file.
# SLUM sample B008: NIR, SWIR, LWIR and the solar absorptivity are measured on this one sample
# (short-wave reflectance and long-wave emissivity, beside this material under
# data/spectra/materials/slum/, one curve in `optical`). Below 8.0 um LWIR uses its band value; the
# solar absorptivity covers 0.35-2.5 um (97 % of the AM1.5 direct
# energy in 0.3-4 um). MWIR, which SLUM did not measure, comes from the source in `reference`.
schema_version: 2
material:
  name: clay_brick_light_red
  source: literature
  surface_treatment: as_manufactured
  reference: "NIR, SWIR, LWIR and solar absorptivity: SLUM, the Spectral Library of impervious Urban Materials: S. Kotthaus, T. E. L. Smith, M. J. Wooster, C. S. B. Grimmond (2014), Derivation of an urban materials spectral library through emittance and reflectance spectroscopy, ISPRS J. Photogramm. Remote Sens. 94, 194-212, doi:10.1016/j.isprsjprs.2014.05.005; data doi:10.5281/zenodo.4263842 (MPL-2.0), sample B008 (data/spectra/materials/slum/clay_brick_light_red_sw.csv and _lw.csv). MWIR from the same class of surface, not this sample: MODIS UCSB Emissivity Library (Z. Wan, ICESS, UC Santa Barbara), https://icess.eri.ucsb.edu/modis/EMIS/html/em.html, directional-hemispherical emissivity measured with a MIDAC FTIR and an integrating sphere, 3.3-14.5 um [R42]; clybrkcm.prn (Clay Brick (Common)), over 3.34-5.0 um (83 % of the band); cited, not committed. Thermal: common brick, Incropera, DeWitt, Bergman & Lavine, Fundamentals of Heat and Mass Transfer, Table A.3"
  description: "New light red clay brick"
  thermal:
    density_kg_m3: 1920
    specific_heat_j_kgk: 835
    conductivity_w_mk: 0.72
    thickness_m: 0.1   # ESTIMATED: a typical part or layer
    solar_absorptivity: 0.571   # computed from the SLUM curve, not typed
  optical:
    spectral_emissivity:   # the committed measured curves, see the header
      - {file: spectra/materials/slum/clay_brick_light_red_sw.csv, quantity: reflectance}   # opaque: 1 - R
      - spectra/materials/slum/clay_brick_light_red_lw.csv
    emissivity_per_band: {mwir: 0.674, lwir: 0.940}   # computed; only where no curve is committed
    roughness_per_band: {nir: 0.85, swir: 0.85, mwir: 0.8, lwir: 0.75}   # ESTIMATED, as the class
    angular_model: {type: empirical, a: 0.05, p: 4.0}   # ESTIMATED, as the class
