# Chrome plated: Chrome plating on steel: bumpers, exhaust tips, motorcycle trim. The plating is micrometres thick, so the heat is the steel's and the optics are the chromium's.
#
# Written by scripts/import_material_spectra.py (roadmap XD.13) -- edit the script, not this file.
# The emissivity is a curve computed from published optical constants (data/nk/chromium.csv, whose
# source block names the paper) and the solar absorptivity is computed from the same curve under
# the AM1.5 direct spectrum (irsim.materials.spectra.solar_absorptance). This is the POLISHED
# state: the lower bound of this metal's emissivity. A real part in service is rougher and more
# oxidised, and both raise it (section 4.5); that is a different material, not this one.
schema_version: 2
material:
  name: chrome_plated
  source: literature
  surface_treatment: polished
  reference: "Optical constants: A. D. Rakić, A. B. Djurišic, J. M. Elazar, M. L. Majewski. Optical properties of metallic films for vertical-cavity optoelectronic devices. Appl. Opt. 37, 5271-5283 (1998) (Fit of experimental data from several sources to Lorentz-Drude (LD) model.) via RefractiveIndex.INFO (CC0), data/nk/chromium.csv. Thermal: the steel under the plating: plain carbon steel, Incropera, DeWitt, Bergman & Lavine, Fundamentals of Heat and Mass Transfer, Table A.1 (300 K)"
  description: "Chrome plating on steel: bumpers, exhaust tips, motorcycle trim. The plating is micrometres thick, so the heat is the steel's and the optics are the chromium's"
  thermal:
    density_kg_m3: 7854
    specific_heat_j_kgk: 434
    conductivity_w_mk: 60.5
    thickness_m: 0.0015   # ESTIMATED: a typical part
    solar_absorptivity: 0.352   # computed from the curve, not typed
  optical:
    spectral_emissivity: spectra/materials/chrome_plated.csv
    roughness_per_band: {nir: 0.02, swir: 0.02, mwir: 0.01, lwir: 0.01}   # ESTIMATED, polished
    # Level A from the same table the curve came from: a metal's emissivity RISES toward grazing,
    # which only Fresnel on n and k represents (section 4.2).
    angular_model: {type: fresnel, n_k_file: nk/chromium.csv}
