# Playa dry mud: Dry desert playa mud: a flat, bright desert floor.
#
# Written by scripts/import_paired_spectra.py (roadmap XD.13) -- edit the script, not this file.
# Paired measurements: Stonewall playa dry mud (USGS) with Railroad Valley playa soil (UCSB).
# NIR and SWIR are read from the USGS curve beside this material, as 1 - R (ADR 0175).
# The solar absorptivity is its AM1.5 average over the 0.35-2.5 um measured
# (97 % of the direct energy in 0.3-4 um). MWIR and LWIR come from the second source
# named in `reference`.
schema_version: 2
material:
  name: playa_dry_mud
  source: literature
  surface_treatment: natural
  reference: "NIR, SWIR and solar absorptivity: USGS Spectral Library Version 7 (Kokaly et al. 2017, U.S. Geological Survey Data Series 1035, doi:10.3133/ds1035; data doi:10.5066/F7RR1WDJ), splib07a, public domain, record 'splib07a Record=13304: Stonewall_Playa_Dry_Mud 2001 ASDFRa AREF' (data/spectra/materials/usgs/playa_dry_mud.csv). MWIR and LWIR: MODIS UCSB Emissivity Library (Z. Wan, ICESS, UC Santa Barbara), https://icess.eri.ucsb.edu/modis/EMIS/html/em.html, directional-hemispherical emissivity measured with a MIDAC FTIR and an integrating sphere, 3.3-14.5 um [R42]; files railpwd1.prn, railpwd2.prn (Powder Sample 1 from Railroad Valley; Powder Sample 2 from Railroad Valley), averaged, retrieved 2026-09-29. MWIR over the measured 3.34-5.0 um (83 % of the band). Not committed: the library states no licence, so only these band values are extracted. Thermal: soil_dry"
  description: "Dry desert playa mud: a flat, bright desert floor"
  thermal:
    density_kg_m3: 1500
    specific_heat_j_kgk: 800
    conductivity_w_mk: 0.3
    thickness_m: 0.1   # ESTIMATED: a typical part or layer
    solar_absorptivity: 0.549   # computed from the USGS curve, not typed
  optical:
    spectral_emissivity:   # the committed measured curves, see the header
      - {file: spectra/materials/usgs/playa_dry_mud.csv, quantity: reflectance}   # opaque: 1 - R
    emissivity_per_band: {mwir: 0.806, lwir: 0.949}   # computed; only where no curve is committed
    roughness_per_band: {nir: 0.9, swir: 0.9, mwir: 0.85, lwir: 0.8}   # ESTIMATED, as the class's existing material
    angular_model: {type: empirical, a: 0.04, p: 4.0}   # ESTIMATED, as the class
