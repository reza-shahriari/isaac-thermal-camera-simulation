# Seawater: Open-ocean sea water, calm.
#
# Written by scripts/import_paired_spectra.py (roadmap XD.13) -- edit the script, not this file.
# Paired measurements: open-ocean water (USGS) with a ten-set seawater average (UCSB).
# NIR and SWIR are the library's band averages of 1 - R of the USGS curve beside this material.
# The solar absorptivity is its AM1.5 average over the 0.35-2.5 um measured
# (97 % of the direct energy in 0.3-4 um). MWIR and LWIR come from the second source
# named in `reference`.
schema_version: 2
material:
  name: seawater
  source: literature
  surface_treatment: natural
  reference: "NIR, SWIR and solar absorptivity: USGS Spectral Library Version 7 (Kokaly et al. 2017, U.S. Geological Survey Data Series 1035, doi:10.3133/ds1035; data doi:10.5066/F7RR1WDJ), splib07a, public domain, record 'splib07a Record=13635: Seawater_Open_Ocean SW2 lwch BECKa AREF' (data/spectra/materials/usgs/seawater.csv). MWIR and LWIR: MODIS UCSB Emissivity Library (Z. Wan, ICESS, UC Santa Barbara), https://icess.eri.ucsb.edu/modis/EMIS/html/em.html, directional-hemispherical emissivity measured with a MIDAC FTIR and an integrating sphere, 3.3-14.5 um [R42]; files seawat10.prn (Seawater - Emissivity Averaged Over 10 sets), averaged, retrieved 2026-09-29. MWIR over the measured 3.33-5.0 um (83 % of the band). Not committed: the library states no licence, so only these band values are extracted. Thermal: water"
  description: "Open-ocean sea water, calm"
  thermal:
    density_kg_m3: 1025
    specific_heat_j_kgk: 3990
    conductivity_w_mk: 0.6
    thickness_m: 0.1   # ESTIMATED: a typical part or layer
    solar_absorptivity: 0.975   # computed from the USGS curve, not typed
  optical:
    emissivity_per_band: {nir: 0.980, swir: 0.981, mwir: 0.978, lwir: 0.985}   # computed, see the header
    roughness_per_band: {nir: 0.06, swir: 0.05, mwir: 0.04, lwir: 0.03}   # ESTIMATED, as the class's existing material
    angular_model: {type: fresnel, n_k_file: nk/water.csv}
