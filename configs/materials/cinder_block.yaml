# Cinder block: Grey cinder (concrete) block.
#
# Written by scripts/import_paired_spectra.py (roadmap XD.13) -- edit the script, not this file.
# Paired measurements: a grey cinder block (USGS) with a natural masonry cap (UCSB).
# NIR and SWIR are the library's band averages of 1 - R of the USGS curve beside this material.
# The solar absorptivity is its AM1.5 average over the 0.35-2.5 um measured
# (97 % of the direct energy in 0.3-4 um). MWIR and LWIR come from the second source
# named in `reference`.
schema_version: 2
material:
  name: cinder_block
  source: literature
  surface_treatment: weathered
  reference: "NIR, SWIR and solar absorptivity: USGS Spectral Library Version 7 (Kokaly et al. 2017, U.S. Geological Survey Data Series 1035, doi:10.3133/ds1035; data doi:10.5066/F7RR1WDJ), splib07a, public domain, record 'splib07a Record=18548: Cinder_Block GDS356 Lg Grey ASDFRa AREF' (data/spectra/materials/usgs/cinder_block.csv). MWIR and LWIR: MODIS UCSB Emissivity Library (Z. Wan, ICESS, UC Santa Barbara), https://icess.eri.ucsb.edu/modis/EMIS/html/em.html, directional-hemispherical emissivity measured with a MIDAC FTIR and an integrating sphere, 3.3-14.5 um [R42]; files masonnat.prn (Masonry m.cap-Natural), averaged, retrieved 2026-09-29. MWIR over the measured 3.34-5.0 um (83 % of the band). Not committed: the library states no licence, so only these band values are extracted. Thermal: concrete"
  description: "Grey cinder (concrete) block"
  thermal:
    density_kg_m3: 2300
    specific_heat_j_kgk: 880
    conductivity_w_mk: 1.4
    thickness_m: 0.1   # ESTIMATED: a typical part or layer
    solar_absorptivity: 0.653   # computed from the USGS curve, not typed
  optical:
    emissivity_per_band: {nir: 0.650, swir: 0.654, mwir: 0.953, lwir: 0.956}   # computed, see the header
    roughness_per_band: {nir: 0.85, swir: 0.85, mwir: 0.8, lwir: 0.75}   # ESTIMATED, as the class's existing material
    angular_model: {type: empirical, a: 0.05, p: 4.0}   # ESTIMATED, as the class
