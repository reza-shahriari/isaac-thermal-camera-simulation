# Slate roof: Weathered black slate roof shingle, upper face (with moss). This is the paper's L001u: the released CSV labels the two faces the other way round, and its L001d column reproduces the paper's L001u row (albedo 0.09, emissivity 0.90).
#
# Written by scripts/import_slum.py (roadmap XD.13) -- edit the script, not this file.
# SLUM sample L001d: NIR, SWIR, LWIR and the solar absorptivity are measured on this one sample
# (short-wave reflectance and long-wave emissivity, beside this material under
# data/spectra/materials/slum/). LWIR covers the 8.0-13.5 um measured (92 % of the band); the
# solar absorptivity covers 0.35-2.5 um (97 % of the AM1.5 direct
# energy in 0.3-4 um). MWIR, which SLUM did not measure, comes from the source in `reference`.
schema_version: 2
material:
  name: slate_roof
  source: literature
  surface_treatment: weathered
  reference: "NIR, SWIR, LWIR and solar absorptivity: SLUM, the Spectral Library of impervious Urban Materials: S. Kotthaus, T. E. L. Smith, M. J. Wooster, C. S. B. Grimmond (2014), Derivation of an urban materials spectral library through emittance and reflectance spectroscopy, ISPRS J. Photogramm. Remote Sens. 94, 194-212, doi:10.1016/j.isprsjprs.2014.05.005; data doi:10.5281/zenodo.4263842 (MPL-2.0), sample L001d (data/spectra/materials/slum/slate_roof_sw.csv and _lw.csv). MWIR from the same class of surface, not this sample: MODIS UCSB Emissivity Library (Z. Wan, ICESS, UC Santa Barbara), https://icess.eri.ucsb.edu/modis/EMIS/html/em.html, directional-hemispherical emissivity measured with a MIDAC FTIR and an integrating sphere, 3.3-14.5 um [R42]; flagbuck.prn (Auyona Flagstone - Buckskin Color), over 3.34-5.0 um (83 % of the band); cited, not committed. Thermal: ESTIMATED: a dense stone, between granite and sandstone in Table A.3, 5 mm"
  description: "Weathered black slate roof shingle, upper face (with moss). This is the paper's L001u: the released CSV labels the two faces the other way round, and its L001d column reproduces the paper's L001u row (albedo 0.09, emissivity 0.90)"
  thermal:
    density_kg_m3: 2700
    specific_heat_j_kgk: 760
    conductivity_w_mk: 2.0
    thickness_m: 0.005   # ESTIMATED: a typical part or layer
    solar_absorptivity: 0.911   # computed from the SLUM curve, not typed
  optical:
    emissivity_per_band: {nir: 0.907, swir: 0.909, mwir: 0.832, lwir: 0.900}   # computed, see the header
    roughness_per_band: {nir: 0.75, swir: 0.75, mwir: 0.7, lwir: 0.65}   # ESTIMATED, as the class
    angular_model: {type: empirical, a: 0.05, p: 4.0}   # ESTIMATED, as the class
