# Painted plastic / composite airframe shell -- the body of a small quadcopter or a light-aircraft
# fairing. Matte polyurethane or acrylic topcoat over ABS/PC or glass-reinforced plastic; the paint
# is what the camera sees, so LWIR/MWIR follow the section 16.2 "car paint" row (the binder, not the
# substrate, sets epsilon). NIR/SWIR are ESTIMATED for a light grey shell and are tied to
# solar_absorptivity 0.35: a light livery absorbs roughly a third of the short-wave flux.
# Schema: irsim.config.materials. Values: literature (section 16.2) + ESTIMATED where marked.
schema_version: 2
material:
  name: painted_composite
  source: literature
  surface_treatment: painted
  reference: "docs/physics-model.md section 16.2 (paint row); NIR/SWIR and thermal ESTIMATED for a moulded shell"
  description: "Quadcopter body shell / painted composite fairing; the topcoat sets epsilon, not the substrate"
  thermal:
    density_kg_m3: 1400        # ABS/PC with a thin paint layer, ESTIMATED
    specific_heat_j_kgk: 1400  # thermoplastic, ESTIMATED
    conductivity_w_mk: 0.25    # through-thickness, ESTIMATED
    thickness_m: 0.0020
    solar_absorptivity: 0.35   # light grey livery, ESTIMATED
  optical:
    emissivity_per_band: {nir: 0.30, swir: 0.40, mwir: 0.90, lwir: 0.92}
    roughness_per_band: {nir: 0.35, swir: 0.30, mwir: 0.18, lwir: 0.12}   # section 4.3, ESTIMATED
    # Level B, FITTED against Level A on the M7.5 paint proxy (PMMA, data/nk/paint_proxy.csv),
    # which is what §4.2 asks for -- "fit (a, p) once per material class against Level A and bake
    # it". Per-band fits give a = 0.732-0.770 with p pinned at 4; the joint fit over all four is
    # a = 0.748, rounded here. It REPLACES an estimate of a = 0.25, p = 5, which was far too flat:
    # that model held eps at 0.97 of normal at 70 deg where Fresnel on a clearcoat gives 0.86.
    # ⚠️ §4.2's own prose quotes a ~ 0.15-0.35 for painted metals and plastics. The fit disagrees by
    # 2-3x and the fit wins, because §4.2 also *instructs* the fit and §4.3 puts a clearcoat in the
    # optically smooth regime in LWIR (sigma << lambda/8). Raised as spec issue S40.
    angular_model: {type: empirical, a: 0.75, p: 4.0}
    transmittance_per_band: {nir: 0.0, swir: 0.0, mwir: 0.0, lwir: 0.0}
