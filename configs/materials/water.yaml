# Liquid water: the maritime background, puddles, wet road. Section 16.2 for the scalars.
# The ONLY material in the library with a measured n/k table behind it (Segelstein 1981), which
# is why it carries Level A -- a sea surface is an angular emissivity problem before it is
# anything else (ADR 0078). NIR/SWIR emissivities are ESTIMATED; §16.2 quotes only the two
# thermal bands.
schema_version: 2
material:
  name: water
  source: literature
  surface_treatment: natural
  reference: "docs/physics-model.md section 16.2; n/k from Segelstein (1981) via data/nk/water.csv"
  description: "Open water. eps collapses toward grazing, which is what a sea background is made of"
  thermal:
    density_kg_m3: 1000
    specific_heat_j_kgk: 4180
    conductivity_w_mk: 0.60
    thickness_m: 0.10
    solar_absorptivity: 0.93
  optical:
    # NOTE a discrepancy worth knowing about. §16.2 gives eps_LWIR = 0.96, while Fresnel on the
    # checked-in Segelstein table gives 0.99 at normal incidence and 0.951 hemispherically
    # (M7.8). ADR 0043 reads the §16.2 column as normal incidence, and on that reading 0.96 is
    # low -- it sits within 0.01 of the HEMISPHERICAL value, which suggests §16.2's water row is
    # a hemispherical figure rather than a normal-incidence one. The §16.2 number is authored
    # here because the spec is the stated source; the Level A model supplies the angular shape
    # and this value the magnitude, so the discrepancy is a 3 % scale offset and not a shape
    # error. Revisit with ADR 0043.
    emissivity_per_band: {nir: 0.95, swir: 0.98, mwir: 0.98, lwir: 0.96}
    roughness_per_band: {nir: 0.06, swir: 0.05, mwir: 0.04, lwir: 0.03}
    angular_model: {type: fresnel, n_k_file: nk/water.csv}
