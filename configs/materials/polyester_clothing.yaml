# Polyester clothing: a woven or knit PET garment, the fleece and the sports shirt.
# Section 16.2 names only skin, cotton and rubber; this entry is the HU.5 fabric set (ADR 0195). Every
# number marked ESTIMATED in `reference` is a judgement from the cited class of material, not a
# measurement of this garment. Colour never reaches the LWIR emissivity (Zhang, Hu & Zhang 2009); a
# garment's colour changes `solar_absorptivity` and the NIR reflectance through irsim.materials.colour.
schema_version: 2
material:
  name: polyester_clothing
  source: literature
  surface_treatment: as_manufactured
  reference: "LWIR and MWIR: Belliveau, Beauchamp et al. 2020, Textile Research Journal 90(13-14):1431, doi:10.1177/0040517519888825 -- cotton, nylon and polyester at 0.88 over 8-12 um, independent of moisture; Zhang, Hu & Zhang 2009, J. Textile Inst. 100:90, doi:10.1080/00405000701692486 -- order PA > PET > wool > cotton and colour has no effect on a fabric's emissivity. NIR/SWIR ESTIMATED for a mid-tone dye (Kaur et al. 2024, Appl. Spectrosc., doi:10.1177/00037028241258111: dye dominates below 1.1 um, fades in SWIR). Thermal ESTIMATED: a 0.5 mm knit at 350 kg/m3 bulk, PET c_p 1200 J/kg/K"
  description: "Mid-tone polyester knit; a thin, light garment that tracks the air"
  thermal:
    density_kg_m3: 350
    specific_heat_j_kgk: 1200
    conductivity_w_mk: 0.05
    thickness_m: 0.0005
    solar_absorptivity: 0.70
  optical:
    emissivity_per_band: {nir: 0.45, swir: 0.55, mwir: 0.86, lwir: 0.88}
    roughness_per_band: {nir: 0.75, swir: 0.72, mwir: 0.65, lwir: 0.60}
    angular_model: {type: empirical, a: 0.08, p: 4.0}
