# Steel polished: Bright polished carbon steel: machined shafts, fresh-cut edges, tooling.
#
# Written by scripts/import_material_spectra.py (roadmap XD.13) -- edit the script, not this file.
# The emissivity is a curve computed from published optical constants (data/nk/iron.csv, whose
# source block names the paper) and the solar absorptivity is computed from the same curve under
# the AM1.5 direct spectrum (irsim.materials.spectra.solar_absorptance). This is the POLISHED
# state: the lower bound of this metal's emissivity. A real part in service is rougher and more
# oxidised, and both raise it (section 4.5); that is a different material, not this one.
schema_version: 2
material:
  name: steel_polished
  source: literature
  surface_treatment: polished
  reference: "Optical constants: M. R. Querry. Optical constants, Contractor Report CRDC-CR-85034 (1985) via RefractiveIndex.INFO (CC0), data/nk/iron.csv. Thermal: plain carbon steel, Incropera, DeWitt, Bergman & Lavine, Fundamentals of Heat and Mass Transfer, Table A.1 (300 K)"
  description: "Bright polished carbon steel: machined shafts, fresh-cut edges, tooling"
  thermal:
    density_kg_m3: 7854
    specific_heat_j_kgk: 434
    conductivity_w_mk: 60.5
    thickness_m: 0.002   # ESTIMATED: a typical part
    solar_absorptivity: 0.385   # computed from the curve, not typed
  optical:
    spectral_emissivity: spectra/materials/steel_polished.csv
    roughness_per_band: {nir: 0.02, swir: 0.02, mwir: 0.01, lwir: 0.01}   # ESTIMATED, polished
    # Level A from the same table the curve came from: a metal's emissivity RISES toward grazing,
    # which only Fresnel on n and k represents (section 4.2).
    angular_model: {type: fresnel, n_k_file: nk/iron.csv}
