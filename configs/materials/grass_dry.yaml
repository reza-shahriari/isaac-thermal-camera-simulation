# Grass dry: Golden dry grass, cured in summer.
#
# Written by scripts/import_paired_spectra.py (roadmap XD.13) -- edit the script, not this file.
# Paired measurements: golden dry grass (USGS) with three dry-grass sets averaged (UCSB).
# NIR and SWIR are the library's band averages of 1 - R of the USGS curve beside this material.
# The solar absorptivity is its AM1.5 average over the 0.35-2.5 um measured
# (97 % of the direct energy in 0.3-4 um). MWIR and LWIR come from the second source
# named in `reference`.
schema_version: 2
material:
  name: grass_dry
  source: literature
  surface_treatment: natural
  reference: "NIR, SWIR and solar absorptivity: USGS Spectral Library Version 7 (Kokaly et al. 2017, U.S. Geological Survey Data Series 1035, doi:10.3133/ds1035; data doi:10.5066/F7RR1WDJ), splib07a, public domain, record 'splib07a Record=21213: Grass_Golden_Dry GDS480 ASDFRa AREF' (data/spectra/materials/usgs/grass_dry.csv). MWIR and LWIR: MODIS UCSB Emissivity Library (Z. Wan, ICESS, UC Santa Barbara), https://icess.eri.ucsb.edu/modis/EMIS/html/em.html, directional-hemispherical emissivity measured with a MIDAC FTIR and an integrating sphere, 3.3-14.5 um [R42]; files drygras1.prn, drygras2.prn, drygras3.prn (Emissivity of Dry Grass (Averaged over 9 Sets); Emissivity of Dry Grass (Averaged over 9 Sets); Emissivity of Dry Grass (Averaged over 9 Sets)), averaged, retrieved 2026-09-29. MWIR over the measured 3.33-5.0 um (83 % of the band). Not committed: the library states no licence, so only these band values are extracted. Thermal: vegetation_leaf, dried: ESTIMATED, a cured blade holds less water"
  description: "Golden dry grass, cured in summer"
  thermal:
    density_kg_m3: 400
    specific_heat_j_kgk: 1800
    conductivity_w_mk: 0.1
    thickness_m: 0.0005   # ESTIMATED: a typical part or layer
    solar_absorptivity: 0.760   # computed from the USGS curve, not typed
  optical:
    emissivity_per_band: {nir: 0.666, swir: 0.670, mwir: 0.907, lwir: 0.965}   # computed, see the header
    roughness_per_band: {nir: 0.7, swir: 0.7, mwir: 0.6, lwir: 0.55}   # ESTIMATED, as the class's existing material
    angular_model: {type: empirical, a: 0.06, p: 4.0}   # ESTIMATED, as the class
