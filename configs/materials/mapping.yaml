# Material-mapping rules for imported assets (irsim.materials.mapping, ADR 0047).
# Precedence: prim override -> semantic class -> material-name pattern (ordered, first match,
# case-insensitive glob) -> UNMAPPED (id 0, rendered magenta, counted by scripts/audit_materials.py).
schema_version: 1
mapping:
  coverage_threshold: 0.95
  semantic:
    car_body: car_paint_black
    vehicle: car_paint_black
    # AT.18: an aircraft is painted until someone says otherwise. Bare polished skin is
    # rare, and guessing it wrong costs 38 K of apparent temperature (physics-model 4.5).
    aircraft: aircraft_aluminium_painted
    drone: car_paint_black
    road: asphalt_dry
    pedestrian: human_skin
    person: human_skin
    glass: glass_windshield
    # The nine §16.2 materials M7.9 added. Semantic classes first, because an asset that carries
    # a semantic label is telling you what the thing *is*, while a material name is telling you
    # what someone called it.
    vegetation: vegetation_leaf
    tree: vegetation_leaf
    terrain: soil_dry
    ground: soil_dry
    building: concrete
    sidewalk: concrete
    water: water
    sky: water          # only reachable for a water-plane prim; sky pixels never carry a material
  patterns:
    - {match: "*windshield*", material: glass_windshield}
    - {match: "*glass*", material: glass_windshield}
    # AT.18: no glob may reach a mirror. At eps 0.09 a surface reports the sky rather than
    # itself -- 38 K on a 300 K housing under a 250 K sky -- and a material *name* is weak
    # evidence of a polished finish: artists name a matte anodised housing "Metal". The
    # default is therefore the matte one, chosen for its emissivity, which is the term
    # that carries the 38 K; a steel part whose heat capacity matters wants a per-asset
    # override anyway. `*chrome*` is gone rather than redirected: `phantom4.yaml` settled
    # its chrome by reading the shader (metallic 0.987), not the name, and polished metal
    # is now something an asset asserts. `audit_materials.py` enforces both halves.
    - {match: "*alumin*", material: aircraft_aluminium_painted}
    - {match: "*metal*", material: aircraft_aluminium_painted}
    - {match: "*white*", material: car_paint_white}
    - {match: "*paint*", material: car_paint_black}
    - {match: "*asphalt*", material: asphalt_dry}
    - {match: "*road*", material: asphalt_dry}
    - {match: "*skin*", material: human_skin}
    - {match: "*tyre*", material: rubber_tyre}
    - {match: "*tire*", material: rubber_tyre}
    - {match: "*wheel*", material: rubber_tyre}
    - {match: "*rust*", material: rusted_steel}
    - {match: "*concrete*", material: concrete}
    - {match: "*pavement*", material: concrete}
    - {match: "*kerb*", material: concrete}
    - {match: "*leaf*", material: vegetation_leaf}
    - {match: "*foliage*", material: vegetation_leaf}
    - {match: "*grass*", material: vegetation_leaf}
    - {match: "*snow*", material: snow}
    - {match: "*water*", material: water}
    - {match: "*sea*", material: water}
    - {match: "*ocean*", material: water}
    - {match: "*soil*", material: soil_dry}
    - {match: "*dirt*", material: soil_dry}
    - {match: "*mud*", material: soil_wet}
    - {match: "*cloth*", material: cotton_clothing}
    - {match: "*fabric*", material: cotton_clothing}
    - {match: "*shirt*", material: cotton_clothing}
