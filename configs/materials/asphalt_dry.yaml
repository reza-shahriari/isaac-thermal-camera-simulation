# Dry asphalt: rough, high-emissivity dielectric -- Level C is adequate (section 4.2).
schema_version: 2
material:
  name: asphalt_dry
  source: literature
  surface_treatment: weathered
  reference: "docs/physics-model.md section 16.2; NIR/SWIR ESTIMATED"
  thermal:
    density_kg_m3: 2200
    specific_heat_j_kgk: 920
    conductivity_w_mk: 0.75
    thickness_m: 0.05
    solar_absorptivity: 0.90
  optical:
    emissivity_per_band: {nir: 0.92, swir: 0.90, mwir: 0.92, lwir: 0.94}
    roughness_per_band: {nir: 0.80, swir: 0.80, mwir: 0.75, lwir: 0.70}
    # §4.2: "nearly flat (a → 0) for rough dielectrics like asphalt and vegetation". Level B with
    # a small a rather than `constant`, because the constant is only licensed above ε = 0.93 and
    # asphalt's NIR and MWIR values sit just under it. ESTIMATED: a is the small residual falloff
    # a rough dielectric still has, not a fitted value -- there is no n/k table for asphalt.
    angular_model: {type: empirical, a: 0.05, p: 4}
