# Concrete pavement: Light grey concrete road or pavement.
#
# Written by scripts/import_paired_spectra.py (roadmap XD.13) -- edit the script, not this file.
# Paired measurements: a light grey concrete road (USGS) with a concrete tile (UCSB).
# NIR and SWIR are read from the USGS curve beside this material, as 1 - R (ADR 0175).
# The solar absorptivity is its AM1.5 average over the 0.35-2.5 um measured
# (97 % of the direct energy in 0.3-4 um). MWIR and LWIR come from the second source
# named in `reference`.
schema_version: 2
material:
  name: concrete_pavement
  source: literature
  surface_treatment: weathered
  reference: "NIR, SWIR and solar absorptivity: USGS Spectral Library Version 7 (Kokaly et al. 2017, U.S. Geological Survey Data Series 1035, doi:10.3133/ds1035; data doi:10.5066/F7RR1WDJ), splib07a, public domain, record 'splib07a Record=18568: Concrete GDS375 Lt Gry Road ASDFRa AREF' (data/spectra/materials/usgs/concrete_pavement.csv). MWIR and LWIR: MODIS UCSB Emissivity Library (Z. Wan, ICESS, UC Santa Barbara), https://icess.eri.ucsb.edu/modis/EMIS/html/em.html, directional-hemispherical emissivity measured with a MIDAC FTIR and an integrating sphere, 3.3-14.5 um [R42]; files lfecontl.prn (Life Concrete Tile), averaged, retrieved 2026-09-29. MWIR over the measured 3.34-5.0 um (83 % of the band). Not committed: the library states no licence, so only these band values are extracted. Thermal: concrete"
  description: "Light grey concrete road or pavement"
  thermal:
    density_kg_m3: 2300
    specific_heat_j_kgk: 880
    conductivity_w_mk: 1.4
    thickness_m: 0.1   # ESTIMATED: a typical part or layer
    solar_absorptivity: 0.706   # computed from the USGS curve, not typed
  optical:
    spectral_emissivity:   # the committed measured curves, see the header
      - {file: spectra/materials/usgs/concrete_pavement.csv, quantity: reflectance}   # opaque: 1 - R
    emissivity_per_band: {mwir: 0.928, lwir: 0.963}   # computed; only where no curve is committed
    roughness_per_band: {nir: 0.85, swir: 0.85, mwir: 0.8, lwir: 0.75}   # ESTIMATED, as the class's existing material
    angular_model: {type: empirical, a: 0.05, p: 4.0}   # ESTIMATED, as the class
