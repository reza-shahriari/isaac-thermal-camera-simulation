# Wood pine: New sawn pine timber.
#
# Written by scripts/import_paired_spectra.py (roadmap XD.13) -- edit the script, not this file.
# Paired measurements: a new pine beam (USGS) with Douglas fir lumber (UCSB), both sawn softwood.
# NIR and SWIR are the library's band averages of 1 - R of the USGS curve beside this material.
# The solar absorptivity is its AM1.5 average over the 0.35-2.5 um measured
# (97 % of the direct energy in 0.3-4 um). MWIR and LWIR come from the second source
# named in `reference`.
schema_version: 2
material:
  name: wood_pine
  source: literature
  surface_treatment: as_manufactured
  reference: "NIR, SWIR and solar absorptivity: USGS Spectral Library Version 7 (Kokaly et al. 2017, U.S. Geological Survey Data Series 1035, doi:10.3133/ds1035; data doi:10.5066/F7RR1WDJ), splib07a, public domain, record 'splib07a Record=20779: Wood_Beam GDS363 Nw Pine 2X4 ASDFRa AREF' (data/spectra/materials/usgs/wood_pine.csv). MWIR and LWIR: MODIS UCSB Emissivity Library (Z. Wan, ICESS, UC Santa Barbara), https://icess.eri.ucsb.edu/modis/EMIS/html/em.html, directional-hemispherical emissivity measured with a MIDAC FTIR and an integrating sphere, 3.3-14.5 um [R42]; files dougfir.prn (Douglas Fir), averaged, retrieved 2026-09-29. MWIR over the measured 3.34-5.0 um (83 % of the band). Not committed: the library states no licence, so only these band values are extracted. Thermal: softwoods (fir, pine), Incropera, DeWitt, Bergman & Lavine, Fundamentals of Heat and Mass Transfer, Table A.3"
  description: "New sawn pine timber"
  thermal:
    density_kg_m3: 510
    specific_heat_j_kgk: 1380
    conductivity_w_mk: 0.12
    thickness_m: 0.02   # ESTIMATED: a typical part or layer
    solar_absorptivity: 0.529   # computed from the USGS curve, not typed
  optical:
    emissivity_per_band: {nir: 0.340, swir: 0.510, mwir: 0.890, lwir: 0.954}   # computed, see the header
    roughness_per_band: {nir: 0.7, swir: 0.7, mwir: 0.6, lwir: 0.55}   # ESTIMATED, as the class's existing material
    angular_model: {type: empirical, a: 0.05, p: 4.0}   # ESTIMATED, as the class
