# The outer shell of a structural firefighter's turnout coat and trousers: a woven meta-/para-aramid
# cloth (Nomex IIIA, PBI/Kevlar), over a moisture barrier and a thermal liner (HU.11, ADR 0198).
# Optics are the shell's: the camera sees only it. NISTIR 6299 (Mell & Lawson 1999, Table 1) gives
# a black Nomex IIIA shell of 254 g/m2 a total transmissivity of 0.044 and reflectivity of 0.09
# against a 943 K blackbody, whose emission peaks near 3 um: absorptivity 0.87 there, taken here
# as the MWIR emissivity. LWIR 0.90 is ESTIMATED as a polymer cloth's (nylon and cotton measure
# 0.88, Belliveau et al. 2020; colour does not reach the long-wave, Zhang, Hu & Zhang 2009). NIR
# 0.50 and SWIR 0.55 reflected are ESTIMATED for natural tan aramid; a colour dyes them (ADR 0195).
# Thermal from NISTIR 6299 Table 1: 0.82 mm, 310 kg/m3, 0.047 W/m/K, 1300 J/kg/K. The ensemble's
# insulation is the asset's clo per garment (Kuklane et al. 2022), not this file's.
schema_version: 2
material:
  name: turnout_aramid_shell
  source: literature
  surface_treatment: as_manufactured
  reference: "NISTIR 6299 (Mell & Lawson 1999), Table 1: Nomex IIIA shell 254 g/m2, 0.082 cm, 0.31 g/cm3, k 4.7e-4 W/cm/C, c 1.3 J/g/C, tau 0.044, r 0.09 (total, 943 K source) -> MWIR 0.87. LWIR 0.90 ESTIMATED (polymer cloth; Belliveau et al. 2020, doi:10.1177/0040517519888825). NIR/SWIR ESTIMATED for tan aramid"
  description: "Aramid turnout shell (Nomex IIIA class) over barrier and liner; tan, emissive in the thermal bands"
  thermal:
    density_kg_m3: 310
    specific_heat_j_kgk: 1300
    conductivity_w_mk: 0.047
    thickness_m: 0.00082
    solar_absorptivity: 0.55
  optical:
    emissivity_per_band: {nir: 0.50, swir: 0.45, mwir: 0.87, lwir: 0.90}
    roughness_per_band: {nir: 0.80, swir: 0.78, mwir: 0.70, lwir: 0.65}
    angular_model: {type: empirical, a: 0.08, p: 4.0}
