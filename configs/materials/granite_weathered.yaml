# Granite weathered: Weathered white, red and black granite.
#
# Written by scripts/import_slum.py (roadmap XD.13) -- edit the script, not this file.
# SLUM sample G004: NIR, SWIR, LWIR and the solar absorptivity are measured on this one sample
# (short-wave reflectance and long-wave emissivity, beside this material under
# data/spectra/materials/slum/). LWIR covers the 8.0-13.5 um measured (92 % of the band); the
# solar absorptivity covers 0.35-2.5 um (97 % of the AM1.5 direct
# energy in 0.3-4 um). MWIR, which SLUM did not measure, comes from the source in `reference`.
schema_version: 2
material:
  name: granite_weathered
  source: literature
  surface_treatment: weathered
  reference: "NIR, SWIR, LWIR and solar absorptivity: SLUM, the Spectral Library of impervious Urban Materials: S. Kotthaus, T. E. L. Smith, M. J. Wooster, C. S. B. Grimmond (2014), Derivation of an urban materials spectral library through emittance and reflectance spectroscopy, ISPRS J. Photogramm. Remote Sens. 94, 194-212, doi:10.1016/j.isprsjprs.2014.05.005; data doi:10.5281/zenodo.4263842 (MPL-2.0), sample G004 (data/spectra/materials/slum/granite_weathered_sw.csv and _lw.csv). MWIR from the class, not this sample: FLIR Systems, Emissivity tables, FLIR E95 user manual (T810190), section 37, row 'Granite, rough, 4 different samples, SW 0.95-0.97' (the middle of the range), FLIR reference 9: Ohman, C.: Emittance measurements using AGEMA E-Box, technical report, AGEMA (1999). FLIR calls its values recommendations only. Thermal: granite, Incropera, DeWitt, Bergman & Lavine, Fundamentals of Heat and Mass Transfer, Table A.3"
  description: "Weathered white, red and black granite"
  thermal:
    density_kg_m3: 2630
    specific_heat_j_kgk: 775
    conductivity_w_mk: 2.79
    thickness_m: 0.05   # ESTIMATED: a typical part or layer
    solar_absorptivity: 0.459   # computed from the SLUM curve, not typed
  optical:
    emissivity_per_band: {nir: 0.425, swir: 0.455, mwir: 0.960, lwir: 0.928}   # computed, see the header
    roughness_per_band: {nir: 0.8, swir: 0.8, mwir: 0.75, lwir: 0.7}   # ESTIMATED, as the class
    angular_model: {type: empirical, a: 0.05, p: 4.0}   # ESTIMATED, as the class
