# Concrete weathered: Weathered grey concrete.
#
# Written by scripts/import_slum.py (roadmap XD.13) -- edit the script, not this file.
# SLUM sample C004: NIR, SWIR, LWIR and the solar absorptivity are measured on this one sample
# (short-wave reflectance and long-wave emissivity, beside this material under
# data/spectra/materials/slum/). LWIR covers the 8.0-13.5 um measured (92 % of the band); the
# solar absorptivity covers 0.35-2.5 um (97 % of the AM1.5 direct
# energy in 0.3-4 um). MWIR, which SLUM did not measure, comes from the source in `reference`.
schema_version: 2
material:
  name: concrete_weathered
  source: literature
  surface_treatment: weathered
  reference: "NIR, SWIR, LWIR and solar absorptivity: SLUM, the Spectral Library of impervious Urban Materials: S. Kotthaus, T. E. L. Smith, M. J. Wooster, C. S. B. Grimmond (2014), Derivation of an urban materials spectral library through emittance and reflectance spectroscopy, ISPRS J. Photogramm. Remote Sens. 94, 194-212, doi:10.1016/j.isprsjprs.2014.05.005; data doi:10.5281/zenodo.4263842 (MPL-2.0), sample C004 (data/spectra/materials/slum/concrete_weathered_sw.csv and _lw.csv). MWIR from the same class of surface, not this sample: MODIS UCSB Emissivity Library (Z. Wan, ICESS, UC Santa Barbara), https://icess.eri.ucsb.edu/modis/EMIS/html/em.html, directional-hemispherical emissivity measured with a MIDAC FTIR and an integrating sphere, 3.3-14.5 um [R42]; lfecontl.prn (Life Concrete Tile), over 3.34-5.0 um (83 % of the band); cited, not committed. Thermal: concrete"
  description: "Weathered grey concrete"
  thermal:
    density_kg_m3: 2300
    specific_heat_j_kgk: 880
    conductivity_w_mk: 1.4
    thickness_m: 0.1   # ESTIMATED: a typical part or layer
    solar_absorptivity: 0.626   # computed from the SLUM curve, not typed
  optical:
    emissivity_per_band: {nir: 0.607, swir: 0.607, mwir: 0.928, lwir: 0.953}   # computed, see the header
    roughness_per_band: {nir: 0.85, swir: 0.85, mwir: 0.8, lwir: 0.75}   # ESTIMATED, as the class
    angular_model: {type: empirical, a: 0.05, p: 4.0}   # ESTIMATED, as the class
