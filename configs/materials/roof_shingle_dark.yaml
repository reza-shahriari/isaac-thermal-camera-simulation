# Roof shingle dark: Dark grey asphalt roof shingles.
#
# Written by scripts/import_paired_spectra.py (roadmap XD.13) -- edit the script, not this file.
# Paired measurements: dark grey shingles (USGS) with asphalt (UCSB): a PROXY in the long wave, since a shingle's mineral granules are not in the UCSB sample.
# NIR and SWIR are read from the USGS curve beside this material, as 1 - R (ADR 0175).
# The solar absorptivity is its AM1.5 average over the 0.35-2.5 um measured
# (97 % of the direct energy in 0.3-4 um). MWIR and LWIR come from the second source
# named in `reference`.
schema_version: 2
material:
  name: roof_shingle_dark
  source: literature
  surface_treatment: weathered
  reference: "NIR, SWIR and solar absorptivity: USGS Spectral Library Version 7 (Kokaly et al. 2017, U.S. Geological Survey Data Series 1035, doi:10.3133/ds1035; data doi:10.5066/F7RR1WDJ), splib07a, public domain, record 'splib07a Record=18287: Asphalt_Shingle GDS367 DkGry ASDFRa AREF' (data/spectra/materials/usgs/roof_shingle_dark.csv). MWIR and LWIR: MODIS UCSB Emissivity Library (Z. Wan, ICESS, UC Santa Barbara), https://icess.eri.ucsb.edu/modis/EMIS/html/em.html, directional-hemispherical emissivity measured with a MIDAC FTIR and an integrating sphere, 3.3-14.5 um [R42]; files asphalt.prn (Emissivity of Asphalt), averaged, retrieved 2026-09-29. MWIR over the measured 3.34-5.0 um (83 % of the band). Not committed: the library states no licence, so only these band values are extracted. Thermal: asphalt_dry, in a 5 mm layer"
  description: "Dark grey asphalt roof shingles"
  thermal:
    density_kg_m3: 2200
    specific_heat_j_kgk: 920
    conductivity_w_mk: 0.75
    thickness_m: 0.005   # ESTIMATED: a typical part or layer
    solar_absorptivity: 0.903   # computed from the USGS curve, not typed
  optical:
    spectral_emissivity:   # the committed measured curves, see the header
      - {file: spectra/materials/usgs/roof_shingle_dark.csv, quantity: reflectance}   # opaque: 1 - R
    emissivity_per_band: {mwir: 0.969, lwir: 0.972}   # computed; only where no curve is committed
    roughness_per_band: {nir: 0.8, swir: 0.8, mwir: 0.75, lwir: 0.7}   # ESTIMATED, as the class's existing material
    angular_model: {type: empirical, a: 0.05, p: 4.0}   # ESTIMATED, as the class
