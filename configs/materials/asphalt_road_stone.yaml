# Asphalt road stone: Weathered road asphalt with stone aggregate, black and grey.
#
# Written by scripts/import_slum.py (roadmap XD.13) -- edit the script, not this file.
# SLUM sample A001: NIR, SWIR, LWIR and the solar absorptivity are measured on this one sample
# (short-wave reflectance and long-wave emissivity, beside this material under
# data/spectra/materials/slum/). LWIR covers the 8.0-13.5 um measured (92 % of the band); the
# solar absorptivity covers 0.35-2.5 um (97 % of the AM1.5 direct
# energy in 0.3-4 um). MWIR, which SLUM did not measure, comes from the source in `reference`.
schema_version: 2
material:
  name: asphalt_road_stone
  source: literature
  surface_treatment: weathered
  reference: "NIR, SWIR, LWIR and solar absorptivity: SLUM, the Spectral Library of impervious Urban Materials: S. Kotthaus, T. E. L. Smith, M. J. Wooster, C. S. B. Grimmond (2014), Derivation of an urban materials spectral library through emittance and reflectance spectroscopy, ISPRS J. Photogramm. Remote Sens. 94, 194-212, doi:10.1016/j.isprsjprs.2014.05.005; data doi:10.5281/zenodo.4263842 (MPL-2.0), sample A001 (data/spectra/materials/slum/asphalt_road_stone_sw.csv and _lw.csv). MWIR from the same class of surface, not this sample: MODIS UCSB Emissivity Library (Z. Wan, ICESS, UC Santa Barbara), https://icess.eri.ucsb.edu/modis/EMIS/html/em.html, directional-hemispherical emissivity measured with a MIDAC FTIR and an integrating sphere, 3.3-14.5 um [R42]; asphalt.prn (Emissivity of Asphalt), over 3.34-5.0 um (83 % of the band); cited, not committed. Thermal: asphalt_dry"
  description: "Weathered road asphalt with stone aggregate, black and grey"
  thermal:
    density_kg_m3: 2200
    specific_heat_j_kgk: 920
    conductivity_w_mk: 0.75
    thickness_m: 0.05   # ESTIMATED: a typical part or layer
    solar_absorptivity: 0.784   # computed from the SLUM curve, not typed
  optical:
    emissivity_per_band: {nir: 0.755, swir: 0.742, mwir: 0.969, lwir: 0.960}   # computed, see the header
    roughness_per_band: {nir: 0.8, swir: 0.8, mwir: 0.75, lwir: 0.7}   # ESTIMATED, as the class
    angular_model: {type: empirical, a: 0.05, p: 4.0}   # ESTIMATED, as the class
