# Bare **oxidised** aluminium: a mirror in the thermal IR (epsilon 0.09), shows the sky, not itself.
#
# `AT.17`: this file used to open "bare / polished aluminium" and carry 0.09, which is not a
# polished surface. Polished aluminium is **0.04** at 8 um and anodised is **0.834-0.856** [R39] --
# one metal, three states, a factor of 21 between the ends of the range, and a file that named none
# of them. The state is now declared (`surface_treatment: oxidised`), this line says so, and
# `aluminium_polished.yaml` and `aluminium_anodised.yaml` sit beside it holding the other two.
# The *name* is left alone deliberately: it is referenced by scenes, asset maps, the material probe
# and some thirty tests, and renaming it is a change to those rather than to this library.
# Section 16.2; NIR/SWIR ESTIMATED (aluminium reflects ~0.9 across the near IR).
schema_version: 2
material:
  name: bare_aluminium
  source: literature
  surface_treatment: oxidised
  reference: "docs/physics-model.md section 16.2; NIR/SWIR ESTIMATED"
  description: "Trim, wheels, unpainted aircraft skin, in the oxidised state a bare alloy reaches within days; Level A (Fresnel) because a metal's emissivity RISES toward grazing and no Level B (a, p) can represent that"
  thermal:
    density_kg_m3: 2700
    specific_heat_j_kgk: 900
    conductivity_w_mk: 205
    thickness_m: 0.002
    solar_absorptivity: 0.15
  optical:
    emissivity_per_band: {nir: 0.08, swir: 0.05, mwir: 0.06, lwir: 0.09}
    roughness_per_band: {nir: 0.10, swir: 0.08, mwir: 0.05, lwir: 0.03}
    # Level A, not constant: §4.2 permits a constant only above ε = 0.93 and this is 0.09, and
    # Level B cannot help either because a metal's ε rises with angle (M7.6 refuses to fit it).
    # The table supplies the SHAPE; the emissivity_per_band values above supply the magnitude --
    # ideal Drude aluminium is ε = 0.012 at 10 µm, and §16.2's 0.09 is a real oxidised surface.
    angular_model: {type: fresnel, n_k_file: nk/aluminium.csv}
