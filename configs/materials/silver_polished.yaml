# Silver polished: Polished silver: mirrors' reflective layer, plated fittings.
#
# Written by scripts/import_material_spectra.py (roadmap XD.13) -- edit the script, not this file.
# The emissivity is a curve computed from published optical constants (data/nk/silver.csv, whose
# source block names the paper) and the solar absorptivity is computed from the same curve under
# the AM1.5 direct spectrum (irsim.materials.spectra.solar_absorptance). This is the POLISHED
# state: the lower bound of this metal's emissivity. A real part in service is rougher and more
# oxidised, and both raise it (section 4.5); that is a different material, not this one.
schema_version: 2
material:
  name: silver_polished
  source: literature
  surface_treatment: polished
  reference: "Optical constants: H. U. Yang, J. D'Archangel, M. L. Sundheimer, E. Tucker, G. D. Boreman, M. B. Raschke. Optical dielectric function of silver. Phys. Rev. B 91, 235137 (2015) (See Supplemental Material. Data taken from 'Ag_C_corrected.csv'.) (Template-stripped silver.) via RefractiveIndex.INFO (CC0), data/nk/silver.csv. Thermal: pure silver, Incropera, DeWitt, Bergman & Lavine, Fundamentals of Heat and Mass Transfer, Table A.1 (300 K)"
  description: "Polished silver: mirrors' reflective layer, plated fittings"
  thermal:
    density_kg_m3: 10500
    specific_heat_j_kgk: 235
    conductivity_w_mk: 429
    thickness_m: 0.0005   # ESTIMATED: a typical part
    solar_absorptivity: 0.022   # computed from the curve, not typed
  optical:
    spectral_emissivity: spectra/materials/silver_polished.csv
    roughness_per_band: {nir: 0.02, swir: 0.02, mwir: 0.01, lwir: 0.01}   # ESTIMATED, polished
    # Level A from the same table the curve came from: a metal's emissivity RISES toward grazing,
    # which only Fresnel on n and k represents (section 4.2).
    angular_model: {type: fresnel, n_k_file: nk/silver.csv}
