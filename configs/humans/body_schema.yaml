# The body schema: what every human in irsim is made of, as data (roadmap HU.2).
#
# A drone's parts are discovered (ADR 0138). A human's are known in advance and identical for every
# human, so a mesh is *labelled* onto this fixed taxonomy and the labeller is the skeleton: the bone
# that owns a vertex names its segment. The physiology (JOS-3, HU.4), the garments (HU.5) and the
# materials hang off these names, never off a mesh. Loader and checks: irsim.config.humans.
#
# Segments are JOS-3's seventeen, in its order and spelling, so the per-segment skin temperatures
# of HU.4 bind by name: Takahashi, Tanabe et al. 2021, Energy & Buildings 231:110575,
# doi:10.1016/j.enbuild.2020.110575; names from src/jos3/matrix.py (BODY_NAMES), MIT. JOS-3's
# "Shoulder" is the UPPER ARM, its "Arm" the FOREARM and its "Leg" the LOWER LEG (65MN heritage).
# `area_m2` is JOS-3's standard local surface area (_BSAst in construction.py) for a 1.72 m,
# 74.43 kg body, 1.87 m2 in all; JOS-3 scales it by the Du Bois ratio for another body.
#
# Chest and Back cannot be told apart by a bone -- one spine deforms both -- so a bone maps to
# the REGION `torso`, and the split by the face's forward coordinate (the asset's `forward_axis`)
# resolves it. The lumbar spine bone is mapped to Pelvis: in the 65MN lineage the pelvis segment
# is the pelvis and the lower abdomen, which is why its area (0.221 m2) is the largest torso
# segment. ESTIMATED: a judgement, not a measurement.
#
# Garment slots say what a garment covers by default; a garment may narrow or widen it with its
# own `covers:`. The Neck is bare by default -- a scarf or a collar is a `covers:` that names it.
#
# Rigs. Each map lists the rig's DEFORMING bones in full and what each drives, so the loader can
# refuse a rig that leaves a bone unmapped, and names the leaf bones that deform nothing. A bone
# name is looked up after its prefix is stripped, exactly, then by pattern, then without a
# trailing `.NNN` (a Rigify DEF- limb is two bones, `DEF-forearm.L` and `DEF-forearm.L.001`).
# SMPL's joints are named for the JOINT, which drives the segment DISTAL to it: `left_knee`
# drives the lower leg, `left_elbow` the forearm, `left_hip` the thigh.
#
# Sources: Mixamo, the 65-bone skeleton (Adobe Community, "Mixamo standard 65 bone skeleton";
# MPFB2's rig.mixamo.json lists the 52 deforming ones). Rigify: Blender's bundled
# rigify/metarigs/human.py, 159 bones. SMPL-X: smplx/joint_names.py (Pavlakos et al. 2019),
# the first 55 of JOINT_NAMES. MPFB GameEngine: MPFB2's rig.game_engine.json, 53 bones,
# Unreal-mannequin spelling (upperarm_l, calf_l, ball_l); Root deforms nothing.

schema_version: 1
body:
  name: jos3_17
  source: "JOS-3 BODY_NAMES and _BSAst (Takahashi et al. 2021, doi:10.1016/j.enbuild.2020.110575), MIT"
  segments:
    - {name: Head,      side: centre, area_m2: 0.110}
    - {name: Neck,      side: centre, area_m2: 0.029}
    - {name: Chest,     side: centre, area_m2: 0.175}
    - {name: Back,      side: centre, area_m2: 0.161}
    - {name: Pelvis,    side: centre, area_m2: 0.221}
    - {name: LShoulder, side: left,  mirror: RShoulder, area_m2: 0.096}   # the upper arm
    - {name: LArm,      side: left,  mirror: RArm,      area_m2: 0.063}   # the forearm
    - {name: LHand,     side: left,  mirror: RHand,     area_m2: 0.050}
    - {name: RShoulder, side: right, mirror: LShoulder, area_m2: 0.096}
    - {name: RArm,      side: right, mirror: LArm,      area_m2: 0.063}
    - {name: RHand,     side: right, mirror: LHand,     area_m2: 0.050}
    - {name: LThigh,    side: left,  mirror: RThigh,    area_m2: 0.209}
    - {name: LLeg,      side: left,  mirror: RLeg,      area_m2: 0.112}   # the lower leg
    - {name: LFoot,     side: left,  mirror: RFoot,     area_m2: 0.056}
    - {name: RThigh,    side: right, mirror: LThigh,    area_m2: 0.209}
    - {name: RLeg,      side: right, mirror: LLeg,      area_m2: 0.112}
    - {name: RFoot,     side: right, mirror: LFoot,     area_m2: 0.056}

  # A bone may name a region instead of a segment; the split resolves it per face.
  regions:
    torso: {split: forward, positive: Chest, negative: Back}

  # Optics-only layers a face may carry beside skin (hair, eyes are classified, not solved).
  layers: [skin, hair, eyes]

  garment_slots:
    head:  {covers: [Head]}
    torso: {covers: [Chest, Back, Pelvis]}
    arms:  {covers: [LShoulder, RShoulder, LArm, RArm]}
    hands: {covers: [LHand, RHand]}
    legs:  {covers: [LThigh, RThigh, LLeg, RLeg]}
    feet:  {covers: [LFoot, RFoot]}

  rigs:
    mixamo:
      source: "Adobe Mixamo 65-bone skeleton; MPFB2 rig.mixamo.json (52 deforming)"
      strip_prefixes: ["mixamorig:", "mixamorig_", "mixamorig"]
      ignore_prefixes: []
      mirror_tokens: [["Left", "Right"]]
      bones:
        Hips: Pelvis
        Spine: Pelvis
        Spine1: torso
        Spine2: torso
        Neck: Neck
        Head: Head
        LeftShoulder: torso
        LeftArm: LShoulder
        LeftForeArm: LArm
        LeftHand: LHand
        LeftHandThumb1: LHand
        LeftHandThumb2: LHand
        LeftHandThumb3: LHand
        LeftHandIndex1: LHand
        LeftHandIndex2: LHand
        LeftHandIndex3: LHand
        LeftHandMiddle1: LHand
        LeftHandMiddle2: LHand
        LeftHandMiddle3: LHand
        LeftHandRing1: LHand
        LeftHandRing2: LHand
        LeftHandRing3: LHand
        LeftHandPinky1: LHand
        LeftHandPinky2: LHand
        LeftHandPinky3: LHand
        LeftUpLeg: LThigh
        LeftLeg: LLeg
        LeftFoot: LFoot
        LeftToeBase: LFoot
        RightShoulder: torso
        RightArm: RShoulder
        RightForeArm: RArm
        RightHand: RHand
        RightHandThumb1: RHand
        RightHandThumb2: RHand
        RightHandThumb3: RHand
        RightHandIndex1: RHand
        RightHandIndex2: RHand
        RightHandIndex3: RHand
        RightHandMiddle1: RHand
        RightHandMiddle2: RHand
        RightHandMiddle3: RHand
        RightHandRing1: RHand
        RightHandRing2: RHand
        RightHandRing3: RHand
        RightHandPinky1: RHand
        RightHandPinky2: RHand
        RightHandPinky3: RHand
        RightUpLeg: RThigh
        RightLeg: RLeg
        RightFoot: RFoot
        RightToeBase: RFoot
      non_deforming: ['HeadTop_End', 'LeftHandThumb4', 'LeftHandIndex4', 'LeftHandMiddle4', 'LeftHandRing4', 'LeftHandPinky4', 'RightHandThumb4', 'RightHandIndex4', 'RightHandMiddle4', 'RightHandRing4', 'RightHandPinky4', 'LeftToe_End', 'RightToe_End']
    mpfb_game_engine:
      source: "MPFB2 rig.game_engine.json (53 bones; Root deforms nothing)"
      strip_prefixes: []
      ignore_prefixes: []
      mirror_tokens: [["_l", "_r"]]
      bones:
        pelvis: Pelvis
        spine_01: Pelvis
        spine_02: torso
        spine_03: torso
        neck_01: Neck
        head: Head
