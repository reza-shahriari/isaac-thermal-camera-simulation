        foot_r: RFoot
        ball_r: RFoot
      non_deforming: ["Root"]
    smplx:
      source: "smplx/joint_names.py JOINT_NAMES[0:55] (Pavlakos et al. 2019); SMPL/SMPL-H share the first 22"
      strip_prefixes: []
      ignore_prefixes: []
      mirror_tokens: [["left_", "right_"]]
      bones:
        pelvis: Pelvis
        spine1: Pelvis
        spine2: torso
        spine3: torso
        neck: Neck
        head: Head
        jaw: Head
        left_hip: LThigh
