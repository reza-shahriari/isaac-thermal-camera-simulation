        right_ankle: RFoot
        right_foot: RFoot
        right_collar: torso
        right_shoulder: RShoulder
        right_elbow: RArm
        right_wrist: RHand
        right_eye_smplhf: Head
        right_index1: RHand
        right_index2: RHand
        right_index3: RHand
        right_middle1: RHand
        right_middle2: RHand
        right_middle3: RHand
        right_pinky1: RHand
