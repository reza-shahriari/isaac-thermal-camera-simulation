        right_ring1: RHand
        right_ring2: RHand
        right_ring3: RHand
        right_thumb1: RHand
        right_thumb2: RHand
        right_thumb3: RHand
      non_deforming: []
    rigify_human:
      source: "Blender rigify/metarigs/human.py (159 bones); a generated rig deforms with DEF- copies, limbs in two pieces"
      strip_prefixes: ["DEF-"]
      ignore_prefixes: ["ORG-", "MCH-", "VIS_", "WGT-"]
      mirror_tokens: [[".L", ".R"]]
      bones:
