# The police officer's outfit (HU.7, ADR 0196; a kit since HU.11, ADR 0198). Schema:
# irsim.config.kits.HumanKit. Geometry only: each piece's library material and insulation are in
# configs/assets/police_officer.yaml, which owns the physics.
#
# MakeHuman's CC0 clothes dress the arms, legs, feet and head. Its packs have no hi-vis vest, so
# the vest is cut from the body: the torso faces from the waist to the shoulders, 25 mm out for the
# soft armour under it. Two 50 mm bands on it are the retroreflective tape, the EN ISO 20471 class 2
# minimum width, 1.5 mm proud of the vest. A 45 mm duty belt at the waist stands 35 mm out, over
# the pullover's hem and the trousers' waistband.
#
# Use: blender -b --python scripts/make_human.py -- --name police_officer --gender 1.0
#      --age-years 35 --skin young_caucasian_male --kit configs/humans/kits/police_officer.yaml
#      --out outputs/humans/police_officer/police_officer.glb
schema_version: 1
kit:
  name: police_officer
  description: "Navy uniform, cap and boots; a hi-vis vest over soft armour with two tape bands; a duty belt"
  clothes:
    arms: toigo_fisherman_sweater
    legs: toigo_wool_pants
    feet: toigo_ankle_boots_male
    head: jujube_newsboy_cap
  pieces:
    - name: garment_torso
      colour_rgb: [1.0, 1.0, 1.0]
      shell:
        bones: [pelvis, spine_01, spine_02, spine_03, clavicle_l, clavicle_r]
        bands: [[0.578, 0.84]]
        offset_m: 0.025
    - name: equipment_tape
      colour_rgb: [0.72, 0.72, 0.72]
      shell:
        bones: [pelvis, spine_01, spine_02, spine_03, clavicle_l, clavicle_r]
        bands: [[0.625, 0.654], [0.672, 0.701]]
        offset_m: 0.0265
    - name: equipment_belt
      colour_rgb: [0.02, 0.02, 0.02]
      shell:
        bones: [pelvis, spine_01]
        bands: [[0.552, 0.578]]
        offset_m: 0.035
