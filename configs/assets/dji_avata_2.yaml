# DJI Avata 2, from the CC-BY Sketchfab model by raphael.harris.gaffga (provenance beside this
# file). Schema: irsim.materials.mapping.AssetConfig; produced and checked with
# `scripts/prep_asset.py`. Sources: DJI Avata 2 specs, https://www.dji.com/avata-2/specs, and the
# DJI Avata 2 User Manual v1.0 (UM),
# https://dl.djicdn.com/downloads/DJI_Avata_2/UM/20250108/DJI_Avata_2_User_Manual_v1.0_en.pdf.
#
# **Material evidence.** DJI publishes no part materials, and no teardown found states them; every
# substance below is ESTIMATED from the product photos plus the shader dump. The artist's names
# ("metal", "leather", "fabric") are appearance labels and were read as hints only:
#
#   material                                base colour   metallic  alpha  where it is                    reading
#   Black_plastic                           texture       texture   1.0    upper shell + duct rings; the battery's exposed tail  black moulding
#   Black_plastic.001                       texture       texture   1.0    the X chassis under the body   black moulding
#   Black_plastic.002                       texture       texture   1.0    motor-base clips, fittings     black moulding
#   Procedural_pearl_black_painted_plastic  0.0           0.0       1.0    propellers, lower ducts, braces black moulding
#   Scratched_Black_Metal                   texture       texture   1.0    motor bells; a closed 28 x 38 x 95 mm box inside the body
#   Black_matte_metal                       texture       texture   1.0    gimbal camera housing          dark housing
#   Glass                                   mix           texture   tex    camera lens cover              glass
#   White_fabric                            texture       texture   1.0    1 cm2 window on the top        status-indicator diffuser
#   Orange_Leather, AVATA2_Print_*          orange/grey   0.0       1.0    < 3 cm2 of trim and labels     printed trim
#
# **Two spellings.** USD export sanitises `Black_plastic.001` to `Black_plastic_001` (and `.002`);
# the audit reads the USD, the thermal archive and the part selectors read Blender's names. Both
# spellings are listed.
#
# **Geometry (the low2high skill, ADR 0155)**: measured on the part-split archive at 2 m on a
# 1.36 mrad pixel -- 20 parts, 153,422 faces, 0 faceted. Nothing to do. (Run on the .glb itself the
# report says 9 of 11 meshes are faceted: the glTF scales its meshes by 0.001 at a parent node,
# and `mesh_facets.py` reads raw accessor positions, so it judges millimetres as metres.)
#
# **Reproduce with `--dissolve-deg 3`.** Welded, the frame's shell crosses the default 5 deg
# planar dissolve's 2 % area gate (2.02 %); at 3 deg the archive is within 0.15 %.

schema_version: 1
asset:
  name: dji_avata_2
  source_file: 3d_models/dji_avata_2/source/dji_avata2.glb
  # glTF is metres by specification, and the model agrees: the vertex extent is 212 x 184 x 64 mm
  # against DJI's 185 x 212 x 64 mm (L x W x H) -- every axis within 1 mm. The duct inner lips sit
  # 36 mm from each hub, the clearance a 3032S propeller (DJI, D 75.7 mm) needs. Nose toward -y:
  # the camera lens is at y = -109 mm.
  scale_to_metres: 1.0
  # glTF splits a vertex at every UV and normal seam, so as imported the Avata 2 is 4,233 shells
  # that share no edge, and the first decomposition (55f6ff8) judged those fragments: the duct /
  # body boundary came out ragged and every propeller was a patchwork. Welded at 0.1 mm it is 189
  # real pieces -- one per propeller, brace, duct half, chassis. The count is the same at 0.01 and
  # 0.001 mm, so the weld closes only seams, never a gap between two pieces.
  weld_m: 0.0001
  # Each propeller gets its own duct. The model has no such piece: the upper half of all four duct
  # rings is one continuous surface with the upper shell (as DJI moulds it), and each side's lower
  # lip runs under two propellers. Four cuts make the ducts, along the moulding's own seams:
  #   * x = +-24 mm from the centreline (-0.75 mm): the shell's area per mm falls from 2.6 cm2 at
  #     |x| 18-20 to 0.25 cm2 by 24 -- the body wall ends there and the ring webs begin;
  #   * y = -23.7 mm, midway between the front (-68.6) and rear (+21.2) rotor stations, at the waist
  #     of each side's figure-eight, where the rings and the lips are narrowest. Only pieces
  #     centred outboard of |x| = 30 mm are cut here, so the body and the battery stay whole.
  # The four cuts only separate the frame's surfaces: each duct's joint to the frame is a contact.
  cuts:
    - {point: [0.02325, 0.0, 0.0], normal: [1.0, 0.0, 0.0], materials: [Black_plastic], area_min_m2: 0.015}
    - {point: [-0.02475, 0.0, 0.0], normal: [1.0, 0.0, 0.0], materials: [Black_plastic], area_min_m2: 0.015}
    - {point: [0.0, -0.0237, 0.0], normal: [0.0, 1.0, 0.0], materials: [Black_plastic, Procedural_pearl_black_painted_plastic], area_min_m2: 0.004, x_min: 0.03}
    - {point: [0.0, -0.0237, 0.0], normal: [0.0, 1.0, 0.0], materials: [Black_plastic, Procedural_pearl_black_painted_plastic], area_min_m2: 0.004, x_max: -0.03}

  materials:
    # --- the monoblock frame/guard, the chassis and the small fittings: black moulded
    # PC/PC-ABS. ESTIMATED -- DJI lists repair shells only as "plastic". The library's black
    # polymer is PET (its LWIR emissivity is from measured n/k, and black-pigment solar
    # absorptivity 0.94); the Mini 3 Pro's black mouldings use it for the same reason.
    Black_plastic: pet_black
    Black_plastic.001: pet_black
    Black_plastic_001: pet_black
    Black_plastic.002: pet_black
    Black_plastic_002: pet_black
    Procedural_pearl_black_painted_plastic: pet_black

    # --- motor bells. "Metal" in the shader; ESTIMATED black-anodised aluminium (eps 0.845), never
    # bare aluminium (0.09): AT.18 -- a guessed mirror renders the motor as reflected sky. The
    # battery box shares this material and asserts its own in `parts:`.
    Scratched_Black_Metal: aluminium_anodised

    # --- the gimbal camera housing. ESTIMATED dark anodised aluminium, the same high-emissivity
    # reading for the same AT.18 reason; DJI does not publish the housing material.
    Black_matte_metal: aluminium_anodised

    # --- the lens cover and the status-indicator window: the library's only tau > 0 entry.
    # Opaque in LWIR (eps 0.88); it matters in SWIR/NIR. The window is a polymer -- ESTIMATED.
    Glass: glass_windshield
    White_fabric: glass_windshield

    # --- trim and labels, under 3 cm2 together. ESTIMATED light moulding.
    Orange_Leather: polycarbonate_light_grey
    AVATA2_Print_Grey: polycarbonate_light_grey
    AVATA2_Print_Orange: polycarbonate_light_grey

  # =============================================================================================
  # The functional decomposition (ADR 0138), on the welded mesh: 189 pieces.
  parts:
    centre: [-0.0007, -0.0237, 0.0]
    coverage_threshold: 0.95
    # AI.16: the artist built one object per MATERIAL (11 objects; `Procedural_pearl...` is all
    # four propellers, all four lower duct lips and the four braces), so only pieces separate the
    # hardware:
    # `granularity: component`, the default.

    # --- AI.17: what touches what along each station's heat path. A motor sits on its chassis pad
    # and on the end of its brace; the brace's inner end meets the chassis (measured gap 0.0 mm;
    # the frame is 5-12 mm away); the chassis fixes to the frame. Each duct was cut from the frame
    # and from its neighbour (`cuts:`), so both joints are authored where the cuts run: the ring
    # web where it meets the body, and the waist where the front and rear rings meet. Footprints
    # ESTIMATED from the measured pieces, not from a teardown: an ~18 mm motor base (pi x 9^2 mm2 =
    # 2.5 cm2), a brace end ~1 cm2 at the motor and ~2 cm2 at the chassis, the chassis's screw
    # bosses ~3 cm2, a ring web ~2 mm x 50 mm = 1 cm2, the waist ~2 x (2 mm x 15 mm) = 0.6 cm2.
    # `dry_default` throughout (ADR 0097) -- for the cut joints, which are continuous moulding in
    # the real part, that understates the conduction: the conservative side.
    contacts:
      - {a: motor_front_left, b: chassis, joint: dry_default, area_m2: 0.00025}
      - {a: motor_front_right, b: chassis, joint: dry_default, area_m2: 0.00025}
      - {a: motor_rear_left, b: chassis, joint: dry_default, area_m2: 0.00025}
      - {a: motor_rear_right, b: chassis, joint: dry_default, area_m2: 0.00025}
      - {a: motor_front_left, b: arm_front_left, joint: dry_default, area_m2: 0.0001}
      - {a: motor_front_right, b: arm_front_right, joint: dry_default, area_m2: 0.0001}
      - {a: motor_rear_left, b: arm_rear_left, joint: dry_default, area_m2: 0.0001}
      - {a: motor_rear_right, b: arm_rear_right, joint: dry_default, area_m2: 0.0001}
      - {a: arm_front_left, b: chassis, joint: dry_default, area_m2: 0.0002}
      - {a: arm_front_right, b: chassis, joint: dry_default, area_m2: 0.0002}
      - {a: arm_rear_left, b: chassis, joint: dry_default, area_m2: 0.0002}
      - {a: arm_rear_right, b: chassis, joint: dry_default, area_m2: 0.0002}
      - {a: chassis, b: frame, joint: dry_default, area_m2: 0.0003}
      - {a: duct_front_left, b: frame, joint: dry_default, area_m2: 0.0001}
      - {a: duct_front_right, b: frame, joint: dry_default, area_m2: 0.0001}
      - {a: duct_rear_left, b: frame, joint: dry_default, area_m2: 0.0001}
      - {a: duct_rear_right, b: frame, joint: dry_default, area_m2: 0.0001}
      - {a: duct_front_left, b: duct_rear_left, joint: dry_default, area_m2: 0.00006}
      - {a: duct_front_right, b: duct_rear_right, joint: dry_default, area_m2: 0.00006}

    parts:
      # --- under the nose: the 1/1.3" camera on its single-axis (tilt) gimbal (UM). The lens is
      # its own part so it keeps the glass mapping. The gimbal is every piece under 20 cm2 within
      # 26 mm of the camera axis: the four `Black_matte_metal` housing pieces, the yoke plates
      # either side, the orange trim and screws. The protective cradle around it (65 cm2) and the
      # bulkhead behind it (13 cm2, 27 mm back) stay with the fuselage.
      - name: camera_lens
        target: airframe
        select: {materials: [Glass]}
      - name: gimbal_camera
        target: airframe
        select: {near_xy: [-0.0008, -0.097], within_m: 0.026, area_max_m2: 0.002}

      # --- the frame: what the cuts leave of the upper shell, 93.2 cm2 from nose to tail between
      # x = -24 and +24 mm. Claimed before the battery, whose selector would otherwise take it.
      - name: frame
        target: airframe
        select: {materials: [Black_plastic], area_min_m2: 0.008}

      # --- the battery: 2150 mAh 4S Li-ion, 31.7 Wh, ~145 g (specs), slid into the body from the
      # back (UM: "battery buckles on the battery's sides"). It is the closed 28 x 38 x 95 mm
      # `Scratched_Black_Metal` box inside the body plus the pack's exposed tail: the upper-rear
      # moulding (46 cm2), the rear face (16 cm2), the two side buckles, the LED and label prints --
      # 118 mm long in all. Every piece under 150 cm2 of those materials within 59 mm of the
      # body's mid-point; the frame (212 cm2) is over the cap and the nose bulkhead is 60 mm out.
      # ESTIMATED boundary.
      - name: battery
        target: battery
        material: pet_black
        select: {materials: [Scratched_Black_Metal, Black_plastic, Black_plastic.002, AVATA2_Print_Grey, AVATA2_Print_Orange], near_xy: [-0.0008, -0.010], within_m: 0.059, area_max_m2: 0.015}

      # --- the four rotor stations, at the motor axes: x = +58.0 / -59.4 mm, y = -68.6 (front) /
      # +21.2 (rear), diagonal 147.8 mm (DJI publishes none). Nose toward -y, so the aircraft's
      # left is +x. Per station, by piece:
      #   * propeller: the one 28.5 cm2 pearl-black piece on the axis -- three blades and the hub. The
  #     cap at 35 cm2 keeps out the front duct's lower lip (42 cm2), centred 1.5 mm off the axis.
      #     3032S (DJI); asserted glass-filled nylon -- ESTIMATED, DJI does not publish it;
      #   * motor: every piece under 12 cm2 within 13 mm of the axis -- bell (10.1 cm2), base
      #     (9.3), bottom cap (2.1), the cap under the propeller (3.7), the 36 winding pieces and
      #     the propeller screws;
      #   * arm: the pearl-black brace that runs from the body side to the motor under the duct
      #     (13.5 cm2 rear, 11.7 front), with its 2.5-2.9 cm2 root plate at the body.
      - name: propeller_front_left
        target: propeller
        material: nylon_glass_filled_black
        select: {materials: [Procedural_pearl_black_painted_plastic], near_xy: [0.0580, -0.0686], within_m: 0.010, area_min_m2: 0.002, area_max_m2: 0.0035}
      - name: propeller_front_right
        target: propeller
        material: nylon_glass_filled_black
        select: {materials: [Procedural_pearl_black_painted_plastic], near_xy: [-0.0594, -0.0686], within_m: 0.010, area_min_m2: 0.002, area_max_m2: 0.0035}
      - name: propeller_rear_left
        target: propeller
        material: nylon_glass_filled_black
        select: {materials: [Procedural_pearl_black_painted_plastic], near_xy: [0.0580, 0.0212], within_m: 0.010, area_min_m2: 0.002, area_max_m2: 0.0035}
      - name: propeller_rear_right
        target: propeller
        material: nylon_glass_filled_black
        select: {materials: [Procedural_pearl_black_painted_plastic], near_xy: [-0.0594, 0.0212], within_m: 0.010, area_min_m2: 0.002, area_max_m2: 0.0035}
      - name: motor_front_left
        target: motor
        select: {near_xy: [0.0580, -0.0686], within_m: 0.013, area_max_m2: 0.0012}
      - name: motor_front_right
        target: motor
        select: {near_xy: [-0.0594, -0.0686], within_m: 0.013, area_max_m2: 0.0012}
      - name: motor_rear_left
        target: motor
        select: {near_xy: [0.0580, 0.0212], within_m: 0.013, area_max_m2: 0.0012}
      - name: motor_rear_right
        target: motor
        select: {near_xy: [-0.0594, 0.0212], within_m: 0.013, area_max_m2: 0.0012}
      - name: arm_front_left
        target: airframe
        select: {materials: [Procedural_pearl_black_painted_plastic], near_xy: [0.0311, -0.0637], within_m: 0.016}
      - name: arm_front_right
        target: airframe
        select: {materials: [Procedural_pearl_black_painted_plastic], near_xy: [-0.0326, -0.0637], within_m: 0.016}
      - name: arm_rear_left
        target: airframe
        select: {materials: [Procedural_pearl_black_painted_plastic], near_xy: [0.0311, 0.0187], within_m: 0.016}
      - name: arm_rear_right
        target: airframe
        select: {materials: [Procedural_pearl_black_painted_plastic], near_xy: [-0.0327, 0.0187], within_m: 0.016}

      # --- the X chassis under the body: one `Black_plastic.001` piece from motor pad to motor pad.
      - name: chassis
        target: airframe
        select: {materials: [Black_plastic.001], area_min_m2: 0.01}

      # --- one duct per propeller, made by the four `cuts:` above: the ring's upper half (29.8 cm2,
      # identical at all four) and its lower lip (42.3 front, 44.6 rear -- the rear lips run 8 mm
      # further aft), every such piece of 25 cm2 or more within 20 mm of the station's axis.
      - name: duct_front_left
        target: airframe
        select: {materials: [Black_plastic, Procedural_pearl_black_painted_plastic], near_xy: [0.0580, -0.0686], within_m: 0.02, area_min_m2: 0.0025}
      - name: duct_front_right
        target: airframe
        select: {materials: [Black_plastic, Procedural_pearl_black_painted_plastic], near_xy: [-0.0594, -0.0686], within_m: 0.02, area_min_m2: 0.0025}
      - name: duct_rear_left
        target: airframe
        select: {materials: [Black_plastic, Procedural_pearl_black_painted_plastic], near_xy: [0.0580, 0.0212], within_m: 0.02, area_min_m2: 0.0025}
      - name: duct_rear_right
        target: airframe
        select: {materials: [Black_plastic, Procedural_pearl_black_painted_plastic], near_xy: [-0.0594, 0.0212], within_m: 0.02, area_min_m2: 0.0025}

      # --- everything else: the camera cradle, the top plate, the nose bulkhead, the status window.
      - name: fuselage
        target: airframe
        select: {}
