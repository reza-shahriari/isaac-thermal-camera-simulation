# DJI Avata 2, from the CC-BY Sketchfab model by raphael.harris.gaffga (provenance beside this
# file). Schema: irsim.materials.mapping.AssetConfig; produced and checked with
# `scripts/prep_asset.py`. Sources: DJI Avata 2 specs, https://www.dji.com/avata-2/specs, and the
# DJI Avata 2 User Manual v1.0 (UM),
# https://dl.djicdn.com/downloads/DJI_Avata_2/UM/20250108/DJI_Avata_2_User_Manual_v1.0_en.pdf.
#
# **Material evidence.** DJI publishes no part materials, and no teardown found states them; every
# substance below is ESTIMATED from the product photos plus the shader dump. The artist's names
# ("metal", "leather", "fabric") are appearance labels and were read as hints only:
#
#   material                                base colour   metallic  alpha  where it is                    reading
#   Black_plastic                           texture       texture   1.0    upper shell + the duct rings   black moulding (frame and guard are one moulding)
#   Black_plastic.001                       texture       texture   1.0    the X chassis under the body   black moulding
#   Black_plastic.002                       texture       texture   1.0    motor-base clips, fittings     black moulding
#   Procedural_pearl_black_painted_plastic  0.0           0.0       1.0    propellers, duct lower lips    black moulding
#   Scratched_Black_Metal                   texture       texture   1.0    motor bells; a closed 28 x 38 x 95 mm box inside the body
#   Black_matte_metal                       texture       texture   1.0    gimbal camera housing          dark housing
#   Glass                                   mix           texture   tex    camera lens cover              glass
#   White_fabric                            texture       texture   1.0    1 cm2 window on the top        status-indicator diffuser
#   Orange_Leather, AVATA2_Print_*          orange/grey   0.0       1.0    < 3 cm2 of trim and labels     printed trim
#
# **Two spellings.** USD export sanitises `Black_plastic.001` to `Black_plastic_001` (and `.002`);
# the audit reads the USD, the thermal archive and the part selectors read Blender's names. Both
# spellings are listed.
#
# **Geometry (the low2high skill, ADR 0155)**: measured on the part-split archive at 2 m on a
# 1.36 mrad pixel -- 16 parts, 135,095 faces, 0 faceted. Nothing to do. (Run on the .glb itself the
# report says 9 of 11 meshes are faceted: the glTF scales its meshes by 0.001 at a parent node,
# and `mesh_facets.py` reads raw accessor positions, so it judges millimetres as metres.)

schema_version: 1
asset:
  name: dji_avata_2
  source_file: 3d_models/dji_avata_2/source/dji_avata2.glb
  # glTF is metres by specification, and the model agrees: the vertex extent is 212 x 184 x 64 mm
  # against DJI's 185 x 212 x 64 mm (L x W x H) -- every axis within 1 mm. The duct inner lips sit
  # 36 mm from each hub, the clearance a 3032S propeller (DJI, D 75.7 mm) needs. Nose toward -y:
  # the camera lens is at y = -109 mm.
  scale_to_metres: 1.0

  materials:
    # --- the monoblock frame/guard, the chassis and the small fittings: black moulded
    # PC/PC-ABS. ESTIMATED -- DJI lists repair shells only as "plastic". The library's black
    # polymer is PET (its LWIR emissivity is from measured n/k, and black-pigment solar
    # absorptivity 0.94); the Mini 3 Pro's black mouldings use it for the same reason.
    Black_plastic: pet_black
    Black_plastic.001: pet_black
    Black_plastic_001: pet_black
    Black_plastic.002: pet_black
    Black_plastic_002: pet_black
    Procedural_pearl_black_painted_plastic: pet_black

    # --- motor bells. "Metal" in the shader; ESTIMATED black-anodised aluminium (eps 0.845), never
    # bare aluminium (0.09): AT.18 -- a guessed mirror renders the motor as reflected sky. The
    # battery box shares this material and asserts its own in `parts:`.
    Scratched_Black_Metal: aluminium_anodised

    # --- the gimbal camera housing. ESTIMATED dark anodised aluminium, the same high-emissivity
    # reading for the same AT.18 reason; DJI does not publish the housing material.
    Black_matte_metal: aluminium_anodised

    # --- the lens cover and the status-indicator window: the library's only tau > 0 entry.
    # Opaque in LWIR (eps 0.88); it matters in SWIR/NIR. The window is a polymer -- ESTIMATED.
    Glass: glass_windshield
    White_fabric: glass_windshield

    # --- trim and labels, under 3 cm2 together. ESTIMATED light moulding.
    Orange_Leather: polycarbonate_light_grey
    AVATA2_Print_Grey: polycarbonate_light_grey
    AVATA2_Print_Orange: polycarbonate_light_grey

  # =============================================================================================
  # The functional decomposition (ADR 0138).
  parts:
    centre: [-0.0007, -0.0237, 0.0]
    coverage_threshold: 0.95
    # AI.16: the artist built one object per MATERIAL (11 objects; `Procedural_pearl...` is all
    # four propellers plus both ducts' lower lips), so only shells separate the hardware:
    # `granularity: component`, the default.

    # --- AI.17: what touches what along each station's heat path, motor -> chassis cross-member ->
    # body, and the ducts, which are one moulding with the upper shell. Footprints ESTIMATED from
    # the measured geometry, not from a teardown: a motor's base sits on a ~18 mm chassis pad
    # (pi x 9^2 mm2 = 2.5 cm2), each cross-member screws to the body over ~3 cm2 of bosses, and a
    # duct meets the shell through ~2 cm2 of moulded wall. `dry_default` throughout (ADR 0097) --
    # for the moulded duct joint that understates a continuous wall, the conservative side.
    contacts:
      - {a: motor_front_left, b: arm_front, joint: dry_default, area_m2: 0.00025}
      - {a: motor_front_right, b: arm_front, joint: dry_default, area_m2: 0.00025}
      - {a: motor_rear_left, b: arm_rear, joint: dry_default, area_m2: 0.00025}
      - {a: motor_rear_right, b: arm_rear, joint: dry_default, area_m2: 0.00025}
      - {a: arm_front, b: fuselage, joint: dry_default, area_m2: 0.0003}
      - {a: arm_rear, b: fuselage, joint: dry_default, area_m2: 0.0003}
      - {a: duct_left, b: fuselage, joint: dry_default, area_m2: 0.0002}
      - {a: duct_right, b: fuselage, joint: dry_default, area_m2: 0.0002}

    parts:
      # --- under the nose: the 1/1.3" camera on its single-axis (tilt) gimbal (UM). The lens is
      # its own part so it keeps the glass mapping.
      - name: camera_lens
        target: airframe
        select: {materials: [Glass]}
      - name: gimbal_camera
        target: airframe
        select: {materials: [Black_matte_metal, Orange_Leather], near_xy: [-0.0008, -0.098], within_m: 0.03}

      # --- the battery: 2150 mAh 4S Li-ion, 31.7 Wh, ~145 g (specs), slid into a body compartment
      # (UM). The model's only enclosed volume is a closed 28 x 38 x 95 mm box along the body axis,
      # six faces of `Scratched_Black_Metal`, hidden under the shell -- that is the pack.
      # ESTIMATED identification and boundary; its case is moulded, so it asserts the polymer.
      - name: battery
        target: battery
        material: pet_black
        select: {materials: [Scratched_Black_Metal], near_xy: [-0.0008, -0.0212], within_m: 0.05, area_min_m2: 0.0009}

      # --- the four rotor stations, measured from the motor-base clips (`Black_plastic.002`, eight
      # per station) and the hub discs: x = +58.0 / -59.3 mm, y = -68.6 (front) / +21.2 (rear),
      # diagonal 147.7 mm (DJI publishes none). Nose toward -y, so the aircraft's left is +x.
      #   * propeller: the pearl-black shells within 30 mm of the hub and above z = -21 mm -- three
      #     ~7.7 cm2 blades each 23 mm out, plus the hub. The duct's inner lip is 36 mm out, so the
      #     radius cut has 6 mm of margin. 3032S (DJI); asserted glass-filled nylon -- ESTIMATED,
      #     DJI does not publish the propeller compound;
      #   * motor: everything left within 13 mm of the axis -- bell, base clips, mount pad.
      - name: propeller_front_left
        target: propeller
        material: nylon_glass_filled_black
        select: {materials: [Procedural_pearl_black_painted_plastic], near_xy: [0.0580, -0.0686], within_m: 0.030, z_min_m: -0.021}
      - name: propeller_front_right
        target: propeller
        material: nylon_glass_filled_black
        select: {materials: [Procedural_pearl_black_painted_plastic], near_xy: [-0.0593, -0.0686], within_m: 0.030, z_min_m: -0.021}
      - name: propeller_rear_left
        target: propeller
        material: nylon_glass_filled_black
        select: {materials: [Procedural_pearl_black_painted_plastic], near_xy: [0.0580, 0.0212], within_m: 0.030, z_min_m: -0.021}
      - name: propeller_rear_right
        target: propeller
        material: nylon_glass_filled_black
        select: {materials: [Procedural_pearl_black_painted_plastic], near_xy: [-0.0593, 0.0212], within_m: 0.030, z_min_m: -0.021}
      - name: motor_front_left
        target: motor
        select: {near_xy: [0.0580, -0.0686], within_m: 0.013}
      - name: motor_front_right
        target: motor
        select: {near_xy: [-0.0593, -0.0686], within_m: 0.013}
      - name: motor_rear_left
        target: motor
        select: {near_xy: [0.0580, 0.0212], within_m: 0.013}
      - name: motor_rear_right
        target: motor
        select: {near_xy: [-0.0593, 0.0212], within_m: 0.013}

      # --- the X chassis under the body (`Black_plastic.001`). The artist moulded it as a front
      # and a rear cross-member, each running from one motor pad to the other, so the finest split
      # that cuts no shell is per pair, not per arm.
      - name: arm_front
        target: airframe
        select: {materials: [Black_plastic.001], z_max_m: -0.022, near_xy: [-0.0007, -0.070], within_m: 0.070}
      - name: arm_rear
        target: airframe
        select: {materials: [Black_plastic.001], z_max_m: -0.022, near_xy: [-0.0007, 0.025], within_m: 0.070}

      # --- the two ducts (propeller guards), one per side: the ring of the monoblock shell plus the
      # pearl lower lips and spokes. A 235 mm circle centred far out to each side takes everything
      # outboard of x = +-29 mm abeam the body and +-41 mm at the nose, so the body's side walls
      # (x = +-19) and the camera cradle cheeks (x = +-21) stay with the fuselage.
      - name: duct_left
        target: airframe
        select: {materials: [Black_plastic, Procedural_pearl_black_painted_plastic], near_xy: [0.2636, -0.0237], within_m: 0.235}
      - name: duct_right
        target: airframe
        select: {materials: [Black_plastic, Procedural_pearl_black_painted_plastic], near_xy: [-0.2650, -0.0237], within_m: 0.235}

      # --- everything else: the upper shell, the top plate, the camera cradle and the tail.
      - name: fuselage
        target: airframe
        select: {}
