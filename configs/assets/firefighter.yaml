# Phenotype: sex and age from the generator's macros ({'gender': 1.0, 'age': 0.5769230769230769, 'muscle': 0.5, 'weight': 0.5, 'proportions': 0.5, 'height': 0.5, 'cupsize': 0.5, 'firmness': 0.5});
# stature 1.724 m MEASURED on the mesh; mass from a BMI of 23.0 (68.4 kg),
# ESTIMATED (a mid-range adult BMI).
# Materials: eyes, eyebrows and eyelashes carry skin's optics (ESTIMATED). Garments: one
# object per slot, `garment_<slot>`, each with a library material, an insulation in clo
# (ISO 9920 garment values, ESTIMATED by slot unless edited) and optionally a colour:
# edit `colour_rgb` and re-run prep_human.py -- the tint reaches the RGB companion and
# the dyed variant's alpha_sol and NIR reach the infrared (HU.5, ADR 0195).
