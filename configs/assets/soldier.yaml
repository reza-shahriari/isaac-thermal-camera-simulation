# soldier: a human generated by MakeHuman's MPFB2 (CC0 base mesh, skin and body parts)
# and labelled onto the body schema by its mpfb_game_engine skeleton with scripts/prep_human.py
# (HU.3, ADR 0192). Schema: irsim.materials.mapping.AssetConfig with `kind: human`.
#
# Phenotype: sex and age from the generator's macros ({'gender': 1.0, 'age': 0.5, 'muscle': 0.5, 'weight': 0.5, 'proportions': 0.5, 'height': 0.5, 'cupsize': 0.5, 'firmness': 0.5});
# stature 1.729 m MEASURED on the mesh; mass from a BMI of 23.0 (68.8 kg),
# ESTIMATED (a mid-range adult BMI).
# Materials: eyes, eyebrows and eyelashes carry skin's optics (ESTIMATED). Garments: one
# object per slot, `garment_<slot>`, each with a library material, an insulation in clo
# (ISO 9920 garment values, ESTIMATED by slot unless edited) and optionally a colour:
# edit `colour_rgb` and re-run prep_human.py -- the tint reaches the RGB companion and
# the dyed variant's alpha_sol and NIR reach the infrared (HU.5, ADR 0195).
schema_version: 1
asset:
  name: soldier
  kind: human
  source_file: 3d_models/soldier/source/soldier_labelled.glb
  scale_to_metres: 1.0
  materials:
    skin: human_skin
    eyes: human_skin
    eyebrows: human_skin
    eyelashes: human_skin
    hair: hair
    garment_head: helmet_aramid_painted
    garment_torso: camouflage_nir_compliant
    garment_arms: camouflage_nir_compliant
    garment_legs: camouflage_nir_compliant
    garment_feet: leather
    equipment_belt: camouflage_nir_compliant
    equipment_pack: camouflage_nir_compliant
  human:
    phenotype:
      sex: male
      age_y: 25.0
      height_m: 1.729
      mass_kg: 68.8
    rig: mpfb_game_engine
    forward_axis: -y
    garments:
      head:
        material: helmet_aramid_painted
        clo: 0.12
        colour_rgb: &id001
        - 0.24
        - 0.26
        - 0.14
        dye_optics: false
      torso:
        material: camouflage_nir_compliant
        clo: 1.38
        colour_rgb:
        - 0.36
        - 0.3
        - 0.2
        covers:
        - Chest
        - Back
        dye_optics: false
      arms:
        material: camouflage_nir_compliant
        clo: 0.28
        colour_rgb: *id001
        covers:
        - LShoulder
        - RShoulder
        - LArm
        - RArm
        dye_optics: false
      legs:
        material: camouflage_nir_compliant
        clo: 0.28
        colour_rgb: *id001
        covers:
        - Pelvis
        - LThigh
        - RThigh
        - LLeg
        - RLeg
        dye_optics: false
      feet:
        material: leather
        clo: 0.1
    equipment:
      belt:
        material: camouflage_nir_compliant
        'on': legs
      pack:
        material: camouflage_nir_compliant
        'on': torso
  parts:
    granularity: object
    parts:
    - name: skin_Head
