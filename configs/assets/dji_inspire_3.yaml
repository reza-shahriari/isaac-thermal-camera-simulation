# DJI Inspire 3, from the CC-BY Sketchfab model by Polyman_3D (provenance beside this file).
# Schema: irsim.materials.mapping.AssetConfig. Produced and checked with `scripts/prep_asset.py
# --dissolve-deg 3` (see below); roadmap AI.15. Sources: DJI Inspire 3 User Manual v2.0 (UM),
# https://www.lensrentals.com/product-assets/72d0a925-0292-4cb2-8e36-7bf82f253f87/DJI_Inspire_3_User_Manual_V2.0_ENI.pdf,
# and DJI's FAQ, https://www.dji.com/support/product/inspire-3.
#
# **Why this asset needed AI.14.** 324 of its 345 objects share one texture-atlas material,
# `default` -- PC shell, carbon arms, nylon propellers, aluminium motors and the camera alike. A
# source-material map can only say "all of it is one thing", so the map below gives the atlas the
# shell's material and every part that is something else says so with `material:`. The part-split
# USD carries those as `thermal:material` overrides, which the resolver reads first.
#
# The other source materials, by their dumped shaders:
#
#   material     base colour          metallic  alpha   where                        reading
#   default      atlas texture         texture   1.0     almost everything            by part, below
#   material     orange (0.8,.48,.11)  0.0       1.0     the four hub caps            -> motor parts
#   material_0   white                 0.0       1.0     ten specks on the gimbal     decals
#   material_3   black                 0.0       1.0     hub centres, lens bezel      black moulding
#   material_4   black                 0.0       0.24    the lens front element       glass
#
# **`--dissolve-deg 3`, not the default 5.** At 5 deg the planar dissolve moved two curved shell
# prims' area by 2.4 % and the emit refused, as it should; 3 deg keeps the archive to +0.09 %.

#
# **Geometry (the low2high skill, ADR 0155)**: measured on the undissolved render mesh at 2 m on
# a 1.36 mrad pixel -- 345 meshes, 514,246 faces, 0 faceted. Nothing to do. The frame's ~20 deg
# nose-down pitch against a level body is the artist's pose and is kept, not redesigned.

schema_version: 1
asset:
  name: dji_inspire_3
  source_file: 3d_models/dji_inspire_3/source/dji_inspire_3.glb
  # The glTF is authored in centimetres. Two published figures bracket 0.01 from opposite sides:
  # the rotor diagonal measures 662-678 mm in 3D (depending on which hub feature is paired;
  # the frame is pitched) against the UM's 685 mm landing / 695 mm flight wheelbase, 2-5 % short;
  # and a blade's span gives a ~42 cm propeller against the 1671's 16 in (40.6 cm), 3 % long.
  # Millimetres or metres would be 10x out; nothing favours a fitted non-decimal factor.
  scale_to_metres: 0.01

  materials:
    # --- the atlas: the dark grey PC housing ("the housing is made of PC plastics", DJI FAQ),
    # which is what remains once the parts have asserted theirs.
    default: polycarbonate_dark_grey
    # --- the hub caps' orange: every one of them sits inside a motor part, which asserts its own.
    material: polycarbonate_dark_grey
    material_0: polycarbonate_dark_grey   # decals: 0.1 cm2 in all
    material_3: pet_black
    material_4: glass_windshield          # alpha 0.24: the lens front element

  # =============================================================================================
  # The functional decomposition (ADR 0138): 6,703 render components over 514,253 faces, 0.843 m2.
  parts:
    # Midpoint of the four rotor stations. The body is 36 cm nose to tail, so radius separates
    # nothing here; every selector is a station-local or body-local circle.
    centre: [0.0, 0.0792, 0.0]
    coverage_threshold: 0.95
    # AI.16: selectors judge each source OBJECT whole, not each connected shell. This artist
    # modelled one object per physical piece but built many of them from several shells (a blade
    # is three), and shell by shell a geometric cut split 41 of the 345 objects across parts --
    # 3 % of every blade in its rotor head, two camera objects 55/45 with the fuselage, each
    # landing foot 8 % into the motor. Judged whole, no object is ever split.
    granularity: object

    # --- AI.17: what touches what along each station's heat path, motor -> mount -> arm tube ->
    # T-junction -> body, plus the foot under each mount. Footprints are ESTIMATED from the
    # measured tube sizes, not from a teardown: a mount sleeves its tube's end over ~3 cm
    # (pi x 20 mm x 30 mm), a tube sits ~2 cm deep in the junction (pi x 20 mm x 20 mm), the 28 mm
    # root tube meets the body hinge over ~2 cm, the 3511's stator base bolts to its mount over
    # ~6 cm2 and a foot plugs into its mount over ~3 cm2. `dry_default` throughout (ADR 0097).
    # Every pair was checked to touch on 2 cm coarse cells within the 3 cm gap a scene would use.
    contacts:
      - {a: motor_front_left, b: motor_mount_front_left, joint: dry_default, area_m2: 0.0006}
      - {a: motor_mount_front_left, b: arm_front_left, joint: dry_default, area_m2: 0.0019}
      - {a: landing_foot_front_left, b: motor_mount_front_left, joint: dry_default, area_m2: 0.0003}
      - {a: motor_rear_left, b: motor_mount_rear_left, joint: dry_default, area_m2: 0.0006}
      - {a: motor_mount_rear_left, b: arm_rear_left, joint: dry_default, area_m2: 0.0019}
      - {a: landing_foot_rear_left, b: motor_mount_rear_left, joint: dry_default, area_m2: 0.0003}
      - {a: arm_front_left, b: arm_root_left, joint: dry_default, area_m2: 0.0013}
      - {a: arm_rear_left, b: arm_root_left, joint: dry_default, area_m2: 0.0013}
      - {a: arm_root_left, b: fuselage, joint: dry_default, area_m2: 0.0018}
      - {a: motor_front_right, b: motor_mount_front_right, joint: dry_default, area_m2: 0.0006}
      - {a: motor_mount_front_right, b: arm_front_right, joint: dry_default, area_m2: 0.0019}
      - {a: landing_foot_front_right, b: motor_mount_front_right, joint: dry_default, area_m2: 0.0003}
      - {a: motor_rear_right, b: motor_mount_rear_right, joint: dry_default, area_m2: 0.0006}
      - {a: motor_mount_rear_right, b: arm_rear_right, joint: dry_default, area_m2: 0.0019}
      - {a: landing_foot_rear_right, b: motor_mount_rear_right, joint: dry_default, area_m2: 0.0003}
      - {a: arm_front_right, b: arm_root_right, joint: dry_default, area_m2: 0.0013}
      - {a: arm_rear_right, b: arm_root_right, joint: dry_default, area_m2: 0.0013}
      - {a: arm_root_right, b: fuselage, joint: dry_default, area_m2: 0.0018}

    parts:
      # --- under the nose: the Zenmuse X9-8K Air, its DL lens and the gimbal that carries them.
      # The lens glass (`material_4`, alpha 0.24) is its own part so it keeps the glass mapping;
      # the gimbal's asserted material would otherwise paint it. X9 housing ESTIMATED
      # magnesium/aluminium painted dark grey -- DJI does not publish it; metal_sheet_painted_grey
      # carries the right solar absorptivity (0.88) and an areal heat capacity within 15 % of a
      # painted aluminium housing. The gimbal is every object centred within 10 cm of the camera
      # and below 14.5 cm: camera body, lens rings, the gimbal arm, its yaw-motor disc (z 12.4-14.1)
      # and the damping plate (14.3). The body's underside starts at 15.
      - name: camera_lens
        target: airframe
        select: {materials: [material_4]}
      - name: gimbal_camera
        target: airframe
        material: metal_sheet_painted_grey
        select: {near_xy: [0.0, -0.11], within_m: 0.10, z_max_m: 0.145}

      # --- the two TB51 packs (98.8 Wh each, self-heating below 18 C; UM), modelled as one block
      # standing at the rear top: the three objects whose centres lie in it.
      - name: batteries
        target: battery
        material: polycarbonate_dark_grey
        select: {near_xy: [0.0, 0.105], within_m: 0.07, z_min_m: 0.17}

      # --- the four rotor stations, at the orange hub caps. Nose is -y (the X9 lens), so +x is
      # the aircraft's LEFT. The carbon frame is modelled pitched ~20 deg nose-down against a level
      # body -- front hubs at z = 8 cm, rear at 24 cm -- so every cut is station-local. Judged per
      # object (above), a station is four kinds of hardware:
      #   * the landing foot: the one ~92 cm2 object over 9 cm tall (DJI: the landing gear is PC);
      #   * the propeller: the two 111 cm2 blade objects (1671, "plastics and fiberglass", black);
      #     the arm-tube ends nearby are 91 cm2, or 111 cm2 but 13 cm out;
      #   * the motor mount: the 67 cm2 arm-end housing, 5.5-7 cm tall and ~10 cm long;
      #   * the motor: everything else within 7.5 cm -- the 3511's stacked bell and stator rings
      #     (4 cm across), the orange cap, the hub, the clamp and its screws. Bells ESTIMATED
      #     anodised aluminium.
      - name: landing_foot_front_left
        target: airframe
        material: polycarbonate_dark_grey
        select: {near_xy: [0.2982, -0.1256], within_m: 0.05, area_min_m2: 0.0085, area_max_m2: 0.010, extent_z_min_m: 0.09}
      - name: propeller_front_left
        target: propeller
        material: nylon_glass_filled_black
        select: {near_xy: [0.2982, -0.1256], within_m: 0.11, area_min_m2: 0.0105, area_max_m2: 0.012}
      - name: motor_mount_front_left
        target: motor
        material: aluminium_anodised
        select: {near_xy: [0.2982, -0.1256], within_m: 0.045, area_min_m2: 0.0060, area_max_m2: 0.0075, extent_z_min_m: 0.05}
      - name: motor_front_left
        target: motor
        material: aluminium_anodised
        select: {near_xy: [0.2982, -0.1256], within_m: 0.075}
      - name: landing_foot_front_right
        target: airframe
        material: polycarbonate_dark_grey
        select: {near_xy: [-0.2982, -0.1256], within_m: 0.05, area_min_m2: 0.0085, area_max_m2: 0.010, extent_z_min_m: 0.09}
      - name: propeller_front_right
        target: propeller
        material: nylon_glass_filled_black
        select: {near_xy: [-0.2982, -0.1256], within_m: 0.11, area_min_m2: 0.0105, area_max_m2: 0.012}
      - name: motor_mount_front_right
        target: motor
        material: aluminium_anodised
        select: {near_xy: [-0.2982, -0.1256], within_m: 0.045, area_min_m2: 0.0060, area_max_m2: 0.0075, extent_z_min_m: 0.05}
      - name: motor_front_right
        target: motor
        material: aluminium_anodised
        select: {near_xy: [-0.2982, -0.1256], within_m: 0.075}
      - name: landing_foot_rear_left
        target: airframe
        material: polycarbonate_dark_grey
        select: {near_xy: [0.219, 0.284], within_m: 0.05, area_min_m2: 0.0085, area_max_m2: 0.010, extent_z_min_m: 0.09}
      - name: propeller_rear_left
        target: propeller
        material: nylon_glass_filled_black
        select: {near_xy: [0.219, 0.284], within_m: 0.11, area_min_m2: 0.0105, area_max_m2: 0.012}
      - name: motor_mount_rear_left
        target: motor
        material: aluminium_anodised
        select: {near_xy: [0.219, 0.284], within_m: 0.045, area_min_m2: 0.0060, area_max_m2: 0.0075, extent_z_min_m: 0.05}
      - name: motor_rear_left
        target: motor
        material: aluminium_anodised
        select: {near_xy: [0.219, 0.284], within_m: 0.075}
      - name: landing_foot_rear_right
        target: airframe
        material: polycarbonate_dark_grey
        select: {near_xy: [-0.219, 0.284], within_m: 0.05, area_min_m2: 0.0085, area_max_m2: 0.010, extent_z_min_m: 0.09}
      - name: propeller_rear_right
        target: propeller
        material: nylon_glass_filled_black
        select: {near_xy: [-0.219, 0.284], within_m: 0.11, area_min_m2: 0.0105, area_max_m2: 0.012}
      - name: motor_mount_rear_right
        target: motor
        material: aluminium_anodised
        select: {near_xy: [-0.219, 0.284], within_m: 0.045, area_min_m2: 0.0060, area_max_m2: 0.0075, extent_z_min_m: 0.05}
      - name: motor_rear_right
        target: motor
        material: aluminium_anodised
        select: {near_xy: [-0.219, 0.284], within_m: 0.075}

      # --- the carbon-fibre arm frame (DJI FAQ: "the aircraft arm is made of carbon fiber"). Each
      # side is a Y of separate objects, mirror-identical left and right:
      #   * the root: the 225 cm2 main tube from the body hinge (x 2.5-25.5 cm, ~28 mm across), the
      #     97 cm2 T-junction it ends in, and the 56 cm2 tie rod under it;
      #   * the front arm: one 111 cm2 tube from the junction down to the front motor (~20 mm);
      #   * the rear arm: one 91-98 cm2 tube from the junction to the rear motor, with the six
      #     small fittings (53 cm2 together) clamped on it 6 cm behind the junction.
      # Three parts, not one, because a part conducts laterally only across faces that share an
      # edge (mesh_conduction): inside one part these separate tubes were insulated from each other,
      # and the motor -> tube -> junction -> body path existed only where coarse cells happened to
      # merge them. As parts, every joint is a contact below with its own conductance, each tube can
      # take its own rotor's downwash (`speeds:`), and a front and a rear tube can follow their
      # motors' different duties. The tubes' objects are found by their area-weighted centres.
      - name: arm_front_left
        target: airframe
        material: carbon_fibre
        select: {near_xy: [0.278, 0.003], within_m: 0.04}
      - name: arm_rear_left
        target: airframe
        material: carbon_fibre
        select: {near_xy: [0.247, 0.170], within_m: 0.045}
      - name: arm_root_left
        target: airframe
        material: carbon_fibre
        select: {near_xy: [0.2, 0.08], within_m: 0.16}
      - name: arm_front_right
        target: airframe
        material: carbon_fibre
        select: {near_xy: [-0.278, 0.003], within_m: 0.04}
      - name: arm_rear_right
        target: airframe
        material: carbon_fibre
        select: {near_xy: [-0.247, 0.170], within_m: 0.045}
      - name: arm_root_right
        target: airframe
        material: carbon_fibre
        select: {near_xy: [-0.2, 0.08], within_m: 0.16}

      # --- everything else: the PC shell, arm hinges and servo, FPV camera, vision sensors
      - name: fuselage
        target: airframe
        select: {}
