        speed_m_s: [ 2.00, 10.20, 11.40, 13.00, 14.90, 14.90, 13.00, 13.00, 13.00, 13.00, 15.40, 15.40, 13.00, 11.90, 11.90, 12.60,  9.10,  2.00]
        mesh: {asset: phantom4_parts, prim: propeller_rear_right, cell_m: 0.01, self_occluding: false, prim_path: /World/Targets/phantom4/Sketchfab_model/p4r_obj_cleaner_materialmerger_gles/Rectangle002/propeller_rear_right/propeller_rear_right}
