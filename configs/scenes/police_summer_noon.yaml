# A police officer in clear midday air (roadmap HU.7). Schema v22, ADR 0196. The officer is `police_officer`: a uniform
# pullover and trousers, a cap, boots, a hi-vis vest over soft body armour (the torso garment: 0.28
# clo of pullover + 1.0 of armour + 0.05 of vest, Potter et al. 2015), and two pieces of equipment
# with their own materials -- retroreflective tape on the vest, a leather duty belt on the trousers.
# Filmed in LWIR, MWIR and RGB: the vest's fluorescent yellow and the tape's silver are colour to the visible camera, sun to the thermal one.
#
# Use: scripts/render_phantom4.py --asset police_officer_parts --scene configs/scenes/police_summer_noon.yaml
#      --sensor configs/sensors/example_lwir_1280.yaml --track outbound --near-m 5.6 --far-m 5.65
#      --elevation-deg 3 --nose-deg -90 --turn-deg 180 --frames 3 --mission-s 600 --no-overlay

schema_version: 22
scene:
  name: police_summer_noon
  description: "A police officer in a hi-vis vest in clear midday air"
  weather_file: weather/clear_midlat_summer_48h.csv
  atmosphere_preset: us_standard_clear
  environment_preset: clear_dry
  site: {latitude_deg: 48.1, longitude_deg: 11.6, altitude_m: 520.0}
  start_utc: "2024-06-21T10:00:00Z"
  world_frame: {up: [0.0, 0.0, 1.0], north: [0.0, 1.0, 0.0]}
  targets:
    - {name: officer, solver: human, asset: police_officer, posture: standing}
  thermal:
    spin_up_hours: 6.0
    tick_s: 30.0
