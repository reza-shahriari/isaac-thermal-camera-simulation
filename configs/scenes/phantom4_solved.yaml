# The **DJI Phantom 4 Pro solved as one thermal network** (TC.13, ADR 0166). Schema: irsim.config.scene
# (v20). The same airframe, weather, site and mission as `phantom4_perpart.yaml`; what changes is that
# nothing here is prescribed. `phantom4_perpart.yaml` gave every part a temperature by ADR 0072's
# instantaneous `T_air + dT_max u^2` node or ADR 0143's `T_air + offset`; this scene gives the object to
# TC.11's full solve: every visible part is a mesh member coarsened to 2 cm cells (ADR 0165 -- 1.53 M
# faces become ~5,100 cells, area exact), every hidden part -- four motor windings, the pack, four ESCs,
# the flight controller -- a lumped member with the component library's mass and rated watts (AI.12),
# every AI.11 contact a conductance, all in one implicit step per tick.
#
# What follows from that and could not before: a winding's heat reaches its bell through the stator
# press fit at the rate the contact allows, so the motor **lags** its throttle by its own time
# constant and is still warm minutes after landing; the pack warms the battery case and the case
# warms the lower shell over their footprints, from inside; a propeller's speed follows its own
# station's throttle (`speeds:`), as before.
#
# Duties. A component's dissipation is rated x duty (linear). Electrical input to a rotor scales
# about as the cube of throttle (thrust ~ u^2, power ~ thrust^1.5) and the loss fraction is taken
# constant at the rating, so a station's duty is 0.694 u^3 (ESTIMATED): the factor puts hover
# (u = 0.6) at 0.15 of the 300 W rating, the 45 W per motor the pack's 200 W hover draw implies,
# so a 60 W-rated motor dissipates 9 W at hover and 17 W in the orbit. The ESCs follow their
# station's duty, the pack the mean of the four, the flight controller runs at rated whenever the
# aircraft is on. The motor bells and their mounts sit in their propeller's downwash, so they take
# the propeller's airflow speed too (`speeds:`, ESTIMATED).
#
# Mission clock, as the parent: T+0 idle on the ground, spool and take off by T+60, hover, climb to
# T+300, forward cruise to T+570, right-hand orbit T+630..870, left-hand orbit T+930..1170, hover in a
# wind from the front-left T+1230..1470, descent from T+1500, landed and idle at T+1680.

