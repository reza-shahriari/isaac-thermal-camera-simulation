# The **solved DJI Phantom 4 Pro leaves a cloudless sky** (EV.20). Schema: irsim.config.scene (v21).
# `phantom4_solved.yaml` (TC.13, ADR 0166) unchanged in every thermal respect -- nineteen coarse mesh
# parts, ten hidden components, nineteen contacts, one implicit step -- under the weather
# `aerial_clear_exit.yaml` uses: the same site, day and hour, generated with **no cloud at all**
# (`cloudless_midlat_summer_48h.csv`). The 0.05-cloud file the parent names blends cloud radiance into
# every sky ray, so the background behind the aircraft would not be the clear-air emission this clip
# is for.
#
# Filmed by `render_phantom4.py --clear-exit`: the clip starts at mission second 540, after 210 s of
# forward cruise (T+330..570 below), so the motors are at cruise temperature -- the windings heat their
# bells through the stator press fit and the bells heat the arms through their mounts, as solved --
# and not on the pad. The aircraft climbs out from 5 m to 60 m at 16 deg elevation in 15 s, the mount
# stops, and it strafes left out of the field at 10 m/s.
#
# The parent's mission clock, for the duties below: T+0 idle on the ground, spool and take off by
# T+60, hover, climb to T+300, forward cruise to T+570, right-hand orbit T+630..870, left-hand orbit
# T+930..1170, hover in a wind from the front-left T+1230..1470, descent from T+1500, landed and idle at
# T+1680.

