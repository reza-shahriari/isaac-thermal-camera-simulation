# The quadrotor's arms as **tubes**, not flat patches: the same 30-minute mission, with the two
# arms solved on a triangle mesh so each carries a gradient around its circumference as well as
# along its length. Schema: irsim.config.scene (v14). Roadmap WM.7; ADR 0110 (the field on the
# mesh), ADR 0087 (the planar patch it extends), ADR 0109 (a speed that follows the mission).
#
# Why this scene exists. ADR 0087 gave a near-planar surface a field by projecting the position
# AOV onto a rectangle and recorded a tube as a permanent limit -- so quad_flight_pointwise.yaml
# has to model each arm as a flat strip, which is the one thing an arm is not. At noon the top of
# a carbon tube is tens of kelvin over its underside, and a strip carries a single value across
# both. WM.1-WM.3 lifted the limit; this is the first scene that uses it.
#
#   * `deck` and `belly` stay **patches**: they really are near-planar, and the planar path is
#     cheaper and samples bilinearly, so nothing is gained by moving them.
#   * `arm_n` and `arm_e` are **meshes** -- 24-sided cylinders, cells at one per face, each cell
#     on its own face normal. That is the whole difference: the sunlit crown and the shaded
#     underside of one arm are different cells of one solve.
#
# What this scene does NOT do, so the frames are read correctly. A mesh cell's beam is gated by
# the surface's own `shaded` flag and nothing else: the body and pod occluders that shade the
# patched arms in quad_flight_pointwise.yaml do not shade these, because ray-traced
# self-shadowing and neighbour shadowing on a mesh are `WM.4`'s. The far side of a tube is cold
# here because its normal faces away, which is the cosine and not an occlusion test. For a convex
# tube in the open those agree; for a mesh that folds over itself they would not.
#
# World is ENU: x east, y north, z up. The mission is quad_flight_clear_noon.yaml's, unchanged.

schema_version: 14
scene:
  name: quad_flight_mesh
  description: "The 30-min quadrotor mission with the arms as meshed tubes, clear midday"
  weather_file: weather/clear_midlat_summer_48h.csv
  atmosphere_preset: us_standard_clear
  environment_preset: clear_dry
  site: {latitude_deg: 48.1, longitude_deg: 11.6, altitude_m: 520.0}
  start_utc: "2024-06-21T10:00:00Z"
  targets:
    # The per-prim airframe is kept so a prim that carries no patch still has a temperature.
    - {name: airframe, solver: airframe, offset_k: 0.0}
    - name: motor
      solver: heat_source
      source: motor
      throttle_s: [0.0, 120.0, 300.0, 600.0, 900.0, 1080.0, 1200.0, 1440.0, 1560.0, 1800.0]
      throttle:   [0.15,  0.18,  0.85,  0.62,  0.66,   0.98,   0.95,   0.35,   0.20,   0.05]
    - name: esc
      solver: heat_source
      source: esc
      throttle_s: [0.0, 120.0, 300.0, 600.0, 900.0, 1080.0, 1200.0, 1440.0, 1560.0, 1800.0]
      throttle:   [0.15,  0.18,  0.85,  0.62,  0.66,   0.98,   0.95,   0.35,   0.20,   0.05]
    - name: battery
      solver: heat_source
      source: battery
      throttle_s: [0.0, 120.0, 300.0, 600.0, 900.0, 1080.0, 1200.0, 1440.0, 1560.0, 1800.0]
      throttle:   [0.15,  0.18,  0.85,  0.62,  0.66,   0.98,   0.95,   0.35,   0.20,   0.05]

  thermal:
    spin_up_hours: 48.0
    tick_s: 10.0
    penumbra_rays: 7        # the pods stand 40 mm off the arms: a 0.4 mm ramp, but free here

    # The body and the four motor pods, as the boxes they are to the sun (ADR 0095).
    occluders:
      - {name: body_w,  centre_m: [-0.15, 0.0, 0.30], u_axis: [0.0, 1.0, 0.0], v_axis: [0.0, 0.0, 1.0], half_u_m: 0.15, half_v_m: 0.06}
      - {name: body_e,  centre_m: [ 0.15, 0.0, 0.30], u_axis: [0.0, 1.0, 0.0], v_axis: [0.0, 0.0, 1.0], half_u_m: 0.15, half_v_m: 0.06}
      - {name: body_s,  centre_m: [0.0, -0.15, 0.30], u_axis: [1.0, 0.0, 0.0], v_axis: [0.0, 0.0, 1.0], half_u_m: 0.15, half_v_m: 0.06}
      - {name: body_n,  centre_m: [0.0,  0.15, 0.30], u_axis: [1.0, 0.0, 0.0], v_axis: [0.0, 0.0, 1.0], half_u_m: 0.15, half_v_m: 0.06}
      - {name: body_top, centre_m: [0.0, 0.0, 0.36], u_axis: [1.0, 0.0, 0.0], v_axis: [0.0, 1.0, 0.0], half_u_m: 0.15, half_v_m: 0.15}
      - {name: pod_n_top, centre_m: [0.0,  0.42, 0.34], u_axis: [1.0, 0.0, 0.0], v_axis: [0.0, 1.0, 0.0], half_u_m: 0.03, half_v_m: 0.03}
      - {name: pod_n_s,   centre_m: [0.0,  0.39, 0.31], u_axis: [1.0, 0.0, 0.0], v_axis: [0.0, 0.0, 1.0], half_u_m: 0.03, half_v_m: 0.03}
      - {name: pod_e_top, centre_m: [0.42, 0.0, 0.34], u_axis: [1.0, 0.0, 0.0], v_axis: [0.0, 1.0, 0.0], half_u_m: 0.03, half_v_m: 0.03}
      - {name: pod_e_s,   centre_m: [0.42, -0.03, 0.31], u_axis: [1.0, 0.0, 0.0], v_axis: [0.0, 0.0, 1.0], half_u_m: 0.03, half_v_m: 0.03}

    surfaces:
      # The deck: 0.30 x 0.30 m of carbon on top of the body, the one surface a camera above sees.
      - name: deck
        material: carbon_fibre
        tilt_deg: 0.0
        speed_s:   [0.0, 120.0, 300.0, 900.0, 1200.0, 1560.0, 1800.0]
        speed_m_s: [1.0,   1.0,   8.0,  15.0,   10.0,    1.0,    1.0]
        patch: {origin_m: [-0.15, -0.15, 0.36], u_axis: [1.0, 0.0, 0.0], v_axis: [0.0, 1.0, 0.0], n_u: 12, n_v: 12, du_m: 0.025, dv_m: 0.025, thickness_m: 0.002, frame: world, prim_path: /World/Quad/deck}

      # The belly: the same plate facing down. tilt 180 means it sees no sky at all -- only the
      # ground under it -- which is why a quadrotor read from below is nothing like one read
      # from above.
      - name: belly
        material: carbon_fibre
        tilt_deg: 180.0
        speed_s:   [0.0, 120.0, 300.0, 900.0, 1200.0, 1560.0, 1800.0]
        speed_m_s: [1.0,   1.0,   8.0,  15.0,   10.0,    1.0,    1.0]
        patch: {origin_m: [-0.15, -0.15, 0.24], u_axis: [1.0, 0.0, 0.0], v_axis: [0.0, 1.0, 0.0], n_u: 12, n_v: 12, du_m: 0.025, dv_m: 0.025, thickness_m: 0.002, frame: world, prim_path: /World/Quad/belly}

      # Two arms, north and east: 0.30 m of carbon tube from the body to the pod, 40 mm below the
      # deck so the deck's own shadow falls across their inner half at a high sun.
      # A 30 mm carbon tube from the body out to the motor pod. 24 facets around it, 6 along:
      # 144 side cells plus 48 on the two caps, each on its own normal.
      - name: arm_n
        material: carbon_fibre
        tilt_deg: 0.0
        speed_s:   [0.0, 120.0, 300.0, 900.0, 1080.0, 1200.0, 1560.0]
        speed_m_s: [1.0,   1.0,   8.0,  15.0,   10.0,    1.0,    1.0]
        mesh:
          shape: cylinder
          centre_m: [0.0, 0.30, 0.32]
          radius_m: 0.015
          length_m: 0.30
          axis: [0.0, 1.0, 0.0]
          segments: 24
          rings: 6
          capped: true
          level: 1
          frame: world
          prim_path: /World/Quad/arm_n
      # A 30 mm carbon tube from the body out to the motor pod. 24 facets around it, 6 along:
      # 144 side cells plus 48 on the two caps, each on its own normal.
      - name: arm_e
        material: carbon_fibre
        tilt_deg: 0.0
        speed_s:   [0.0, 120.0, 300.0, 900.0, 1080.0, 1200.0, 1560.0]
        speed_m_s: [1.0,   1.0,   8.0,  15.0,   10.0,    1.0,    1.0]
        mesh:
          shape: cylinder
          centre_m: [0.30, 0.0, 0.32]
          radius_m: 0.015
          length_m: 0.30
          axis: [1.0, 0.0, 0.0]
          segments: 24
          rings: 6
          capped: true
          level: 1
          frame: world
          prim_path: /World/Quad/arm_e
