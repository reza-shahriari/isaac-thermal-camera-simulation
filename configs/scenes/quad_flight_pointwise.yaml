# The aerial scenario, regenerated point-wise: the same 30-minute quadrotor mission as
# quad_flight_clear_noon.yaml, with the airframe solved **per cell** instead of as one number.
# Schema: irsim.config.scene (v13). Roadmap PT.9; ADR 0087 (the field), ADR 0095 (occluders and
# the world frame), ADR 0102 (in-plane conduction), ADR 0104 (the per-cell sky view), ADR 0109
# (a speed that follows the mission).
#
# What changes against the per-prim scene, and why it matters for a sky-background target:
#
#   * The deck, the belly and the four arms are patched surfaces, so one prim carries a
#     gradient. Seen from above a quadrotor at noon is a hot carbon deck; seen from below it is
#     its own shaded belly, a few kelvin either side of air. A single airframe temperature
#     cannot be both, and which one a detector is trained on is the whole question.
#   * The body and the four motor pods are occluders, so the inner arms sit in the deck's own
#     shadow and the pods throw a shadow of their own down each arm.
#   * The skin's speed follows the mission (ADR 0109). On the pad the deck runs tens of kelvin
#     over air; a minute into the climb forced convection has pinned it back to within a few.
#     That collapse is the point-wise signature of taking off, and it is what the per-prim
#     `airframe` solver asserted from the start (T = T_air) without ever deriving.
#
# The powered parts -- motors, speed controllers, the pack -- stay per-prim nodes, because
# conducting their heat into the skin from a config still has no route (PT.9's remainder).
# World is ENU: x east, y north, z up. The quadrotor sits on its pad at the origin.
#
# Speeds are ESTIMATED as the air speed the skin meets, and rotor downwash is not modelled:
# 1 m/s while the rotors idle on the pad is a stand-in for it, and a real hover moves more air
# over the deck than that. The mission's throttle profile is quad_flight_clear_noon.yaml's,
# unchanged, so the two scenes are the same flight.

schema_version: 13
scene:
  name: quad_flight_pointwise
  description: "The 30-min quadrotor mission with a point-wise airframe, clear midday"
  weather_file: weather/clear_midlat_summer_48h.csv
  atmosphere_preset: us_standard_clear
  environment_preset: clear_dry
  site: {latitude_deg: 48.1, longitude_deg: 11.6, altitude_m: 520.0}
  start_utc: "2024-06-21T10:00:00Z"
  targets:
    # The per-prim airframe is kept so a prim that carries no patch still has a temperature.
    - {name: airframe, solver: airframe, offset_k: 0.0}
    - name: motor
      solver: heat_source
      source: motor
      throttle_s: [0.0, 120.0, 300.0, 600.0, 900.0, 1080.0, 1200.0, 1440.0, 1560.0, 1800.0]
      throttle:   [0.15,  0.18,  0.85,  0.62,  0.66,   0.98,   0.95,   0.35,   0.20,   0.05]
    - name: esc
      solver: heat_source
      source: esc
      throttle_s: [0.0, 120.0, 300.0, 600.0, 900.0, 1080.0, 1200.0, 1440.0, 1560.0, 1800.0]
      throttle:   [0.15,  0.18,  0.85,  0.62,  0.66,   0.98,   0.95,   0.35,   0.20,   0.05]
    - name: battery
      solver: heat_source
      source: battery
      throttle_s: [0.0, 120.0, 300.0, 600.0, 900.0, 1080.0, 1200.0, 1440.0, 1560.0, 1800.0]
      throttle:   [0.15,  0.18,  0.85,  0.62,  0.66,   0.98,   0.95,   0.35,   0.20,   0.05]

  thermal:
    spin_up_hours: 48.0
    tick_s: 10.0
    penumbra_rays: 7        # the pods stand 40 mm off the arms: a 0.4 mm ramp, but free here

    # The body and the four motor pods, as the boxes they are to the sun (ADR 0095).
    occluders:
      - {name: body_w,  centre_m: [-0.15, 0.0, 0.30], u_axis: [0.0, 1.0, 0.0], v_axis: [0.0, 0.0, 1.0], half_u_m: 0.15, half_v_m: 0.06}
      - {name: body_e,  centre_m: [ 0.15, 0.0, 0.30], u_axis: [0.0, 1.0, 0.0], v_axis: [0.0, 0.0, 1.0], half_u_m: 0.15, half_v_m: 0.06}
      - {name: body_s,  centre_m: [0.0, -0.15, 0.30], u_axis: [1.0, 0.0, 0.0], v_axis: [0.0, 0.0, 1.0], half_u_m: 0.15, half_v_m: 0.06}
      - {name: body_n,  centre_m: [0.0,  0.15, 0.30], u_axis: [1.0, 0.0, 0.0], v_axis: [0.0, 0.0, 1.0], half_u_m: 0.15, half_v_m: 0.06}
      - {name: body_top, centre_m: [0.0, 0.0, 0.36], u_axis: [1.0, 0.0, 0.0], v_axis: [0.0, 1.0, 0.0], half_u_m: 0.15, half_v_m: 0.15}
      - {name: pod_n_top, centre_m: [0.0,  0.42, 0.34], u_axis: [1.0, 0.0, 0.0], v_axis: [0.0, 1.0, 0.0], half_u_m: 0.03, half_v_m: 0.03}
      - {name: pod_n_s,   centre_m: [0.0,  0.39, 0.31], u_axis: [1.0, 0.0, 0.0], v_axis: [0.0, 0.0, 1.0], half_u_m: 0.03, half_v_m: 0.03}
      - {name: pod_e_top, centre_m: [0.42, 0.0, 0.34], u_axis: [1.0, 0.0, 0.0], v_axis: [0.0, 1.0, 0.0], half_u_m: 0.03, half_v_m: 0.03}
      - {name: pod_e_s,   centre_m: [0.42, -0.03, 0.31], u_axis: [1.0, 0.0, 0.0], v_axis: [0.0, 0.0, 1.0], half_u_m: 0.03, half_v_m: 0.03}

    surfaces:
      # The deck: 0.30 x 0.30 m of carbon on top of the body, the one surface a camera above sees.
      - name: deck
        material: carbon_fibre
        tilt_deg: 0.0
        speed_s:   [0.0, 120.0, 300.0, 900.0, 1200.0, 1560.0, 1800.0]
        speed_m_s: [1.0,   1.0,   8.0,  15.0,   10.0,    1.0,    1.0]
        patch: {origin_m: [-0.15, -0.15, 0.36], u_axis: [1.0, 0.0, 0.0], v_axis: [0.0, 1.0, 0.0], n_u: 12, n_v: 12, du_m: 0.025, dv_m: 0.025, thickness_m: 0.002, frame: world, prim_path: /World/Quad/deck}

      # The belly: the same plate facing down. tilt 180 means it sees no sky at all -- only the
      # ground under it -- which is why a quadrotor read from below is nothing like one read
      # from above.
      - name: belly
        material: carbon_fibre
        tilt_deg: 180.0
        speed_s:   [0.0, 120.0, 300.0, 900.0, 1200.0, 1560.0, 1800.0]
        speed_m_s: [1.0,   1.0,   8.0,  15.0,   10.0,    1.0,    1.0]
        patch: {origin_m: [-0.15, -0.15, 0.24], u_axis: [1.0, 0.0, 0.0], v_axis: [0.0, 1.0, 0.0], n_u: 12, n_v: 12, du_m: 0.025, dv_m: 0.025, thickness_m: 0.002, frame: world, prim_path: /World/Quad/belly}

      # Two arms, north and east: 0.30 m of carbon tube from the body to the pod, 40 mm below the
      # deck so the deck's own shadow falls across their inner half at a high sun.
      - name: arm_n
        material: carbon_fibre
        tilt_deg: 0.0
        speed_s:   [0.0, 120.0, 300.0, 900.0, 1200.0, 1560.0, 1800.0]
        speed_m_s: [1.0,   1.0,   8.0,  15.0,   10.0,    1.0,    1.0]
        patch: {origin_m: [-0.025, 0.15, 0.32], u_axis: [1.0, 0.0, 0.0], v_axis: [0.0, 1.0, 0.0], n_u: 2, n_v: 12, du_m: 0.025, dv_m: 0.025, thickness_m: 0.002, frame: world, prim_path: /World/Quad/arm_n}
      - name: arm_e
        material: carbon_fibre
        tilt_deg: 0.0
        speed_s:   [0.0, 120.0, 300.0, 900.0, 1200.0, 1560.0, 1800.0]
        speed_m_s: [1.0,   1.0,   8.0,  15.0,   10.0,    1.0,    1.0]
        patch: {origin_m: [0.15, -0.025, 0.32], u_axis: [1.0, 0.0, 0.0], v_axis: [0.0, 1.0, 0.0], n_u: 12, n_v: 2, du_m: 0.025, dv_m: 0.025, thickness_m: 0.002, frame: world, prim_path: /World/Quad/arm_e}
