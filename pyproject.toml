[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irsim"
version = "0.1.0"
description = "Physically-based multi-band infrared camera simulator"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",  # np.trapezoid; Isaac Sim 6.0 ships 2.3 (docs/decisions/0002)
    "scipy>=1.11",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.8",
    "types-PyYAML>=6.0",  # mypy --strict on `import yaml` (irsim.config loader)
    "matplotlib>=3.8",
]
# Reading somebody else's imagery (roadmap ME.1b): only needed for sets stored as images or
# video. Sequences written as .npy need no decoder, which is why the default gate does not
# install this and every test here runs without it.
validation = [
    "imageio>=2.31",
]
# PH.12's two-node oracle. **Dev-only and never imported by `src/irsim`** (there is a test), and
# not installed by `make install`: it exists so that PH.12's fourth acceptance criterion -- leaf
# ISO 7730 clothing temperature against an independent comfort model -- can be run by anyone who
# wants it, rather than being quietly dropped because no package was to hand.
comfort = [
    "pythermalcomfort>=2.8",
]
# Tier 5 training (roadmap ME.7). **Deliberately not a default and not installed by `make install`.**
# torch is multi-gigabyte, `src/irsim` may never import it (enforced by tests/unit/test_layering.py),
# and a Tier 4 report must not be blocked on it. The *scoring* metrics need none of this: they are
# pure NumPy in `irsim_eval.detection` and run in the default environment, so a detector trained
# anywhere can be scored here.
ml = [
    "torch>=2.2",
    "torchvision>=0.17",
]
# Engine-side extra: deliberately empty (ADR 0061). Isaac Sim ships NVIDIA Warp as the
# `omni.warp.core` Kit extension (1.16.0 on the pinned build, ADR 0014); a pip `warp-lang` would
# shadow it and make the equivalence harness pass against the wrong runtime. Warp code runs
# only inside a Kit application (the `simulation_app` fixture); nothing in the default gate needs it.
isaac = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not isaac and not gpu'"
markers = [
    "isaac: requires a running Isaac Sim environment",
    "gpu: requires CUDA",
    # GT.1: not "slow" as a vague label but "not in the 30-second developer loop". Applied at
    # module level to the validation benches (Tier 2/3/4 phenomenology), the end-to-end frame
    # benches and the file-regeneration checks, and per test to anything else over a second.
    # `make test` skips these; `make test-slow` and `make check` run them.
    "slow: a validation bench, an end-to-end frame, or a test over a second",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "NPY"]
ignore = ["N802", "N803", "N806"]  # physics notation: T, L, F, C1L, d_.._dT are correct names

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "matplotlib.*",
    "omni.*",
    "pxr.*",
    "isaacsim.*",
    "warp.*",
    "carb.*",
    # OpenVDB and NanoVDB ship as compiled extension modules inside Isaac Sim's `omni.volume`
    # (ADR 0140), with no stubs and no presence on `sys.path` until `ensure_openvdb_on_path`
    # puts them there. Imported lazily inside `cloud_volume.write_openvdb` and nowhere else.
    "openvdb.*",
    "nanovdb.*",
    # ROS 2 is a system-level install (sourced setup.bash), not a pip package this project can
    # depend on, so it is never present for a type check. M10.10b's bridge imports it lazily in
    # exactly one function and everything else about the messages is checked without it.
    "rclpy.*",
    "sensor_msgs.*",
    # isaac-weather-fx is a git submodule that ships as a Kit extension directory rather than as
    # an installed distribution, so it is on `sys.path` only after `ensure_weather_fx_on_path`.
    # Every use of it goes through `irsim.atmosphere.weather_fx`, which is checked.
    "weather_fx.*",
]
ignore_missing_imports = true
