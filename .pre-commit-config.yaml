# Wires `scripts/stage_own_hunk.sh check` in as the default commit path (roadmap RP.3), so a plain
# `git add README.md` that would clobber another session's committed change is caught before the
# commit lands rather than after. Install once per clone: `pre-commit install`.
#
# This does not replace `scripts/stage_own_hunk.sh snapshot`/`stage` — the hook can only detect a
# clobber that already happened at commit time; the script is what avoids it. See TECHNICAL_REPORT.md's
# Contributing section and the `ship-step` skill.
repos:
  - repo: local
    hooks:
      - id: stage-own-hunk-guard
        name: guard shared-file commits against whole-file clobbers
        description: >-
          Refuses to commit README.md, TECHNICAL_REPORT.md, CHANGELOG.md or docs/roadmap.md unless the staged content
          is what `scripts/stage_own_hunk.sh stage` would have produced for this session.
        entry: scripts/stage_own_hunk.sh check
        language: script
        files: ^(README\.md|TECHNICAL_REPORT\.md|CHANGELOG\.md|docs/roadmap\.md)$
        pass_filenames: true
