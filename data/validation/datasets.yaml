# Public validation data (roadmap ME.1; ADR 0003).
#
# No IR camera is available to this project, so every comparison against reality is made against
# imagery somebody else published. That makes *what each set actually is* a first-class fact:
# a statistic measured on a display-output MP4 is not the same statistic measured on a Y16 stream,
# and a set whose sensor is undocumented cannot support a radiometric claim at all.
#
# This file is the single source of truth for that. `data/validation/README.md` is generated from
# it (`python -m irsim_eval.manifest --render`), so the prose and the machine-readable fields
# cannot drift apart.
#
# FIELD NOTES
#
#   licence         SPDX id, or `unstated` when the publisher did not state one. `unstated` is
#                   not a guess that it is permissive -- it means the redistribution and use terms
#                   are unknown, and `scripts/fetch_validation_data.py` refuses such a set unless
#                   it is asked explicitly.
#   signal_path     What happened to the photons between the detector and the file, as one of
#                   `display`, `recorder`, `radiometric` or `unknown`. This decides which analysers
#                   are allowed to run: an AGC signature cannot be measured on a set that never
#                   went through an AGC, and noise statistics from a lossy codec are bounded below
#                   by the codec, not by the sensor. The vocabulary and the analyser-to-path table
#                   are in `src/irsim/validation/signal_path.py`, and loading this file FAILS if a
#                   set lists a measurement its own path cannot carry -- so the rule is enforced
#                   here rather than remembered.
#   signal_path_note  The per-set detail behind that one word: which recorder, which codec, which
#                   part of it is still unverified. Prose, and the README prints it verbatim.
#   access          `direct` (a URL a script can fetch), `manual` (a drive link, a form, or an
#                   access request -- a human has to do it), or `unreleased`.
#   sha256          Filled in by the fetch script once the archive is on disk; empty here because
#                   this project has not downloaded these sets and will not invent a hash.
#   analysers       Which ME.2-ME.4 measurements this set may be used for. Deliberately narrow,
#                   and a name not in the table above is refused rather than ignored: a typo in a
#                   permission list is a permission granted to nothing, or to the wrong thing.
#
# VERIFIED indicates the field was checked against the publisher's own page on the stated date.
# ESTIMATED or UNVERIFIED means it came from a paper or a secondary source and should be confirmed
# before any number derived from it is published.
#
# A LICENCE NEARBY IS NOT A LICENCE FOR THE DATA. `XD.1` re-checked three entries and two of them
# turned on this one distinction. LRDDv3's arXiv paper carries CC BY 4.0 and its *dataset* page
# names CDLA-Permissive-2.0 with conditions the licence does not contain; Anti-UAV600's repository
# announces the MIT License over its *toolkit* and states nothing about the frames. The question
# for this field is never "is a licence written down nearby" but "is this a grant over these
# frames", and it is load-bearing: `licence_known` is what opens the fetch gate.

schema_version: 2
checked_utc: "2026-09-24"                     # XD.1: anti_uav_410, lrddv3, anti_uav_600. XD.3: massmind

datasets:
  halmstad_drone_detection:
    title: "A dataset for multi-sensor drone detection (Svanström et al. 2021)"
    role: primary
    why: >-
      The only set here with an unambiguous licence, a citable DOI, and a fully documented signal
      path from a camera core this project already models. That combination makes it the reference
      set: every other entry is a supplement to it, not a substitute.
    doi: "10.5281/zenodo.5500576"
    code_url: "https://github.com/DroneDetectionThesis/Drone-detection-dataset"
    paper_doi: "10.1016/j.dib.2021.107521"
    licence: "CC0-1.0"                       # VERIFIED 2026-09-13 (repository LICENSE file)
    licence_note: >-
      CC0-1.0 is the licence in the code repository's own LICENSE file, and the repository also
      states the data is "free to download, use and edit". CHECKED 2026-09-15 at the DOI, and the
      two do not agree: the Zenodo record declares `other-open` with no rights text, which is
      weaker and less specific than CC0-1.0. Use is clearly permitted by both; **redistribution of
      frames is not established by the Zenodo record alone**, so derive statistics from this set
      and do not republish its imagery.
    access: direct                            # CHECKED 2026-09-15: the Zenodo record serves the
                                              # archive over https with no interstitial (200,
                                              # 311 348 350 bytes). It was indexed `manual` on
                                              # 2026-09-13 from the repository README, which
                                              # points at the DOI landing page rather than the
                                              # file; the landing page needs a human, the file
                                              # does not.
    download_url: "https://zenodo.org/records/5500576/files/DroneDetectionThesis/Drone-detection-dataset-v1.0.0.zip"
    download_bytes: 311348350                 # VERIFIED 2026-09-15 (content-length)
    sensor: "FLIR Breach PTQ-136 (Boson 320x256 core)"     # VERIFIED 2026-09-13
    fov_deg: [24.0, 19.0]                                   # VERIFIED 2026-09-13
    resolution: [320, 256]
    frame_rate_hz: 30                         # CORRECTED 2026-09-15 by ffprobe on every clip.
                                              # The *core* runs at 60 Hz; the *files* are stored
                                              # at 30. The index said 60, which is the camera's
                                              # figure and not the data's, and a one-pole temporal
                                              # fit run at 60 Hz on a 30 Hz file returns a time
                                              # constant wrong by a factor of two while looking
                                              # entirely plausible. Analysers must take the rate
                                              # from the container (irsim_eval.decode.probe_clip),
                                              # never from this field.
    sensor_frame_rate_hz: 60                  # what the core produces, for the record
    bit_depth_native: 16                      # Y16 off the core
    bit_depth_stored: 8
    codec: "h264 (Main profile, yuv420p) in mp4"   # VERIFIED 2026-09-15 by ffprobe
    colour_range: "unknown"                   # VERIFIED 2026-09-15 -- and it matters: with no
                                              # range flag, limited- and full-range readings of
                                              # the same file differ by a gain of 255/219 and an
                                              # offset of 16 codes, about 8 DN8 codes on these
                                              # frames. That is several times the sensor noise
                                              # that survived the codec, so no absolute-level
                                              # statistic from this set means anything.
    bitrate_kbps: 128                         # MEASURED 2026-09-15, median over the IR clips
    clips: 365                                # IR clips; 285 visible clips are not used here
    clip_seconds: 10.7                        # CORRECTED 2026-09-15: ~322 frames at 30 Hz
    annotated_frames: 203328                  # across IR and visible together
    classes: ["drone", "bird", "airplane", "helicopter"]
    label_format: "matlab .mat -- Video Labeler `groundTruth` (MCOS), no Python reader"
    label_note: >-
      CORRECTED 2026-09-15. The index previously said "a python decoder ships in the repo"; it
      does not. The repository ships a MATLAB script (Create_a_dataset_from_videos_and_labels.m),
      and the .mat files hold MCOS class instances inside __function_workspace__ that
      scipy.io.loadmat returns as an opaque blob. Every box-dependent analyser is therefore
      excluded below until somebody runs the MATLAB script and exports the boxes.
    signal_path: recorder                 # Y16 off the Boson, converted downstream
    signal_path_note: >-
      Boson Y16 16-bit stream -> recorder converts to 8-bit -> stored as mp4. The frames therefore
      carry the core's noise, striping and FFC freezes but NOT its AGC, DDE or palette: the
      recorder's conversion stands in for the ISP and its rule (linear? min-max per frame?) is
      itself unverified. Treat any histogram-shape statistic as measuring the recorder.
    analysers:
      - noise_3d
      - spatial_psd
      - temporal_psd
      - ffc_freeze
      - fixed_pattern_growth
      - bad_pixels
    excluded_analysers:
      - agc_signature          # never went through an AGC
      - dde_overshoot          # ditto
      - target_size_and_scr    # needs boxes; see label_note -- MATLAB MCOS, no Python reader
      - edge_spread            # ditto
      - smear                  # ditto
    sha256: "53deda08127dc7896e96454cf35e866e8d6bee336f25d290b26e1f5324e23c81"
    # RECORDED 2026-09-15 from the archive this project downloaded and measured. Every number in
    # docs/validation/reference-stats-*.md was measured on these exact bytes (ADR 0004's rule,
    # applied to somebody else's data).
    notes: >-
      Ten-second clips are too short for an FFC *interval* distribution (the Boson's is 180 s);
      they can still show freeze length. Maximum sensor-to-target range is 200 m by the flight
      regulations in force, so this set says nothing about the 0.5-5 km regime phase 1 models.

  anti_uav_410:
    title: "Anti-UAV410 (Huang et al., TPAMI 2023)"
    role: supplement
    why: >-
      410 sequences long enough to show an FFC *interval* distribution, which the 10-second
      Halmstad clips cannot. Its frames are display output, so it is the set that says what a
      finished thermal picture of a drone looks like.
    code_url: "https://github.com/HwangBo94/Anti-UAV410"
    paper_doi: "10.1109/TPAMI.2023.3335338"
    licence: "unstated"                       # VERIFIED 2026-09-13: no licence file or statement
    licence_note: >-
      The repository states no licence for the data. Unstated is not permissive. Using the frames
      for measurement on one machine is a different question from redistributing them or training
      a model that is shipped; settle that before either.
    access: manual                            # Google Drive / Baidu Disk links in the README
    sensor: "undocumented"
    # Left null on purpose, and `XD.1` asked for 640x512 / 25 Hz here. Searched 2026-09-24: the
    # repository states neither, the TPAMI paper is paywalled, and the one place those numbers
    # appear is a secondary aggregator describing the **Anti-UAV RGBT** parent set (Jiang et al.
    # 2021, arXiv 2101.08466) -- which is a different, RGB+IR collection, where 410 is IR-only.
    # No primary source states them for these 410 sequences, and the entry's own note says they
    # vary by sequence. `probe_clip` reads both from the file and *not* from this index, exactly
    # so a wrong index value cannot reach a temporal fit, so writing an unsourced number here
    # would buy nothing and assert something nobody has checked.
    resolution: null                          # UNVERIFIED -- varies by sequence, measure on load
    frame_rate_hz: null                       # UNVERIFIED -- see above; the family value is 25 Hz
    bit_depth_native: null
    bit_depth_stored: 8
    codec: "lossy"                            # UNVERIFIED beyond "not lossless"
    bitrate_kbps: null
    clips: 410
    annotated_boxes: 438000                   # "over 438K", paper
    label_format: "per-sequence json boxes"
    signal_path: display                  # the camera's own 8-bit picture, ISP and all
    signal_path_note: >-
      The camera's display output through an unknown ISP, stored lossy. AGC, DDE, palette and any
      temporal filtering are all baked in and none of them are documented, so nothing measured
      here can be attributed to the sensor rather than to its ISP.
    analysers:
      - ffc_interval
      - agc_signature
      - dde_overshoot
      - target_size_and_scr
      - contrast_polarity
    excluded_analysers:
      - noise_3d               # ISP + codec dominate; the sensor's noise is not recoverable
      - temporal_psd
    notes: >-
      The sensor being undocumented is the binding constraint: with no pitch, focal length or NETD
      there is no way to convert a measured box size into a range or a measured contrast into
      kelvin. Use it for shape-of-the-picture statistics only.

  anti_uav_600:
    title: "Anti-UAV600 (Zhu et al., 2023)"
    role: supplement
    why: >-
      The largest infrared anti-UAV set indexed here -- 600 sequences and over 723k frames, against
      Anti-UAV410's 410 and ~438k boxes -- and the only one built for targets that *appear and
      reappear* rather than being handed an initial box. That makes it the set for the statistic
      this simulator most needs from reality: how often a small sky target is there at all, across
      enough frames for the answer to mean something.
    code_url: "https://github.com/ZhaoJ9014/Anti-UAV"
    download_url: "https://modelscope.cn/datasets/ly261666/3rd_Anti-UAV/files"
    paper_arxiv: "2306.15767"
    licence: "unstated"                       # VERIFIED 2026-09-24: see the note -- MIT is the CODE
    licence_note: >-
      The repository says "the project of Anti-UAV is released under the MIT License". That covers
      the **project** -- the toolkit and baselines -- and the repository states no licence for the
      data. The arXiv paper separately carries CC BY-NC-SA 4.0, which is the submission licence for
      the paper and not for the frames. Neither is a grant over the dataset, so this stays
      `unstated` and the fetch gate keeps refusing it until somebody reads the terms at the source.
      Recording MIT here because it is the word on the repository's front page is the mistake this
      note exists to stop.
    access: manual                            # ModelScope, behind an account
    sensor: "undocumented"
    resolution: null                          # not stated by the paper or the repository
    frame_rate_hz: null
    bit_depth_stored: 8
    codec: "lossy"                            # UNVERIFIED beyond the family's practice
    clips: 600
    frames: 723000                            # "over 723K thermal infrared frames", paper abstract
    label_format: "per-sequence json boxes"
    signal_path: display                  # as anti_uav_410
    signal_path_note: >-
      Infrared only -- the repository states that "410 and 600 versions only contain IR videos
      while 300 version contains both RGB videos and IR videos", which is what makes this the
      largest IR set of the family rather than the largest set. Display output through an
      undocumented ISP, as Anti-UAV410, so AGC, DDE and any temporal filtering are baked in and
      nothing measured here separates the sensor from its ISP.
    analysers:
      - target_size_and_scr
      - contrast_polarity
      - agc_signature
      - cloud_clutter_psd
    excluded_analysers:
      - noise_3d               # ISP + codec dominate; the sensor's noise is not recoverable
      - temporal_psd
      - ffc_freeze
    notes: >-
      Indexed 2026-09-24 from the paper abstract and the repository; the frame count is the paper's
      "over 723K" and is therefore a floor. Resolution, frame rate and sensor are stated by neither
      source: measure the first on load and do not assume the family's 640x512 / 25 Hz applies,
      which is the same caution `anti_uav_410` carries and for the same reason. The set exists to
      be a *population*, not a radiometric reference -- with no pitch, focal length or NETD there
      is no route from a box size to a range or from a contrast to kelvin.

  cst_anti_uav:
    title: "CST Anti-UAV (Xie et al., ICCV 2025 Workshops)"
    role: supplement
    why: >-
      220 sequences built specifically around *tiny* targets in complex scenes -- the regime where
      the MS.6 point-target path replaces the renderer, and the one this simulator is least able
      to check any other way.
    code_url: "https://github.com/PCwenyue/CST-Anti-UAV"
    paper_arxiv: "2507.23473"
    licence: "unstated"                       # VERIFIED 2026-09-13
    access: unreleased                        # the repo is a toolkit; the data release is pending
    sensor: "undocumented"
    resolution: null
    bit_depth_stored: 8
    codec: "lossy"
    clips: 220
    annotated_boxes: 240000                   # "over 240k", paper
    signal_path: display                  # as anti_uav_410, UNVERIFIED in detail
    signal_path_note: >-
      Display output, as Anti-UAV410. UNVERIFIED in detail; confirm from the paper before use.
    analysers:
      - target_size_and_scr
      - contrast_polarity
      - cloud_clutter_psd
    excluded_analysers:
      - noise_3d
      - agc_signature
    notes: >-
      Listed now so the index is complete and so nobody re-derives its status later. Check the
      repository before planning work against it.

  lrddv3:
    title: "LRDDv3: long-range drone detection with range information and thermal data"
    role: supplement
    why: >-
      The only indexed set with per-image **range** labels, which is the one thing needed to test
      size-versus-range and SCR-versus-range against reality rather than against the model's own
      geometry.
    site_url: "https://research.coe.drexel.edu/ece/imaple/lrddv3/"
    paper_arxiv: "2605.25942"
    licence: "CDLA-Permissive-2.0"            # VERIFIED 2026-09-24: the site links cdla.dev/permissive-2-0
    licence_note: >-
      Read this one carefully, because two licences are in play and only one of them is the data's.
      The **paper** on arXiv carries CC BY 4.0; that is the arXiv submission licence and says
      nothing about the frames. The **dataset** page states "the dataset is fully free to use for
      commercial or R&D purposes under CDLA-v2" and links CDLA-Permissive-2.0. Taking the paper's
      badge for the data's terms is the specific error this note exists to stop -- `XD.1` asked for
      exactly that substitution and it is why the field was re-checked at the source instead.

      Two conditions sit on top of the licence and neither is in it. The page states "the only
      restriction on the dataset is the access based on the US export regulations", and it also
      states "if approved, you may then use it for any application you wish, but may not
      redistribute" -- which CDLA-Permissive-2.0 itself *does* permit. The publisher's own
      condition is narrower than the licence it names, so the narrower one governs: do not
      redistribute the frames, and treat access as export-controlled.
    access: manual
    sensor: "Autel Robotics EVO II Dual 640T V3"  # VERIFIED 2026-09-24 from the paper's full text
    resolution: [640, 512]
    frame_rate_hz: 5                          # what the stored images are: sampled at 5 fps
    sensor_frame_rate_hz: 30                  # VERIFIED: "recorded IR data at 640x512 at 30 FPS"
    bit_depth_stored: 8
    clips: 128
    thermal_images: 29630
    signal_path: unknown                  # UNVERIFIED: Y16-derived or display output
    signal_path_note: >-
      The camera records IR at 640x512 and 30 fps and the set stores frames sampled from that at
      5 fps, so the two rates are different numbers and are carried in different fields -- an
      analyser must fit against the 5 fps of the file it is reading, never the camera's 30.
      UNVERIFIED whether the thermal frames are Y16-derived or display output. At 5 fps nothing
      temporal can be measured: no FFC freeze, no temporal PSD.
    analysers:
      - target_size_and_scr
      - size_vs_range
    excluded_analysers:
      - noise_3d
      - temporal_psd
      - ffc_freeze
      - smear
    notes: >-
      Ranges are mostly 0-50 m and reach only ~175 m, and the geometry is air-to-air with ground
      clutter behind the target. It therefore constrains the near end of the range law and says
      nothing about a 0.5-5 km sky-background target, which is the case phase 1 actually models.

  massmind:
    title: "MassMIND: Massachusetts Maritime INfrared Dataset"
    role: supplement
    why: >-
      The first public LWIR maritime set, and the only indexed source with **pixel-level labels for
      sky and water**. Every noise statistic in this project needs a region where the scene is not,
      and `EV.3` showed the heuristic flat-window finder returning nothing at all on rendered clips.
      A labelled sky or water polygon is that window, stated by the publisher rather than guessed
      at, which is what the maritime lane needs before anything else.
    site_url: "https://github.com/uml-marine-robotics/MassMIND"
    paper_doi: "10.1177/02783649231153020"
    paper_arxiv: "2209.04097"
    licence: "CC-BY-NC-SA-4.0"                # VERIFIED 2026-09-24
    licence_note: >-
      This one **is** a grant over the frames, and it was checked the way `XD.1` learned to check.
      The repository's LICENSE file is the CC BY-NC-SA 4.0 text, and the README's own Copyright
      section says it of the data rather than of code: "All datasets and benchmarks on this page
      are copyrighted by us and published under the Creative Commons
      Attribution-NonCommercial-ShareAlike 4.0 License."

      **NonCommercial is a real restriction on this project, not a formality.** This simulator is
      aimed at eventual deployment on a vehicle, and ShareAlike reaches anything derived from these
      frames. So the terms are known -- `licence_known` is true and the fetch gate opens -- and the
      use is still narrower than any other set here: measure against it, cite it, and keep anything
      built from it out of a commercial artefact.
    access: manual                            # three Google Drive links; a human has to fetch them
    sensor: "FLIR ADK -- 320x256 in 2019, 640x512 from 2020"
    resolution: [640, 512]                    # what the release presents; see signal_path_note
    fov_deg: null                             # two cameras, 34 deg and 75 deg horizontal -- see notes
    frame_rate_hz: null                       # single frames selected from rosbags, not sequences
    bit_depth_native: 16                      # VERIFIED: the ADK writes 16-bit TIFF (paper Table 1)
    bit_depth_stored: null                    # NOT STATED by the publisher -- see signal_path_note
    thermal_images: 2916                      # VERIFIED: README and paper Table 2
    annotated_frames: 2916                    # every image is labelled; that is the point of the set
    classes: ["sky", "water", "bridge", "obstacle", "living obstacle", "background", "self"]
    label_format: "pixel-level semantic and instance masks (segments.ai export), one per image"
    label_note: >-
      Masks, not boxes. An instance mask gives an extent directly and more honestly than a box does,
      but nothing here carries a range, so no size-versus-range claim is available.
    signal_path: unknown                      # the release format is not stated; see the note
    signal_path_note: >-
      **The bit depth of the released frames is not stated by anybody, and this entry refuses to
      infer it.** The paper's camera table says the ADK writes "16 bit TIFF or compressed 8 bit
      PNG" (2019: 16-bit TIFF) -- that is the *camera's output options*, not a statement about
      what is inside `Images.zip`. The frames were extracted from rosbag files, the README does not
      say in what format, and the repository's own samples are 8-bit PNG. Taking the camera's
      capability for the file's contents is the same substitution `XD.1` caught on a licence, and
      it is load-bearing in the same way: `signal_path` is what opens the analyser gate. So this is
      `unknown` until one file is opened, which settles it in a line -- and the set becomes
      `radiometric` at that moment if the values are ADK counts, since those are linear in radiance
      and are not a calibrated temperature.

      **Half the set is upsampled and that is verified, not suspected.** The paper's Table 2 splits
      the 2916 images as 1423 from 2019 (48.8 %) and 1493 from 2020 (51.2 %), and the 2019 camera
      is 320x256. The release presents everything at 640x512 and the paper states "Original image
      resolution of 640x512 (width x height) pixels was used across all the architectures ... for
      both 2019 as well as the 2020 images". So nearly half these frames carry no sensor content
      above half their stated Nyquist: on those, a spatial PSD, an edge spread or a fixed-pattern
      measurement describes an interpolator. The two halves are separable by their timestamps, and
      any spatial statistic from this set has to say which half it was measured on.
    analysers:
      - target_size_and_scr    # instance masks give an extent; SCR against the ring around it
      - target_size_prior
      - scr_prior
    excluded_analysers:
      - noise_3d               # single frames, not sequences -- there is no temporal axis at all
      - temporal_psd           # ditto
      - ffc_freeze             # ditto
      - spatial_psd            # 48.8 % of the frames are upsampled; see signal_path_note
      - edge_spread            # ditto, and DDE is unknown
      - agc_signature          # nobody said whether these frames met an AGC
      - size_vs_range          # no range label anywhere in the set
    notes: >-
      Two cameras over two years, so one `fov_deg` cannot describe the set: 34 deg horizontal in
      2019 at 320x256, 75 deg from 2020 at 640x512, both 12 um pitch, 8-14 um, NETD < 50 mK
      (paper Table 1). Both figures matter for any angular claim and neither applies to the whole
      set. Recorded 2026-09-24 from the repository and the arXiv full text; nothing has been
      downloaded, so there is no `sha256` and the format question above stays open until there is.

  irstd_1k:
    title: "IRSTD-1k infrared small-target detection set"
    role: prior
    why: >-
      A thousand single frames of small targets against sky, sea and land. No sequence, no sensor,
      no radiometry -- but a large sample of what target *size* and local contrast look like.
    licence: "unstated"                       # VERIFIED 2026-09-13: no canonical licensed source
    access: manual
    sensor: "undocumented"
    resolution: [512, 512]
    bit_depth_stored: 8
    frames: 1000
    signal_path: unknown                  # provenance not documented per image
    signal_path_note: "unknown; single frames, provenance not documented per image"
    analysers:
      - target_size_prior
      - scr_prior
    excluded_analysers:
      - noise_3d
      - temporal_psd
      - ffc_freeze
      - agc_signature
      - size_vs_range
    notes: >-
      Priors only. With no sensor and no range there is nothing to convert a pixel count into, so
      a statistic from this set can bound a distribution but can never be a target the simulator
      is tuned to hit.

  nuaa_sirst:
    title: "NUAA-SIRST (SIRST v1) single-frame infrared small-target set"
    role: prior
    why: "As IRSTD-1k, and commonly reported alongside it, so the two are indexed together."
    licence: "unstated"                       # VERIFIED 2026-09-13
    access: manual
    sensor: "undocumented"
    bit_depth_stored: 8
    frames: 427
    signal_path: unknown                  # provenance not documented per image
    signal_path_note: "unknown; single frames, provenance not documented per image"
    analysers:
      - target_size_prior
      - scr_prior
    excluded_analysers:
      - noise_3d
      - temporal_psd
      - ffc_freeze
      - agc_signature
      - size_vs_range
    notes: "Priors only, for the same reasons as IRSTD-1k."
