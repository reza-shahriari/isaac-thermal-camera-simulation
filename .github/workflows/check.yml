# GPU-free gate on plain CPython (ADR 0002 interpreter matrix). The engine-free core and the
# default test gate must pass here with no Isaac Sim and no CUDA; the layering test is what
# keeps that true. Locally the same thing is `make ci` (venv) or `make check-full` on the Isaac
# interpreter.
name: check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # ~77 CPU-minutes of tests over the runner's cores
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (editable + dev extras)
        run: python -m pip install -e ".[dev]"
      - name: make check-full (every test; local `make check` runs only the affected ones, ADR 0193)
        run: make check-full PYTHON=python
