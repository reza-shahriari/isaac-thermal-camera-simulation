  - id: car-ignition
    title: A car that starts its engine
    lead: |
      The owner's second requirement: an engine must warm *the metal around it*, not only itself
      (ADR 0087/0088/0089). The bonnet here is **one USD prim**, 23 × 19 cells — flat to under a
      millikelvin in frame 0 and **5.82 K across** at the end of this 29.5-minute run, which is
      116 NETD of structure that a per-prim bridge has a single number to represent. Behind it the
      engine bay has risen 26.4 K and the exhaust pipe 47.7 K over air.

      Two scenes run the same §6.6 heat-source node on the same load profile and differ only in the
      sky, which is how the occlusion term is separated from a scale factor: the road patch opens
      nearly three times wider under a clear sky than under overcast, while the bonnet moves the
      *other* way, because the skin radiates to that sky too.
    media:
      - video: car_ignition/car_ignition_agc.mp4
        width: full
        caption: >-
          the camera's own AGC — what the sensor would deliver, time-lapsed at one frame per 30 s
      - video: car_ignition/car_ignition_span_car.mp4
        width: half
        caption: the bonnet's own span, so the structure across one prim is visible
      - video: car_ignition/car_ignition_span_road.mp4
        width: half
        caption: >-
          a 1.6 K window on ambient — the road field holds 0.89 K, of which 0.15 K reaches the
          sensor, because the warmest asphalt is under the car and a 45° view cannot see it
    note: |
      The wheels do **not** warm, and the readout says so: §6.6 makes tyre heating flexing work and
      brake heating kinetic energy, and a car idling in a car park is doing neither. A test pins
      +0.000 K so a later change cannot quietly "fix" it.
    source: scripts/render_car_ignition.py

  - id: vessel-departure
    title: A vessel departure, filmed in LWIR
    lead: |
      A coaster leaving from 250 m while its funnel warms from cold alongside toward cruise power,
      played as a time lapse. The film shows what a static frame cannot: **the target's signature
      getting stronger while the target gets smaller.** Over the clip below the funnel runs
      **32 → 92 °C** while the range goes 250 → 994 m and the hull falls from 99,077 to 3,792
      pixels — a factor of 26 in area. That is the regime an infrared search set actually works in.

      The camera does not track, so the vessel climbs through the frame as its depression angle
      shrinks from 4.6° to 1.2°, crossing the sea's own angular gradient: it starts against near
      water at about the sea surface temperature and ends against far water that is mostly warm air.
    media:
      - frames: vessel_departure/frames/agc_%05d.png
        fps: 8
        width: full
        caption: >-
          the run's 32 AGC frames at 8 fps; the gauge reads funnel, deck and hull against the
          display span
    note: |
      The funnel had to be repainted. It was `bare_aluminium`, ε = 0.09 in LWIR, so it reflected the
      cold sky far more than it radiated and the renderer drew a **155 °C funnel as a dark
      rectangle**. Real funnels are painted steel, ε ≈ 0.9. A test now pins the two emissivities,
      because the mistake is invisible in the geometry and shows up only in the picture.
    source: scripts/render_vessel_departure.py

  - id: imported-asset
    title: An imported asset, flown
    lead: |
      A 62 MB third-party DJI Phantom 4 Pro FBX that nobody here modelled: 41 prims, 2,486,459
      triangles, **41 of 41 materials resolved in Kit** through `configs/assets/phantom4.yaml`. It
      flies a figure-of-eight from 4.6 m to 10.3 m range — 70 to 157 px across the span — and the
      display spans **−12.0 to 26.4 °C**.

      Solved point-wise it is the first scene in the project whose geometry was not authored in
      Python: 234,923 cells over 0.1628 m², and the physics the lane exists for — black mouldings
      reach **65.9 °C** where the white shell tops out at **33.8 °C** (α 0.94 against 0.25), every
      surface carrying a *span* rather than one value per object.

      Those cells reached no pixel until `AI.2` closed: this clip renders one temperature per
      prim. The outbound clip below is the one where the solve reaches the picture.
    media:
      - video: phantom4/phantom4_pair.mp4
        crf: 20      # the front page opens with this one
        width: full
        caption: LWIR beside its visible companion, the same instants
      - video: phantom4_weather/phantom4_pair.mp4
        width: half
        caption: >-
          the same aircraft under one weather-fx weather (14.2 °C air, 38 % cumulus with its base
          at 600 m): the infrared cloud reads about 9 °C against a −30 to −42 °C clear sky, the
          airframe 14 to 15 °C, on a −23.8 to 16.6 °C span — re-rendered after ADR 0146, which
          found the earlier clip's 17 °C cloud was lit by one weather and warmed by another
      - video: phantom4_smoke/phantom4_pair.mp4
        width: half
        caption: and through smoke
    source: scripts/render_phantom4.py

  - id: imported-asset-outbound
    title: Near to far, with the solve reaching the pixels
    lead: |
      The same imported Phantom 4 — now **split into functional parts** rather than into the
      material groups the FBX ships with — departing from **4 m to 80 m** at a held 16° of
      elevation: **183 px across down to 9**. Range is spaced geometrically, so the aircraft sheds
      the same fraction of its width every frame instead of collapsing in the first few and then
      crawling; the elevation is held so the sky behind it is the same at both ends and the
      contrast that survives is a statement about range.

      This is the clip where `AI.2` closed. `IrCamera` now takes `mesh_fields=`, so `WM.3`'s
      `MeshPointBridge` asks each bound prim's own triangles for the closest point to every pixel
      — **4,756 pixels took a cell** of a 23,477-cell solve across the nine prims this scene
      binds, and each of the four propellers carries a gradient *across itself*: **1.33 K, 1.46 K,
      2.19 K and 2.28 K**, against this camera's 50 mK NETD. The readout carries **four** thermal
      nodes, not the three the material grouping could express: airframe, motor, ESC and battery.

      The honest limit is which prims those are. The scene binds the battery, the four motor
      mounts and the four propellers; the shells and arms that make up most of the silhouette are
      unbound and still render at their node's single temperature. Binding them is a scene edit
      and a cell budget, not a code change.
    media:
      - video: phantom4_outbound/phantom4_parts_pair.mp4
        width: full
        caption: LWIR beside its visible companion, 4 m to 80 m, stretched to the aircraft
      - video: phantom4_outbound/phantom4_parts_skypair.mp4
        width: full
        caption: >-
          the same frames stretched to the sky instead: the cumulus both bands march from one
          cloud field, with the aircraft saturating
      - image: phantom4_outbound/near_structure_whitehot.png
        width: half
        caption: >-
          the first frame cropped to the aircraft and scaled to its own 18.1–23.2 °C, where the
          propellers read as four gradients rather than as four values
      - image: phantom4_outbound/frames/ir_00119.png
        width: half
        caption: 80 m — nine pixels across, on the sky it started against
    note: |
      Two stretches, one radiometry. A grayscale ramp fitted to the aircraft's 16.6–34.7 °C clips
      the sky to black, which makes the infrared frame look empty beside a visible companion full
      of cloud; in the same float32 planes the clear sky is 245.9 K and the cloud in front of it
      286.1 K, so weather-fx's 30 % cumulus is **40 K** of LWIR structure. Neither clip is more
      true than the other — the plane both are quantised from is.

      The aircraft's own temperature moves during the run, because the 28-minute mission plays
      while it flies and the readout carries it. What is held constant is the background.
    source: scripts/render_phantom4.py

  - id: aircraft-pass
    title: A low pass, where aspect is the variable
    lead: |
      A light business jet passing a ground sensor at 150 m/s, 300 frames of real time at 30 fps,
      closing to 250 m. The variable is **aspect**, not throttle: the exhaust nozzles are hidden
      behind their own nacelles from the front and fully exposed from the rear, which is why a real
      aircraft's measured infrared signature varies by a large factor around the clock. Measured off
      the instance-id plane at the same range either side of closest approach, this run shows
      **190 px of nozzle tail-on against 78 head-on**. The display spans 1.1 to 190.9 °C, which is
      the nozzle setting the top of it.

      A jet's hot part is a fortieth of its span across, so unlike the quadrotor's motors you never
      resolve it: it is a near-point source, bright because it is hundreds of kelvin hot rather than
      because it is large.
    media:
      - video: aircraft_pass/aircraft_pass_agc.mp4
        width: half
        caption: the camera's AGC
      - video: aircraft_pass/aircraft_pass_ir.mp4
        width: half
        caption: pre-AGC, mapped from radiance
    source: scripts/render_aircraft_pass.py

  - id: focus
    title: Focus, and what a defocused edge does
    lead: |
      A two-cube scene at Boson 640 optics, filmed through a focus sweep. Each depth layer is
      blurred with the kernel its own range earns and composited back to front using its **blurred
      coverage as alpha**, so a defocused edge is semi-transparent rather than a hard cut. The blur
      is applied in radiance, never in Kelvin (non-negotiable #3) — a test pins the half-covered
      edge to the radiance-blended temperature rather than the Kelvin mean, 6.7 K apart on a
      250/315 K edge.
    media:
      - video: focus_demo/focus_sweep.mp4
        width: half
        caption: 72 frames of focus sweep, engine-free
      - video: focus_sky_demo/focus_pull.mp4
        width: half
        caption: >-
          a focus pull against sky — a clear sky barely changes, because the high spatial
          frequencies in a real sky are cloud edges
      - image: focus_demo/focus_near.png
        width: third
        caption: focused near
      - image: focus_demo/focus_far.png
        width: third
        caption: focused far
      - image: focus_demo/focus_hyperfocal.png
        width: third
        caption: hyperfocal
    source:
      - scripts/focus_demo.py
      - scripts/focus_sky_demo.py

  - id: pointwise
    title: "Point-wise physics: every cell its own temperature"
    lead: |
      These are engine-free frames — a synthetic G-buffer over each patch's own plane, passed
      through the same point bridge the Isaac path uses, so the pixels are exactly what a render
      would carry before the radiometry.

      **PT.9 — the aerial scenario, regenerated point-wise.** The quadrotor in plan at four phases
      of the mission. The deck is one prim carrying its own field; each arm spans 29 K across the
      deck's and the motor pods' shadows. The scene this replaces held the whole airframe at one
      number.
    media:
      - image: pointwise/quad_aerial/plan_t0000_whitehot.png
        width: third
        caption: on the pad — deck 55.5 °C, belly 26.2 °C, arms span 29 K
      - image: pointwise/quad_aerial/plan_t0400_whitehot.png
        width: third
        caption: climbing at 9.2 m/s — deck 44.4 °C
      - image: pointwise/quad_aerial/plan_t1000_whitehot.png
        width: third
        caption: hard climb at 13.3 m/s — deck 40.3 °C, the excess collapsed to 13.8 K
      - image: pointwise/quad_aerial/plan_t1750_whitehot.png
        width: third
        caption: landed — deck 56.3 °C, the excess back at 29.6 K
    source: scripts/quad_flight_pointwise.py

  - id: still-water
    title: PH.3 — still water as a region of a patch
    lead: |
      One road prim, one patch, one solve. 20 mm of standing water over the western half, a wall's
      shadow across the southern rows. The puddle opens 3.8 K below the road and is 11.0 K below an
      hour later, having lost 0.85 of its 20 kg m⁻² . In the shade the same water is only 2.4 K
      below — evaporation is driven by each cell's own temperature, which a constant
      wet-is-colder offset cannot reproduce.
    media:
      - image: pointwise/puddle/road_t0000min_whitehot.png
        width: half
        caption: 14:00 — wet 52.5 °C, dry 56.3 °C, shadow along the bottom
      - image: pointwise/puddle/road_t0060min_whitehot.png
        width: half
        caption: 15:00 — wet 44.8 °C, dry 55.8 °C

  - id: exhaust-line
    title: TC.7 — the exhaust line as a gas stream in a wall
    lead: |
      The line under a car, manifold at the left and tailpipe at the right, three instants on one
      common scale. Running: 425 °C at the downpipe falling to 128 °C through the silencer, with the
      hangers showing as cold bands where they conduct into the body. The shielded manifold reads
      cooler than the bare pipe behind it, which is what a camera under a car actually sees.
    media:
      - image: pointwise/exhaust_line/under_car_whitehot.png
        width: full
        caption: "top: 20 min at 60 % load · middle: +65 s after key-off · bottom: +10 min"

  - id: sky-view-factor
    title: PT.21 — per-cell sky view factor
    lead: |
      How much sky each cell can see, black 0.0 to white 1.0, on the street-canyon scene. The roof
      sees the open hemisphere; a wall sees half of it; the ground between the buildings runs from
      0.99 in the open to 0.00 in the alley. This scales the diffuse solar and the longwave down
      together, which is why a shaded cell is not merely un-sunlit.
    media:
      - image: pointwise/sky_view/ground_svf.png
        width: third
        caption: the ground — SVF 0.000..0.990, mean 0.731
      - image: pointwise/sky_view/west_concrete_svf.png
        width: third
        caption: the west wall — 0.087 at the foot to 0.500 at the top
      - image: pointwise/sky_view/roof_svf.png
        width: third
        caption: the roof — 1.000 everywhere

  - id: cabin
    title: PT.15 — the cabin, solved with its panels
    lead: |
      A saloon in plan at 10:00. The cabin is a lumped member of the same solve as its five panels:
      it reaches 68.7 °C against 26.2 °C of air, and the roof runs 1.6 K over the adiabatic bonnet
      because it is the one panel the cabin is heating from behind.
    media:
      - image: pointwise/parked_car_cabin/plan_t0_whitehot.png
        width: half
        caption: 10:00 — cabin 68.7 °C, roof 65.0 °C, doors 31–32 °C
    source: scripts/parked_car_cabin.py

  - id: occlusion
    title: PT.20 / PT.22 — occlusion from geometry
    lead: |
      One building's west wall with a neighbour's shadow across it: the lit concrete stands 9.7 K
      over the shaded concrete, and half an hour after the shadow lifts the once-shaded half is
      still 8.1 K behind. The step is thermal history, not a shading mask applied to the image.
    media:
      - image: pointwise/wall_half_in_sun/west_wall_t0_whitehot.png
        width: half
        caption: the west wall at the scene start (298.6..313.0 K)
    source: scripts/wall_half_in_sun.py

  - id: flat-field
    title: Flat-field correction, and what it leaves behind
    lead: |
      The same scene recaptured with and without a flat field applied. Fixed-pattern structure is
      what a viewer reads as "thermal camera" long before radiometric accuracy is noticeable, which
      is why the noise chain (ADR 0053–0057) is modelled rather than approximated with Gaussian
      noise.
    media:
      - image: recapture/clear_no_flatfield.png
        width: third
        caption: clear sky, no flat field
      - image: recapture/clear_flatfield.png
        width: third
        caption: clear sky, flat-fielded
      - image: recapture/cloudy_flatfield.png
        width: third
        caption: cloudy, flat-fielded

  - id: cloud-in-the-path-tracer
    title: The cloud deck, rendered by the path tracer
    lead: |
      The first cloud this project has had *inside* the renderer rather than painted on a dome at
      infinity: `irsim.atmosphere.cloud_deck`'s field, written as OpenVDB by the library that
      ships inside Isaac Sim, and integrated by RTX path tracing with its own multiple scattering.
      Lit tops, flat bases, self-shadowing, and the cloud's shadow on the red backdrop behind it.
      ADR 0140 had recorded that nothing volumetric renders on this build; ADR 0144 records why
      that was wrong (a probe control that contained the thing under test, and material inputs
      the MDL does not declare) and the recipe that renders: a mesh box at the grid's world
      bounds with no transform, `primvars:isVolume`, and the `.vdb` handed to `OmniVolumeDensity`
      as its density texture. Measured in linear HDR against the control frame: the 99.9th
      percentile rises from 0.92 to 2.12, and the depth buffer does not move at all — a volume
      writes no depth, which is why occlusion in the infrared stays with this project's own march.
    media:
      - image: cloud_volume_probe/cloud_path_traced.png
        width: half
        caption: >-
          With the volume: 640×480, 64 samples per pixel, 32 bounces, one fixed tone curve anchored
          on the control frame.
      - image: cloud_volume_probe/control.png
        width: half
        caption: The control frame — the same backdrop and sun with nothing under test.
    note: |
      A probe frame, not a scene: the backdrop is a red plane and the haze with light shafts under
      the cloud is the probe's global volumetric fog setting, left on so that a shadow through it
      would show. The path-traced base is visibly noisy at this sample count; the dome bake remains
      the real-time path and the volume is the path-tracing one.
    source: scripts/probe_cloud_volume.py

  - id: sky-flat-bowl
    title: What a camera adds to an empty sky
    lead: |
      A clear sky gives the AGC no contrast of its own, so a real uncooled core pointed at one shows
      a smooth bowl filling the frame: its housing seen through the field (§8.2) and the housing's
      drift since the last shutter event (§11.2). `scripts/validate_sky_flat.py` renders
      `sky_only.yaml` through the Boson 640, takes the shutter, lets the housing cool 1.5 K, and fits
      a plane plus a paraboloid to every frame. **The rendered drift bowl and a public clear-sky frame
      have the same sign and nearly the same radial profile**: the paraboloid explains 99.9 % of the
      rendered drift and 86 % of the real frame.
    media:
      - image: validation/sky_flat/profiles.png
        width: half
        caption: >-
          Plane-removed radial profiles, normalised. Orange: the rendered camera drift alone. Green:
          the real frame. Blue: the rendered frame with the sky, whose own curvature points the
          other way at 45° elevation.
    note: |
      The real frame is measured, not published: the figure carries its profile, not its pixels.
      Near the zenith the sky is itself a dark-centred bowl (the zenith is its coldest point), so a
      bright centre there needs the housing to have cooled by about 1.7 K or more since the shutter
      closed, or a black-hot display.
    source: scripts/validate_sky_flat.py
