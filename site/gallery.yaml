    source: scripts/render_maritime_demo.py

  - id: four-bands-sky-target
    title: A point target against sky, four bands
    lead: |
      The aerial point-target lane: a small target against a clear sky at dawn, where the sky's
      radiance-versus-elevation gradient is the whole background. These four are pre-AGC, mapped
      from radiance directly.
    media:
      - image: multiband/sky_target/sky_target_contact_sheet.png
        width: full
        caption: visible companion, then LWIR, MWIR, SWIR, NIR at one instant
      - video: multiband/sky_target/lwir/aerial_demo_ir.mp4
        width: half
        label: LWIR
      - video: multiband/sky_target/mwir/aerial_demo_ir.mp4
        width: half
        label: MWIR
      - video: multiband/sky_target/swir/aerial_demo_ir.mp4
        max_width: 720   # grain, not detail: this one stays small
        crf: 34
        width: half
        label: SWIR
      - video: multiband/sky_target/nir/aerial_demo_ir.mp4
        max_width: 720   # grain, not detail: this one stays small
        crf: 34
