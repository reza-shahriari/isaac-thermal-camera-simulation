  - id: calibration-roundtrip
    title: IG.23 — your lens, in the rendered frame
    lead: |
      A camera file can carry the unit's own OpenCV calibration. Here a Boson 640 on a wide lens,
      with a strong barrel pasted into its file, films a heated calibration checkerboard: the rows
      of corners bow 9.2 px in the infrared and 9.3 px in the visible frame, and undistorting with
      the **same** numbers — nothing fitted — straightens them to 0.13 and 0.11 px. The two bands'
      corners agree to 0.09 px, so the visible companion goes through the same lens.
    media:
      - image: calibration_checkerboard_lwir/calibration_roundtrip.png
        width: full
        caption: "top: LWIR as rendered | undistorted · bottom: visible, the same · red: each corner row's chord"
      - video: calibration_checkerboard_lwir/calibration_checkerboard_pair.mp4
        width: full
        caption: the heated board, LWIR left and visible right, through the calibrated lens
    note: |
      The coefficients are illustrative, chosen so the barrel is plain; replace the block with
      your own unit's `cv2.calibrateCamera` output.
    source: scripts/measure_calibration_render.py

  - id: car-hot-soak
    title: IG.22 — the engine stops, the bonnet keeps warming
    lead: |
      The overcast-night car with TC.6's solved engine: key on at 30 s, off at 20 minutes, one frame
      a minute on a fixed 10–40 °C span. While the engine runs the bonnet warms over the bay; after
      key-off the fan and the coolant flow stop, the block's heat soaks upward, and the bonnet's
      hottest cell goes on climbing from 33.7 °C to 41.6 °C by minute 27 while the engine itself
      cools from 92 °C to 86 °C — the hot soak a thermal camera sees on a parked car.
    media:
      - video: car_ignition_hot_soak/car_ignition_spanned.mp4
        width: full
        caption: T+0 to T+29 min, key-off at T+20 — LWIR, one frame per 60 s, fixed span
    source: scripts/render_car_ignition.py

  - id: car-ignition
    title: A car that starts its engine
    lead: |
      The owner's second requirement: an engine must warm *the metal around it*, not only itself
      (ADR 0087/0088/0089). The bonnet here is **one USD prim**, 23 × 19 cells — flat to under a
      millikelvin in frame 0 and **5.82 K across** at the end of this 29.5-minute run, which is
      116 NETD of structure that a per-prim bridge has a single number to represent. Behind it the
      engine bay has risen 26.4 K and the exhaust pipe 47.7 K over air.

      Two scenes run the same §6.6 heat-source node on the same load profile and differ only in the
      sky, which is how the occlusion term is separated from a scale factor: the road patch opens
      nearly three times wider under a clear sky than under overcast, while the bonnet moves the
      *other* way, because the skin radiates to that sky too.
    media:
      - video: car_ignition/car_ignition_agc.mp4
        width: full
        caption: >-
          the camera's own AGC — what the sensor would deliver, time-lapsed at one frame per 30 s
      - video: car_ignition/car_ignition_span_car.mp4
        width: half
        caption: the bonnet's own span, so the structure across one prim is visible
      - video: car_ignition/car_ignition_span_road.mp4
        width: half
        caption: >-
          a 1.6 K window on ambient — the road field holds 0.89 K, of which 0.15 K reaches the
          sensor, because the warmest asphalt is under the car and a 45° view cannot see it
    note: |
      The wheels do **not** warm, and the readout says so: §6.6 makes tyre heating flexing work and
      brake heating kinetic energy, and a car idling in a car park is doing neither. A test pins
      +0.000 K so a later change cannot quietly "fix" it.
    source: scripts/render_car_ignition.py

  - id: vessel-departure
    title: A vessel departure, filmed in LWIR
    lead: |
      A coaster leaving from 250 m while its funnel warms from cold alongside toward cruise power,
      played as a time lapse. The film shows what a static frame cannot: **the target's signature
      getting stronger while the target gets smaller.** Over the clip below the funnel runs
      **32 → 92 °C** while the range goes 250 → 994 m and the hull falls from 99,077 to 3,792
      pixels — a factor of 26 in area. That is the regime an infrared search set actually works in.

      The camera does not track, so the vessel climbs through the frame as its depression angle
      shrinks from 4.6° to 1.2°, crossing the sea's own angular gradient: it starts against near
      water at about the sea surface temperature and ends against far water that is mostly warm air.
    media:
      - frames: vessel_departure/frames/agc_%05d.png
        fps: 8
        width: full
        caption: >-
          the run's 32 AGC frames at 8 fps; the gauge reads funnel, deck and hull against the
          display span
    note: |
      The funnel had to be repainted. It was `bare_aluminium`, ε = 0.09 in LWIR, so it reflected the
      cold sky far more than it radiated and the renderer drew a **155 °C funnel as a dark
      rectangle**. Real funnels are painted steel, ε ≈ 0.9. A test now pins the two emissivities,
      because the mistake is invisible in the geometry and shows up only in the picture.
    source: scripts/render_vessel_departure.py

  - id: imported-asset
    title: An imported asset, flown
    lead: |
      A 62 MB third-party DJI Phantom 4 Pro FBX that nobody here modelled: 41 prims, 2,486,459
      triangles, **41 of 41 materials resolved in Kit** through `configs/assets/phantom4.yaml`. It
      flies a figure-of-eight from 4.6 m to 10.3 m range — 70 to 157 px across the span — and the
      display spans **−12.0 to 26.4 °C**.

      Solved point-wise it is the first scene in the project whose geometry was not authored in
      Python: 234,923 cells over 0.1628 m², and the physics the lane exists for — black mouldings
      reach **65.9 °C** where the white shell tops out at **33.8 °C** (α 0.94 against 0.25), every
      surface carrying a *span* rather than one value per object.

      Those cells reached no pixel until `AI.2` closed: this clip renders one temperature per
      prim. The outbound clip below is the one where the solve reaches the picture.
    media:
      - video: phantom4/phantom4_pair.mp4
        crf: 20      # the front page opens with this one
        width: full
        caption: LWIR beside its visible companion, the same instants
      - video: phantom4_weather/phantom4_pair.mp4
        width: half
        caption: >-
          the same aircraft under one weather-fx weather (14.2 °C air, 38 % cumulus with its base
          at 600 m): the infrared cloud reads about 9 °C against a −30 to −42 °C clear sky, the
          airframe 14 to 15 °C, on a −23.8 to 16.6 °C span — re-rendered after ADR 0146, which
          found the earlier clip's 17 °C cloud was lit by one weather and warmed by another
      - video: phantom4_smoke/phantom4_pair.mp4
        width: half
        caption: and through smoke
    source: scripts/render_phantom4.py

  - id: imported-asset-outbound
    title: Near to far, with the solve reaching the pixels
    lead: |
      The same imported Phantom 4 — now **split into functional parts** rather than into the
      material groups the FBX ships with — departing from **4 m to 80 m** at a held 16° of
      elevation: **183 px across down to 9**. Range is spaced geometrically, so the aircraft sheds
      the same fraction of its width every frame instead of collapsing in the first few and then
      crawling; the elevation is held so the sky behind it is the same at both ends and the
      contrast that survives is a statement about range.

      This is the clip where `AI.2` closed. `IrCamera` now takes `mesh_fields=`, so `WM.3`'s
      `MeshPointBridge` asks each bound prim's own triangles for the closest point to every pixel
      — **4,756 pixels took a cell** of a 23,477-cell solve across the nine prims this scene
      binds, and each of the four propellers carries a gradient *across itself*: **1.33 K, 1.46 K,
      2.19 K and 2.28 K**, against this camera's 50 mK NETD. The readout carries **four** thermal
      nodes, not the three the material grouping could express: airframe, motor, ESC and battery.

      The honest limit is which prims those are. The scene binds the battery, the four motor
      mounts and the four propellers; the shells and arms that make up most of the silhouette are
      unbound and still render at their node's single temperature. Binding them is a scene edit
      and a cell budget, not a code change.
    media:
      - video: phantom4_outbound/phantom4_parts_pair.mp4
        width: full
        caption: LWIR beside its visible companion, 4 m to 80 m, stretched to the aircraft
      - video: phantom4_outbound/phantom4_parts_skypair.mp4
        width: full
        caption: >-
          the same frames stretched to the sky instead: the cumulus both bands march from one
          cloud field, with the aircraft saturating
      - image: phantom4_outbound/near_structure_whitehot.png
        width: half
        caption: >-
          the first frame cropped to the aircraft and scaled to its own 18.1–23.2 °C, where the
          propellers read as four gradients rather than as four values
      - image: phantom4_outbound/frames/ir_00119.png
        width: half
        caption: 80 m — nine pixels across, on the sky it started against
    note: |
      Two stretches, one radiometry. A grayscale ramp fitted to the aircraft's 16.6–34.7 °C clips
      the sky to black, which makes the infrared frame look empty beside a visible companion full
      of cloud; in the same float32 planes the clear sky is 245.9 K and the cloud in front of it
      286.1 K, so weather-fx's 30 % cumulus is **40 K** of LWIR structure. Neither clip is more
      true than the other — the plane both are quantised from is.

      The aircraft's own temperature moves during the run, because the 28-minute mission plays
      while it flies and the readout carries it. What is held constant is the background.
    source: scripts/render_phantom4.py

  - id: imported-asset-perpart
    title: Every part its own temperature
    lead: |
      The same part-split Phantom 4, flown close — **2 to 6 m**, a motor can tens of pixels
      across — with **fifteen thermal nodes and nine mesh-solved surfaces** where the clip above
      had four nodes. The four motors and the four ESCs sit on four *different* throttle
      histories, written the way a flight writes them: the rear pair carries more thrust in
      nose-down cruise, the outer pair in each banked orbit, the upwind pair hovering in a wind
      from the front-left. Solved on the scene's own nodes, the rear pair runs **6.9 K** over the
      front in cruise and the outer pair **5.9–6.1 K** over the inner in each orbit; landed and
      idle, all four fall back to within **0.1 K** of each other. The differences were the
      mission, not four models — and a viewer can watch them open and close in the legend while
      the picture does the same.

      The scene decides the granularity, not the driver: `target_for_part` takes a part's own
      name if the scene defines a node by it, so `phantom4_parts.yaml` and this scene fly the
      same asset through the same code with four and fifteen nodes respectively. The six
      airframe-family parts — shells, arms, legs, gimbal, lens — are lumped nodes with ESTIMATED
      offsets on purpose (ADR 0143): they carry 150–220 k faces each and the solver puts a cell
      on every face, so a mesh solve of the shell waits on a decimated thermal archive.
    media:
      - video: phantom4_perpart/phantom4_parts_agcpair.mp4
        width: full
        caption: >-
          LWIR as the camera itself displays it: its own 8-bit output, frame by frame, through the
          Boson's factory information-based AGC (§11.3), beside the visible companion. The cumulus
          and the aircraft share the frame, and the hot parts span 19–32 of 256 grey codes, where
          the old clip's rebuilt plateau gave them 3
      - video: phantom4_perpart/phantom4_parts_pair.mp4
        width: half
        caption: >-
          the same frames stretched to the aircraft, up to its hottest pixel, so the four motors
          read apart instead of clipping to one white
      - video: phantom4_perpart/phantom4_parts_skypair.mp4
        width: half
        caption: and stretched to the sky, where the aircraft saturates against the cloud field
    note: |
      Measured over the shipped 144-frame clip. Range holds **2.6–4.9 m**, the aircraft **148–282
      px** across, peaking at **9,497 pixels** of a 640x512 frame near closest approach. The four
      motors run **15.2 -> 37.8 °C**, the four ESCs **14.8 -> 30.0 °C**, and no two stations peak
      at the same value or the same instant — the rear-left motor leads at 37.7 °C in the first
      orbit, the rear-right at 37.8 °C in the second, exactly the outer-pair asymmetry the
      throttle histories were written to produce. The battery, on the mean of the four, spans
      **14.5–21.0 °C**. The six airframe-family offsets stay within **1–4 °C of air** the whole
      flight, as a fixed offset must, and that flatness *is* the visible boundary of this scene's
      fidelity: the white shell that is 55 % of the aircraft's area carries one value, not a
      field, until a decimated thermal archive lets it take a mesh solve of its own.

      The nine mesh-bound surfaces still carry the per-cell physics `AI.2` wired to the camera:
      the widest gradient across one propeller reached **10.7 K** on 212 interior pixels this run
      (`propeller_rear_left`, frame 54) — two hundred NETDs of structure inside a single blade,
      on a part whose *node* value is a flat line above. Three fixed stretches came out of one
      float32 plane: the aircraft's own **−21.0 .. 28.4 °C**, the sky's **−45.7 .. 14.6 °C**
      (cloud 40+ K above clear), and the AGC clip's single §11.3 plateau LUT built over all 144
      frames and left unchanged between them, occupied range **−47.2 .. 34.0 °C** — the one where
      the cumulus and the four separating motors are both legible in the same frame.
    source: scripts/render_phantom4.py

  - id: aircraft-pass
    title: A low pass, where aspect is the variable
    lead: |
      A light business jet passing a ground sensor at 150 m/s, 300 frames of real time at 30 fps,
      closing to 250 m. The variable is **aspect**, not throttle: the exhaust nozzles are hidden
      behind their own nacelles from the front and fully exposed from the rear, which is why a real
      aircraft's measured infrared signature varies by a large factor around the clock. Measured off
      the instance-id plane at the same range either side of closest approach, this run shows
      **190 px of nozzle tail-on against 78 head-on**. The display spans 1.1 to 190.9 °C, which is
      the nozzle setting the top of it.

      A jet's hot part is a fortieth of its span across, so unlike the quadrotor's motors you never
      resolve it: it is a near-point source, bright because it is hundreds of kelvin hot rather than
      because it is large.
    media:
      - video: aircraft_pass/aircraft_pass_agc.mp4
        width: half
        caption: the camera's AGC
      - video: aircraft_pass/aircraft_pass_ir.mp4
        width: half
        caption: pre-AGC, mapped from radiance
    source: scripts/render_aircraft_pass.py

  - id: focus
    title: Focus, and what a defocused edge does
    lead: |
      A two-cube scene at Boson 640 optics, filmed through a focus sweep. Each depth layer is
      blurred with the kernel its own range earns and composited back to front using its **blurred
      coverage as alpha**, so a defocused edge is semi-transparent rather than a hard cut. The blur
      is applied in radiance, never in Kelvin (non-negotiable #3) — a test pins the half-covered
      edge to the radiance-blended temperature rather than the Kelvin mean, 6.7 K apart on a
      250/315 K edge.
    media:
      - video: focus_demo/focus_sweep.mp4
        width: half
        caption: 72 frames of focus sweep, engine-free
      - video: focus_sky_demo/focus_pull.mp4
        width: half
        caption: >-
          a focus pull against sky — a clear sky barely changes, because the high spatial
          frequencies in a real sky are cloud edges
      - image: focus_demo/focus_near.png
        width: third
        caption: focused near
      - image: focus_demo/focus_far.png
        width: third
        caption: focused far
      - image: focus_demo/focus_hyperfocal.png
        width: third
        caption: hyperfocal
    source:
      - scripts/focus_demo.py
      - scripts/focus_sky_demo.py

  - id: pointwise
    title: "Point-wise physics: every cell its own temperature"
    lead: |
      These are engine-free frames — a synthetic G-buffer over each patch's own plane, passed
      through the same point bridge the Isaac path uses, so the pixels are exactly what a render
      would carry before the radiometry.

      **PT.9 — the aerial scenario, regenerated point-wise.** The quadrotor in plan at four phases
      of the mission. The deck is one prim carrying its own field; each arm spans 29 K across the
      deck's and the motor pods' shadows. The scene this replaces held the whole airframe at one
      number.
    media:
      - image: pointwise/quad_aerial/plan_t0000_whitehot.png
        width: third
        caption: on the pad — deck 55.5 °C, belly 26.2 °C, arms span 29 K
      - image: pointwise/quad_aerial/plan_t0400_whitehot.png
        width: third
        caption: climbing at 9.2 m/s — deck 44.4 °C
      - image: pointwise/quad_aerial/plan_t1000_whitehot.png
        width: third
        caption: hard climb at 13.3 m/s — deck 40.3 °C, the excess collapsed to 13.8 K
      - image: pointwise/quad_aerial/plan_t1750_whitehot.png
        width: third
        caption: landed — deck 56.3 °C, the excess back at 29.6 K
    source: scripts/quad_flight_pointwise.py

  - id: still-water
    title: PH.3 — still water as a region of a patch
    lead: |
      One road prim, one patch, one solve. 20 mm of standing water over the western half, a wall's
      shadow across the southern rows. The puddle opens 3.8 K below the road and is 11.0 K below an
      hour later, having lost 0.85 of its 20 kg m⁻² . In the shade the same water is only 2.4 K
      below — evaporation is driven by each cell's own temperature, which a constant
      wet-is-colder offset cannot reproduce.
    media:
      - image: pointwise/puddle/road_t0000min_whitehot.png
        width: half
        caption: 14:00 — wet 52.5 °C, dry 56.3 °C, shadow along the bottom
      - image: pointwise/puddle/road_t0060min_whitehot.png
        width: half
        caption: 15:00 — wet 44.8 °C, dry 55.8 °C

  - id: patch-scenes
    title: IG.20 — the wall half in sun and the wet road, rendered
    lead: |
      Two phase-P scenes that had only ever been solved on a synthetic G-buffer, now on an Isaac
      stage: every patched surface is a quad drawn from its own solved field, cell by cell. A
      building's west wall from 18:00 to 20:00, half concrete and half insulated render, with a
      neighbour's shadow across it — the lit concrete stands 6.9 K over the shaded, and the roof
      cools from 10.2 K over the north wall to 3.6 K as the sun sets. An asphalt road at 14:00
      with its west half watered — 47.9 °C wet against 55.5 °C dry twenty minutes in, with the
      shading wall's cold strip along the south edge.
    media:
      - video: wall_half_in_sun_lwir/wall_half_in_sun_pair.mp4
        width: full
        caption: 18:00–20:00, one frame per 150 s — LWIR left on a fixed span, visible right
      - video: wet_road_noon_lwir/wet_road_noon_pair.mp4
        width: full
        caption: 14:00–16:00, the west half wet from 14:00 — LWIR left, visible right
    note: |
      The wet cells keep dry asphalt's emissivity (≈0.93 against water's ≈0.96), since a surface
      has one infrared material; that is of order 1 K on the wet half.
    source: scripts/render_patch_scene.py

  - id: exhaust-plume
    title: IG.21 — one exhaust plume, two bands
    lead: |
      A tailpipe over the first four minutes of a drive, filmed through a mid-wave (InSb, 3–5 µm)
      and a long-wave (microbolometer, 8–14 µm) camera on **one** 15–125 °C scale. The plume is
      hot CO₂ and water vapour, which emit strongly in the mid-wave bands and weakly in the
      long-wave window: near the pipe it stands 80.5 K over the background in MWIR and 10.8 K in
      LWIR, and half-way along 25.0 K against 1.8 K. The metal pipe itself is bright in both.
    media:
      - video: car_exhaust_plume_mwir/car_exhaust_plume_pair.mp4
        width: full
        caption: MWIR, 11° lens, camera 3x further out — plume bright
      - video: car_exhaust_plume_lwir/car_exhaust_plume_pair.mp4
        width: full
        caption: LWIR, 31° lens — the same plume, faint
    source: scripts/render_patch_scene.py

  - id: exhaust-line
    title: TC.7 — the exhaust line as a gas stream in a wall
    lead: |
      The line under a car, manifold at the left and tailpipe at the right, three instants on one
      common scale. Running: 425 °C at the downpipe falling to 128 °C through the silencer, with the
      hangers showing as cold bands where they conduct into the body. The shielded manifold reads
      cooler than the bare pipe behind it, which is what a camera under a car actually sees.
    media:
      - image: pointwise/exhaust_line/under_car_whitehot.png
        width: full
        caption: "top: 20 min at 60 % load · middle: +65 s after key-off · bottom: +10 min"

  - id: sky-view-factor
    title: PT.21 — per-cell sky view factor
    lead: |
      How much sky each cell can see, black 0.0 to white 1.0, on the street-canyon scene. The roof
      sees the open hemisphere; a wall sees half of it; the ground between the buildings runs from
      0.99 in the open to 0.00 in the alley. This scales the diffuse solar and the longwave down
      together, which is why a shaded cell is not merely un-sunlit.
    media:
      - image: pointwise/sky_view/ground_svf.png
        width: third
        caption: the ground — SVF 0.000..0.990, mean 0.731
      - image: pointwise/sky_view/west_concrete_svf.png
        width: third
        caption: the west wall — 0.087 at the foot to 0.500 at the top
      - image: pointwise/sky_view/roof_svf.png
        width: third
        caption: the roof — 1.000 everywhere

  - id: cabin
    title: PT.15 — the cabin, solved with its panels
    lead: |
      A saloon in plan at 10:00. The cabin is a lumped member of the same solve as its five panels:
      it reaches 68.7 °C against 26.2 °C of air, and the roof runs 1.6 K over the adiabatic bonnet
      because it is the one panel the cabin is heating from behind.
    media:
      - image: pointwise/parked_car_cabin/plan_t0_whitehot.png
        width: half
        caption: 10:00 — cabin 68.7 °C, roof 65.0 °C, doors 31–32 °C
    source: scripts/parked_car_cabin.py

  - id: occlusion
    title: PT.20 / PT.22 — occlusion from geometry
    lead: |
      One building's west wall with a neighbour's shadow across it: the lit concrete stands 9.7 K
      over the shaded concrete, and half an hour after the shadow lifts the once-shaded half is
      still 8.1 K behind. The step is thermal history, not a shading mask applied to the image.
    media:
      - image: pointwise/wall_half_in_sun/west_wall_t0_whitehot.png
        width: half
        caption: the west wall at the scene start (298.6..313.0 K)
    source: scripts/wall_half_in_sun.py

  - id: flat-field
    title: Flat-field correction, and what it leaves behind
    lead: |
      The same scene recaptured with and without a flat field applied. Fixed-pattern structure is
      what a viewer reads as "thermal camera" long before radiometric accuracy is noticeable, which
      is why the noise chain (ADR 0053–0057) is modelled rather than approximated with Gaussian
      noise.
    media:
      - image: recapture/clear_no_flatfield.png
        width: third
        caption: clear sky, no flat field
      - image: recapture/clear_flatfield.png
        width: third
        caption: clear sky, flat-fielded
      - image: recapture/cloudy_flatfield.png
        width: third
        caption: cloudy, flat-fielded

  - id: cloud-in-the-path-tracer
    title: The cloud deck, rendered by the path tracer
    lead: |
      The first cloud this project has had *inside* the renderer rather than painted on a dome at
      infinity: `irsim.atmosphere.cloud_deck`'s field, written as OpenVDB by the library that
      ships inside Isaac Sim, and integrated by RTX path tracing with its own multiple scattering.
      Lit tops, flat bases, self-shadowing, and the cloud's shadow on the red backdrop behind it.
      ADR 0140 had recorded that nothing volumetric renders on this build; ADR 0144 records why
      that was wrong (a probe control that contained the thing under test, and material inputs
      the MDL does not declare) and the recipe that renders: a mesh box at the grid's world
      bounds with no transform, `primvars:isVolume`, and the `.vdb` handed to `OmniVolumeDensity`
      as its density texture. Measured in linear HDR against the control frame: the 99.9th
      percentile rises from 0.92 to 2.12, and the depth buffer does not move at all — a volume
      writes no depth, which is why occlusion in the infrared stays with this project's own march.
    media:
      - image: cloud_volume_probe/cloud_path_traced.png
        width: half
        caption: >-
          With the volume: 640×480, 64 samples per pixel, 32 bounces, one fixed tone curve anchored
          on the control frame.
      - image: cloud_volume_probe/control.png
        width: half
        caption: The control frame — the same backdrop and sun with nothing under test.
    note: |
      A probe frame, not a scene: the backdrop is a red plane and the haze with light shafts under
      the cloud is the probe's global volumetric fog setting, left on so that a shadow through it
      would show. The path-traced base is visibly noisy at this sample count; the dome bake remains
      the real-time path and the volume is the path-tracing one.
    source: scripts/probe_cloud_volume.py

  - id: cloud-occlusion
    title: A drone behind a cloud, in the infrared
    lead: |
      Until `AT.14` the infrared band marched the weather-fx cloud only where a ray hit nothing,
      so a target behind or inside a cloud was drawn through clear air. Here the shared field is
      marched to every pixel's own hit (ADR 0162): a Phantom 4 flying at 30–110 m through a thin
      stratus fractus layer (base 15 m, 80 m thick, 60 % cover, the preset in
      `configs/weather_fx/stratus_fractus_over_the_camera.json`), filmed from the ground at 53 to
      121 m. Its parts are solved at 14 to 18 °C on the first frame and the motors reach 36 to
      38 °C by the eighth, yet the airframe *reads* 4 °C at 59 m and −0.5 °C at 97 m — the cloud's
      transmittance to the hit, with the layer's own emission (it sits at the 14 °C air, cooling
      with height) laid in front. The thin cloud over the rest of the frame reads −12 to −2 °C
      against what would be a −40 °C clear sky.
    media:
      - video: phantom4_cloud_occlusion/phantom4_parts_pair.mp4
        width: full
        caption: >-
          LWIR on the left, the visible companion on the right, 24 frames at 12 fps on a −11.4 to
          12.7 °C span. The target is 6 to 14 pixels across: the physics is in the numbers above
          more than in the picture.
      - video: phantom4_cloud_occlusion/phantom4_parts_skypair.mp4
        width: half
        caption: The same frames on the sky's own span, −13.9 to 0.2 °C, where the layer's structure shows.
      - video: phantom4_cloud_occlusion/phantom4_parts_agcpair.mp4
        width: half
        caption: And through the camera's own AGC.
    note: |
      Two things this clip does not yet show. The visible companion is a dome bake — the pinned
      weather-fx commit predates its path-traced volumes — so it does *not* occlude the drone the
      infrared band now occludes; `AT.30` bumps the submodule and aligns the two. And a large,
      resolved target behind a cumulus at its natural 600 m base would need an aircraft-sized
      asset the library does not hold yet, which is why the layer was brought down to the drone.
    source: scripts/render_phantom4.py

  - id: aerial-reference-clip
    title: Ten seconds at standoff, at the camera's own rate
    lead: |
      Every other aerial clip here is a time-lapse at a few metres. The public drone datasets are
      not: they film at tens to hundreds of metres, frame after frame. `EV.14` renders that —
      **600 frames at 60 Hz**, a heavy-lift quadrotor flying out from **50 m to 250 m** (26.7 px
      across down to 5.4) against fair-weather cumulus, with the bolometer's smear and the camera's
      damped AGC running at their real rate. A second drone holds station **1.25–1.45 km** out,
      filling 4–6 % of a pixel, and goes through the analytic sub-pixel path on every frame.
    media:
      - video: aerial_reference_clip/aerial_reference_agc.mp4
        width: full
        caption: >-
          LWIR through the camera's own information-based AGC, damped at FLIR's factory 0.85 per
          frame: the display's mean moves a median 0.01 codes a frame
      - video: aerial_reference_clip/aerial_reference_rgb.mp4
        width: half
        caption: The visible companion, the same instants and the same clouds
      - video: aerial_reference_clip/aerial_reference_sky.mp4
        width: half
        caption: The same frames on a fixed span over the sky, −25.7 to 56.0 °C
    note: |
      The distant drone is there in the numbers more than in the picture: against a cloud edge it
      reads 0.26–0.56 K above its surroundings, about five times the 80 mK noise, which the AGC
      does not lift out of the cloud's gradient. The three fixed black dots are the camera's dead
      pixels.
    source: scripts/render_quad_outbound.py

  - id: aerial-clear-exit
    title: A drone flies out into a cloudless sky, and out of the frame
    lead: |
      `EV.16`: the heavy-lift quadrotor at cruise flies from **12 m to 150 m** in 15 s of
      continuous 60 Hz video (111 px across down to 8.9), then crosses the left edge of the field
      at 15 m/s and leaves, then a second of empty sky. The sky has **no cloud at all**: what you
      see behind the drone is the air's own long-wave emission at each pixel's elevation,
      −22 °C at the top of the frame to +5 °C at the bottom. The thermal state is the mission at
      cruise: the four motor bells are the hottest parts at **46–48 °C**, above the 40 °C sunlit
      deck, 34–35 °C arms (all four within 0.4 K, each warmest where its motor is bolted
      on: ADR 0187) and 30.5 °C belly, under 26.5 °C air. Every frame records where the
      drone should be beside where the renderer drew it: a median of **0.04 px** apart, and
      nothing drawn from the first frame after it has left.
    media:
      - video: aerial_clear_exit/aerial_clear_exit_sky.mp4
        width: full
        caption: >-
          Fixed span −25.6 to 48.0 °C, white-hot. The drone leaves at 2 px a frame; the
          bolometer's 8 ms membrane leaves a short fading tail behind it, not a streak
      - video: aerial_clear_exit/aerial_clear_exit_agc.mp4
        width: half
        caption: >-
          The camera's own AGC. Once the drone has gone it stretches the empty sky, which is the
          frame a detector has to stay quiet on
      - video: aerial_clear_exit/aerial_clear_exit_rgb.mp4
        width: half
        caption: The visible companion, the same instants
      - video: aerial_clear_exit_near/aerial_clear_exit_sky.mp4
        width: full
        caption: >-
          The same exit at close range: 12 m to 30 m, then out sideways at 5 m/s (3.4 px a frame)
          while the drone is 44 px across, so the frame edge visibly cuts it on the way out.
          Drawn within 0.15 px of prediction (median)
    note: |
      The exit is a camera pan, not the drone moving, as for every clip on this stage (ADR 0123),
      so the sun's bearing in the frame turns by the pan's 16.7°. The motor bells take no
      sunlight: their temperature is ADR 0072's throttle law alone. The three fixed points at
      the LUT floor are the camera's dead pixels.
    source: scripts/render_quad_outbound.py

  - id: phantom4-clear-exit
    title: A Phantom 4 flies out into a cloudless sky, and out of a field that stays still
    lead: |
      `EV.20`: the imported DJI Phantom 4 Pro, solved whole as one thermal network (`TC.13`), climbs
      away from **5 m to 60 m** in 15 s of continuous 60 Hz video (146 px across down to 11). Then
      the mount stops, and the drone **strafes left out of the field at 10 m/s**, followed by a
      second of empty sky. Unlike the quad's clip, the camera does not pan: the aircraft really
      flies and the sky behind it never moves (ADR 0189). The clip starts 210 s into the forward
      cruise. The rear motors read **56.9 °C** and the front motors 48.6 °C, over mounts at
      41–45 °C. The arms run from about 31 °C mid-span to **37.8 °C on average, and up to 43.9 °C,
      beside the motor mounts**, because each motor heats its arm through its mount. The battery
      reads 32.3 °C under 26 °C air. Every frame records where the drone should be beside where it
      was drawn: within 0.2 px horizontally, last drawn on frame 999, which is the frame before the
      prediction says the whole aircraft has gone, and nothing drawn after it.
    media:
      - video: phantom4_clear_exit/phantom4_parts_sky.mp4
        width: full
        caption: >-
          Stretched to the sky, −20.1 to 16.4 °C, white-hot. The drone saturates; the point is
          the sky it leaves behind, which never moves
      - video: phantom4_clear_exit/phantom4_parts_ir.mp4
        width: full
        caption: >-
          Stretched to the drone, −5.2 to 51.9 °C: four motor bells over their mounts and arms,
          the rear pair 8 K above the front in cruise
      - video: phantom4_clear_exit/phantom4_parts_agc.mp4
        width: half
        caption: The camera's own AGC, frame by frame
      - video: phantom4_clear_exit/phantom4_parts_rgb.mp4
        width: half
        caption: The visible companion, the same instants
    note: |
      The strafe has no bank. A real multirotor rolls a few degrees to accelerate sideways.
      The thermal tick is 30 s, so the 18 s clip shows the aircraft's state at cruise, not its
      evolution. The drawn centroid sits up to about 6 px above the predicted box centre at
      5 m, because the landing gear pulls the box down; that offset shrinks with range.
    source: scripts/render_phantom4.py

  - id: cloud-tiers
    title: One switch for the cloud, in both bands
    lead: |
      A Phantom 4 flying at 30–110 m inside a 60 % stratus layer, rendered twice with only
      `--cloud-tier` changed. **Path-traced**: weather-fx's 3-D cloud volumes in the visible frame,
      the infrared marched to the drone — the drone is lost in lit cloud in the colour frame and
      its infrared transmittance is 0.33–0.65. **Real-time**: the cloud painted on the sky dome, no
      march to the hit — the drone shows dark in front of a grey overcast in both bands. The cloud
      is in both pictures either way, and the infrared sky is identical between the two runs.
    media:
      - video: phantom4_cloud_tiers/path_traced/phantom4_pair.mp4
        width: full
        caption: Path-traced tier — LWIR left, visible right; the drone is inside the cloud in both
      - video: phantom4_cloud_tiers/real_time/phantom4_pair.mp4
        width: full
        caption: Real-time tier — the same frames with the cloud on the dome; the drone is in front of it
    note: |
      The path-traced tier costs one extra render per frame (33 s against 23 s here), because the
      volume boxes must be kept out of the infrared G-buffer: to it they are just boxes.
    source: scripts/render_phantom4.py

  - id: cloud-light
    title: The visible cloud, lit by physics
    lead: |
      The visible companion is the frame an infrared one is read against, so its cloud is held to
      physics-model §7.5's criteria. Before `WX.3`, weather-fx lit a cloud only by the sun, through
      one envelope that made every base as bright as a sunlit top: under a uniform sky with the sun
      off, a white cloud rendered black. Now each step of the dome's march in-scatters three lights,
      energy-conserving (ADR 0180): the sky and the ground, the sun scattered once, and the
      two-stream field along the sunlight's chord through the point. A white cloud under a uniform
      sky vanishes to 1e-4; thin edges are at least 1.01 of the sky behind them; thick bases are
      0.82–0.89 of a sunlit flank; a deck seen from above has 1.005 of its two-stream albedo.
    media:
      - video: cloud_look/cloud_look_before_after.mp4
        width: full
        caption: >-
          One day over Munich on 21 June, 35 % cumulus, a camera looking west at 12° elevation:
          48 frames from 09:00 UTC (sun 53.6°) to 19:12 (sun 0.4°). Left, weather-fx before the
          change; right, after. The noise and stripes near the horizon are the next step's (`WX.4`,
          detail filtered to the pixel), not this one's.
    note: |
      Rendered by `scripts/cloud_look.py` on the CPU from weather-fx's own sky, exposed by
      its own meter, through a stand-in tone curve that is not the RTX tonemapper — compare the two
      halves with each other, not with an Isaac Sim viewport. Not modelled: light a finite cloud
      loses through its sides, so the base of a small cumulus is as bright as two-stream says a
      layer of its depth is.
    source: scripts/cloud_look.py

  - id: cloud-static
    title: A pixel integrates the cloud; it does not sample it
    lead: |
      Broken cumulus near the horizon used to shimmer: each pixel was one ray, so it read cloud or
      sky by the luck of where that ray landed, and a cloud edge crossing the pixel became noise.
      A detector pixel averages the radiance over its footprint, and near the horizon that
      footprint spans kilometres of the cloud layer. Since `WX.4` the pixels an edge crosses are
      marched again through several rays and averaged (ADR 0181) — in the infrared at a Boson's
      pitch the static energy falls to 0.1 % of what it was at 5° elevation and 0.5 % at 30°, for
      1.09× and 1.87× the rays. Blurring the cloud's density to the pixel was tried first and made
      it worse: opacity is not linear in density.
    media:
      - video: cloud_look_static/cloud_static_before_after.mp4
        width: full
        caption: >-
          The same band of sky from the horizon to 12°, 35 % cumulus drifting at 10 m/s, 36 frames
          over three minutes. Left, one ray per pixel; right, each pixel integrated over a 4 × 4
          grid with only its cloud edges marched again — the infrared camera's own rule.
    source: scripts/cloud_look.py

  - id: cloud-air
    title: A distant cloud is seen through the air
    lead: |
      A cloud 30 km away is behind 30 km of air. The air dims the cloud and adds its own light,
      so far cumulus fades toward the horizon's colour while a cloud overhead stays crisp. The
      dome used to compose every cloud as if it were at the eye. Since `WX.5` it composes each
      cloud through the sky's own scattering integral, kept at 16 distances out to 64 km
      (ADR 0182). The air in a cloud's shadow is dark, so a cloud near the sun is not veiled by
      sunlit haze that is not there. At 64 km the air light is the sky itself, within 1.5 %.
    media:
      - video: cloud_look_air/cloud_air_before_after.mp4
        width: full
        caption: >-
          One ground camera looking west, 12° up with a 70° field of view, over 35 % cumulus. 48
          frames from 09:00 to 19:12 UTC on 21 June at Munich, while the sun falls from 53.6° to
          0.4°. Left: weather-fx `5853dcc`, the cloud composed at the eye. Right: `582bf47`, the
          cloud seen through the air in front of it.
    source: scripts/cloud_look.py

  - id: cloud-pixel-isaac
    title: The per-pixel cloud inside Isaac Sim
    lead: |
      Everything in this section is rendered by Isaac Sim's own renderer. With
      `clouds.render_path = "pixel"` the cloud function of `WX.23` is marched on the GPU for the
      viewport's camera every frame, composed over the clear sky through the air in front of it,
      and emitted by a quad that rides with the camera at the far end of its frustum (`WX.24`,
      ADR 0186). The renderer draws the scene in front of that quad by itself, and an emissive
      surface is the same thing to RTX Real-Time and to the path tracer, so both modes show one
      sky. At 1280 × 720 on an RTX A6000 the real-time viewport runs at 44–48 frames a second with
      the camera turning. One camera for now; the dome behind the quad stays clear, so reflections
      and ground shadows do not see the clouds yet.
    media:
      - image: cloud_pixel_isaac/headings_realtime_pathtraced.png
        width: full
        caption: >-
          One sky at 14:30 UTC, 35 % cumulus, the camera 22° up and turned north, east, south and
          west. Top row RTX Real-Time, bottom row the path tracer: the same clouds, at the same
          sharpness, in every direction.
      - image: cloud_pixel_isaac/hours_realtime_pathtraced.png
        width: full
        caption: >-
          One heading (300°) at 07:00, 11:00, 17:00 and 19:00 UTC. The clouds agree between the
          modes; with the sun in frame the exposure does not, because real-time auto-exposes and
          the path tracer does not.
      - video: cloud_pixel_isaac/isaac_pan.mp4
        caption: >-
          A full turn of the camera in RTX Real-Time, 90 frames, 1280 × 720.
      - video: cloud_pixel_isaac/isaac_day.mp4
        caption: >-
          05:30 to 20:18 UTC at one heading in RTX Real-Time, 60 frames.
    source: scripts/cloud_look.py

  - id: cloudscape-both-bands
    title: One cloudscape, seen in both bands
    lead: |
      `WX.26`, ADR 0190. The visible cloud is now a weather-fx *cloudscape*: cumulus and towers
      grown by a fluid solver and placed by a weather map (35 % cover, seed 3). The infrared march
      reads the same object through the deck it already used for the older cloud grid, so both
      cameras show one cloud and either camera hides the drone behind it. The march uses only
      where the cloud is (its density, base, top and extinction). The visible skin constants
      leave every ray's optical depth unchanged, so the next change to how the cloud *looks*
      cannot move the infrared. An imported Phantom 4 flies a lemniscate 4.7–10.2 m from the
      camera. The motors climb from 15.2 °C to 33.8 °C and the battery from 14.5 °C to 20.8 °C
      while the airframe stays at 14.2–14.6 °C, at 10:00 UTC on 21 June at Munich.
    media:
      - video: phantom4_cloudscape/cumulus_towers/phantom4_pair.mp4
        width: full
        caption: >-
          Left: LWIR apparent temperature, white-hot, −25.1 to 20.4 °C. The clear sky is the
          coldest thing in frame and the cloud bases are warmer. Right: the visible companion from
          the same camera at the same instants. 16 frames, one every 104 s.
    note: |
      This clip pre-dates the score: the agreement it claims was measured on the next entry's
      renders (ADR 0191). The march here is the CPU reference, about 20 min a frame in production.
    source: scripts/render_phantom4.py

  - id: cloud-genera-both-bands
    title: Every genus of cloud, and the two bands held to each other
    lead: |
      `WX.26` closed, ADR 0191. The visible per-pixel layer keeps the transmittance it marched
      for every pixel; the infrared camera stores it beside its own march's, and the pair is
      scored as band emissivity (`τ_B = r_B τ_vis`): the IoU of the two cloud masks and the
      95th-percentile emissivity error, every frame. Six genera from one state, one seed, one
      camera path -- cumulus, congestus, stratocumulus, stratus, storm and a new cirrus -- each
      24 frames of the Phantom 4's lemniscate, the infrared marched on the GPU. Over all six:
      IoU min 0.852, median 0.994; p95 error max 0.096, median 0.010, against a
      bar of 0.9 and 0.05: 132 of 144 frames are inside the bar; eleven of the twelve outside are cumulus and congestus frames with under 24 % cloud, where the edge fringe sets the 95th percentile (0.05–0.10), and one is a cirrus frame with 1.5 % cloud straddling the ε = 0.5 cut; the mean error stays under 0.024 on every frame. On the drone itself both bands read no cloud: none of its 30,494 pixels over the 144 frames is under 0.5 infrared transmittance, and the visible plane reads 1.0. The measurement found three things on the way: the visible layer's viewport settings
      0.14-0.26 off the function (a wisp sampled once, not resolved), the infrared marching a flat
      slab where the visible marches a shell round the planet (1.2 km apart on a cirrus at 9 km
      seen at 10 degrees), and the infrared marching cloud beyond the visible's 80 km. These
      clips draw the layer converged and both bands march one shell to one range.
    media:
      - video: phantom4_cloudscape/cumulus/phantom4_pair.mp4
        width: half
        caption: >-
          Cumulus with towers, 35 % cover. Left LWIR apparent temperature, white-hot; right the visible
          companion from the same camera. 24 frames: cloud-mask IoU min 0.852, p95
          band-emissivity error max 0.096.
      - video: phantom4_cloudscape/congestus/phantom4_pair.mp4
        width: half
        caption: >-
          Congestus, 50 % cover. Left LWIR apparent temperature, white-hot; right the visible
          companion from the same camera. 24 frames: cloud-mask IoU min 0.956, p95
          band-emissivity error max 0.076.
      - video: phantom4_cloudscape/stratocumulus/phantom4_pair.mp4
        width: half
        caption: >-
          Stratocumulus, 60 % cover. Left LWIR apparent temperature, white-hot; right the visible
          companion from the same camera. 24 frames: cloud-mask IoU min 0.991, p95
          band-emissivity error max 0.035.
      - video: phantom4_cloudscape/stratus/phantom4_pair.mp4
        width: half
        caption: >-
          Stratus, 90 % cover. Left LWIR apparent temperature, white-hot; right the visible
          companion from the same camera. 24 frames: cloud-mask IoU min 0.997, p95
          band-emissivity error max 0.008.
      - video: phantom4_cloudscape/storm/phantom4_pair.mp4
        width: half
        caption: >-
          A storm deck, 95 % cover. Left LWIR apparent temperature, white-hot; right the visible
          companion from the same camera. 24 frames: cloud-mask IoU min 0.999, p95
          band-emissivity error max 0.003.
      - video: phantom4_cloudscape/cirrus/phantom4_pair.mp4
        width: half
        caption: >-
          Cirrus at 9 km, 45 % cover. Left LWIR apparent temperature, white-hot; right the visible
          companion from the same camera. 24 frames: cloud-mask IoU min 0.883, p95
          band-emissivity error max 0.010.
      - image: phantom4_cloudscape/cumulus/frame_000010_cloud_band_agreement.png
        width: full
        caption: >-
          One frame, three panels: the infrared march's band emissivity, the emissivity the
          visible march implies, and five times their absolute difference.
    note: |
      The score compares the two integrators with each other, not with the world: the cloud's
      radiance against calibrated imagery is `XD.6` part 2. Cirrus takes the water cloud's 0.5
      band ratio (the large-particle limit; not measured) and, like every genus, the temperature
      of its height.
    source: scripts/render_phantom4.py

  - id: cloud-function
    title: The cloud as a function, marched per pixel
    lead: |
      An audit of the shipped clouds in Isaac Sim (`outputs/cloud_audit/`) showed why they still
      looked wrong after four steps of corrections: the real-time sky is a cloud painted on a dome
      texture, about fifteen camera pixels per cloud texel and a different sharpness in every
      direction, and the path tracer's cloud is a 60 m voxel grid. Since `WX.23` the cloud is a
      function instead (ADR 0185), the way Unreal Engine's volumetric clouds are built: a weather
      map says where the clouds are and how tall, a height profile gives each its flat base and
      rounded top, and two tiling noises erode the edge. A GPU kernel marches that function along
      every camera pixel's ray in 6–13 ms a frame, lights it by the sun's two-stream chord and a mix
      of sky and ground light, and the sky model composes it through the air in front of it. The
      same function is what the infrared march will read, so there is nothing picture-based left to
      convert. Not yet in the live viewport or the path tracer; the look is a first pass.
    media:
      - image: cloud_function/four_headings.png
        width: full
        caption: >-
          The rotation test. One sky at 14:30 UTC, 35 % cumulus, a 70° camera 22° up, pointed
          north, east, south and west (clockwise from top left; the sun is in the west). The dome
          could not give these four frames the same sharpness.
      - video: cloud_function/cloud_function_pan.mp4
        caption: >-
          The camera turns through a full circle at 14:30 UTC, 90 frames, 1280 × 720.
      - video: cloud_function/cloud_function_day.mp4
        caption: >-
          One heading (300°) from 05:30 to 20:18 UTC on 21 June at Munich, 60 frames: the sun
          rises behind the camera, crosses the frame in the afternoon, and sets in it, with the
          silver lining and the dark bases that follow from the two-stream chord. Auto-exposed
          through an ACES curve as a stand-in camera, not the RTX tonemapper.
    source: scripts/cloud_look.py

  - id: cloud-shape
    title: Clouds the size real clouds are
    lead: |
      Satellite studies measure real cumulus from above. Their outlines have an area–perimeter
      dimension of 1.3–1.4, and their sizes fall as a power law with exponent 1.7–2.0 below about
      a kilometre. Since `WX.6` the field is measured the same way (ADR 0184). Its outlines were
      already right, but its sizes were not: an exponent of 2.58, meaning clouds about a kilometre
      across plus specks. With thermals of several sizes in the map that places them, 35 % cumulus
      gives 1.91. Stratocumulus had been stretched 6 : 1 along one axis of the field, whatever the
      wind. It is now a broken sheet of cells, as real stratocumulus is.
    media:
      - image: cloud_shape/plan_before_after.png
        width: full
        caption: >-
          The field from above, as visible optical depth, two 15.36 km tiles side by side. From top:
          35 % cumulus before and after; 60 % stratocumulus before and after. The tiles still repeat;
          that is `WX.22`.
      - video: cloud_shape/stratocumulus_before_after.mp4
        caption: >-
          60 % stratocumulus from the ground, 25° up with a 70° field of view, from 10:00 to 16:00 UTC
          in 24 frames. Left: weather-fx `582bf47`. Right: `7d15e58`.
      - video: cloud_shape/cumulus_before_after.mp4
        caption: >-
          The same camera over 35 % cumulus.
    source: scripts/cloud_look.py

  - id: sky-flat-bowl
    title: What a camera adds to an empty sky
    lead: |
      A clear sky gives the AGC no contrast of its own, so a real uncooled core pointed at one shows
      a smooth bowl filling the frame: its housing seen through the field (§8.2) and the housing's
      drift since the last shutter event (§11.2). `scripts/validate_sky_flat.py` renders
      `sky_only.yaml` through the Boson 640, takes the shutter, lets the housing cool 1.5 K, and fits
      a plane plus a paraboloid to every frame. **The rendered drift bowl and a public clear-sky frame
      have the same sign and nearly the same radial profile**: the paraboloid explains 99.9 % of the
      rendered drift and 86 % of the real frame.
    media:
      - image: validation/sky_flat/profiles.png
        width: half
        caption: >-
          Plane-removed radial profiles, normalised. Orange: the rendered camera drift alone. Green:
          the real frame. Blue: the rendered frame with the sky, whose own curvature points the
          other way at 45° elevation.
    note: |
      The real frame is measured, not published: the figure carries its profile, not its pixels.
      Near the zenith the sky is itself a dark-centred bowl (the zenith is its coldest point), so a
      bright centre there needs the housing to have cooled by about 1.7 K or more since the shutter
      closed, or a black-hot display.
    source: scripts/validate_sky_flat.py

  - id: sky-ici
    title: The clear night sky against a calibrated sky camera
    lead: |
      ARM's Infrared Cloud Imager looked straight up at the Southern Great Plains site through
      2023 and recorded the sky in W/(m²·sr) per pixel (doi:10.5439/3001561). `XD.6` holds the
      layered clear sky (ADR 0071) to 30 of its cloud-free images on three nights, with each night's
      surface temperature and water vapour as the only weather (ADR 0183). **On the cold, dry
      December night the model is the measurement to 0–7 % from 20° to the zenith; on the humid
      August night it is 24–28 % too bright at every elevation**, where the instrument's own model is
      within 3 %. That humid misfit is now a strict expected failure naming its fix, `AT.37`.
    media:
      - image: validation/ici/ici_clear_sky.png
        width: full
        caption: >-
          Grey: the ICI's measured clear-pixel radiance. Red: irsim's layered sky. Blue dashed: the
          instrument's own clear-sky model. 21 May (20.8 °C, 1.41 cm), 6 Aug (27.0 °C, 3.96 cm),
          11 Dec (2.5 °C, 0.86 cm)
    note: |
      The ICI's spectral response is not published; the model uses the project's estimated VOx curve
      for a 7.3–14 µm microbolometer. That moves the December result by under 7 %, and it cannot
      make a misfit that grows with humidity. The cloudy images in the same files are `XD.6`'s
      second part.
    source: scripts/validate_sky_ici.py

  - id: validation-phase-renders
    title: A detector's training set, rendered
    lead: |
      The validation phase trains one small detector on real infrared frames, on irsim renders and
      on both, and scores all three on the same real sky-only frames
      (`docs/research/2026-10-04-validation-phase-sky-only-detection.md`, ADR 0188). These are the
      renders: a DJI Phantom 4 through the Boson 640 core behind a 50 mm lens, the camera's own
      8-bit AGC. **Trained on 1,800 rendered frames alone, YOLO11n reaches mAP50 0.494 on 7,255
      real test frames, against 0.991 for the same detector trained on real frames; trained on
      both, mAP50-95 is 0.583 against 0.568 for real frames alone** — one seed each, a first
      measurement and not a verdict.
    media:
      - video: aerial_dataset/irsim_sky_v1/clear_000/phantom4_agc.mp4
        width: half
        caption: >-
          One of the six training clips: a continuous random flight (`--track wander`), 300 frames
          across a 1,666 s mission at 09:45 UTC. 22–77 m, 34–115 px across, elevation 6.5–18.5°;
          the motors go from 23.0 °C to 41.8 °C and back as the aircraft lands.
      - image: validation_phase/pilot_sheet.png
        width: full
        caption: >-
          28 of the 300 pilot frames (`--track scatter`), with the box the renderer wrote beside
          each drawn in green: every frame an independent range (16–130 m), elevation (6–35°),
          bearing, heading and place in the frame.
    note: |
      Clear sky only, one airframe, and the boxes do not include the rotor discs. The real frames
      the detector is scored on carry no stated licence and are not shown.
    source: scripts/generate_aerial_dataset.py

  - id: first-human
    title: The first human, labelled by his skeleton
    lead: |
      An adult man generated from MakeHuman's CC0 base mesh and skin by `scripts/make_human.py`,
      labelled onto the body schema by his own skeleton with `scripts/prep_human.py` — the bone
      with the most weight on a vertex names its segment — and split into **seventeen segment
      objects** (head, neck, chest, back, pelvis, two upper arms, two forearms, two hands, two
      thighs, two lower legs, two feet) plus eyes, eyebrows and eyelashes, then through the same
      asset prep as every drone. **Left and right segments agree in area to 2.6 %**; the feet
      confirm which way he faces; the measured stature is **1.724 m**, and in the frame he stands
      **713 px tall against 718 px** from the 28 mm lens at 5.6 m. The infrared frame is one
      temperature on purpose: this step is the body and the camera, `HU.4` gives the seventeen
      segments their own skin temperatures from JOS-3.
    media:
      - image: humans/man_adult/hero/frames/rgb_00002.png
        width: half
        caption: the visible companion — the standing man on the zoo scene's ground
      - image: humans/man_adult/hero/frames/ir_00002.png
        width: half
        caption: LWIR, white-hot — one node for the whole body until HU.4
    note: |
      The whole body is CC0 (MakeHuman community assets) and the labelled model is in the asset
      library as `man_adult`. The same two scripts take a woman and a child as macro changes
      (`HU.6`), and any downloaded rigged human (`HU.9`).
    source: scripts/make_human.py, scripts/prep_human.py, scripts/render_phantom4.py

  - id: jos3-segments
    title: Seventeen skin temperatures, from the weather
    lead: |
      The same man as above, one step later: his skin is no longer one node but **seventeen
      segments solved by JOS-3** — the thermoregulation model, as its authors ship it — forced
      by the scene's own weather and sun. At this clear summer noon (26 °C air, the sun at 61°)
      the radiant temperature a standing body sees is **47 °C**, and the segments spread from
      **34.5 °C** at the pelvis to **31.1 °C** at the hands: the camera's surface plane matches the
      solver on every segment to **0.001 K**. In the cold the order is the physiological one —
      at 0 °C in a 1 m/s wind, bare, the head holds **27.9 °C** while the hands fall to **9.4 °C**
      and the feet to **8.5 °C**.
    media:
      - image: humans/man_adult/jos3/frames/ir_00002.png
        width: half
        caption: LWIR, white-hot — one temperature per segment, the pelvis warmest at noon
      - image: humans/man_adult/jos3/frames/rgb_00002.png
        width: half
        caption: the visible companion, the same instant
    note: |
      The seams between segments are hard on purpose: a segment is one JOS-3 node (ADR 0192). The
      ground is taken at air temperature in the radiant balance and the man wears nothing yet;
      `HU.5` dresses him and solves each garment's surface.
    source: configs/scenes/man_standing_clear.yaml, scripts/render_phantom4.py

  - id: dressed-man
    title: A blue shirt and a red shirt are the same cloth
    lead: |
      The man dressed: a T-shirt, wool trousers and shoes, each **its own prim and its own
      temperature** — ISO 7730's clothing balance on the JOS-3 skin beneath it, absorbing its own
      share of the sun. Change the shirt's `colour_rgb` in one line of the asset config and
      re-run the prep: the RGB camera sees a different shirt, the thermal camera the same cloth.
      Measured at this noon: a white T-shirt **31.8 °C**, a black one **33.9 °C**, and the blue
      and the red **0.03 K** apart — colour never touches the long-wave emissivity (Zhang 2009),
      it only sets how much sun the dye absorbs. All 23 prims match the solver to **0.0005 K**.
    media:
      - image: humans/man_adult_dressed/summer_blue/frames/rgb_00002.png
        width: third
        caption: the blue shirt, RGB
      - image: humans/man_adult_dressed/summer_red/frames/rgb_00002.png
        width: third
        caption: the red shirt, RGB — one line of YAML changed
      - image: humans/man_adult_dressed/summer_blue/frames/ir_00002.png
        width: third
        caption: LWIR — identical for both shirts
    note: |
      Luminance is the whole of colour here: two dyes of equal luminance absorb the same sun. The
      upgrade is a measured reflectance curve per dye (ADR 0195).
    source: configs/scenes/man_dressed_summer_noon.yaml, scripts/prep_human.py, scripts/render_phantom4.py

  - id: winter-night
    title: In winter a person is a face
    lead: |
      The same man on a clear January night, −5 °C, the sky 12 K colder than the air, two hours
      out. His head reads **25 °C**; the T-shirt over a chilled chest **13 °C**; the wool trousers
      **4 °C**, the shoes **1 °C**, and his bare hands **2.7 °C** — JOS-3 lets them fall to within
      8 K of the air in two hours, so the hands are not the bright things the winter street
      scene was expected to show; the face is, by 20 K. A 1 clo coat on him would read 0.4 °C.
    media:
      - image: humans/man_adult_dressed/winter_night/frames/ir_00002.png
        width: full
        caption: LWIR, white-hot, a clear January night at 03:00
    note: |
      The clothes reflect the cold sky: the trousers' apparent temperature is −5 °C against a
      surface at +4 °C, through wool's 0.75 emissivity. That is physics, not a defect.
    source: configs/scenes/man_dressed_winter_night.yaml, scripts/render_phantom4.py
