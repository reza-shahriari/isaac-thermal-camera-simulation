  - id: four-bands-sky-target
    title: A point target against sky, four bands
    lead: |
      The aerial point-target lane: a small target against a clear sky at dawn, where the sky's
      radiance-versus-elevation gradient is the whole background. These four are pre-AGC, mapped
      from radiance directly.
    media:
      - image: multiband/sky_target/sky_target_contact_sheet.png
